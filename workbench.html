    return Math.max(1, Math.min(budget, MAX_SHOTS_PER_EP));
  }

  // 分集秒数护栏（#674）：根据全文体量给出"内容驱动"的健康每集秒数建议，避免用户把秒数拉太高产生水镜。
  function segShotSuggestion(p) {
    var bodies = bodyParagraphs(p);
    var totalChars = bodies.reduce(function (a, b) { return a + (b.text || '').replace(/\s/g, '').length; }, 0);
    var est90 = Math.max(1, Math.round(totalChars / 540)); // 以 90s/集 估集数
    var avgChars = est90 ? Math.round(totalChars / est90) : 0;
    var shotCount = Math.max(8, Math.round(avgChars / 30));
    shotCount = Math.min(shotCount, MAX_SHOTS_PER_EP);
    var suggestedSec = Math.max(20, Math.min(600, shotCount * curShotDur()));
    return { totalChars: totalChars, est90: est90, avgChars: avgChars, shotCount: shotCount, suggestedSec: suggestedSec };
  }

  // 实时文案：当前秒数下每集大约会生成多少镜（与 calcShotBudget 同口径）
  function formatSegHint(segSug, seconds) {
    if (!segSug || !segSug.totalChars) return '';
    var en = (window.SW_I18N && SW_I18N.getLang() === 'en');
    var sec = Math.max(20, seconds || 90);
    var est = Math.max(1, Math.round(segSug.totalChars / (sec * 6)));
    var avgChars = Math.round(segSug.totalChars / est);
    var byChars = Math.max(8, Math.round(avgChars / 30));
    var budget = Math.max(1, Math.min(Math.floor(sec / curShotDur()), byChars, MAX_SHOTS_PER_EP));
    var over = sec > segSug.suggestedSec * 1.5;
    var lead = en
      ? ('About ' + segSug.totalChars + ' chars (≈' + segSug.est90 + ' episodes, avg ' + segSug.avgChars + ' chars) → content-driven suggestion: ≤' + segSug.suggestedSec + 's per episode (≈' + segSug.shotCount + ' shots)')
      : ('全文约 ' + segSug.totalChars + ' 字（约 ' + segSug.est90 + ' 集，均集 ' + segSug.avgChars + ' 字）→ 内容驱动建议每集 ≤ ' + segSug.suggestedSec + ' 秒（约 ' + segSug.shotCount + ' 镜）');
    var tail = en
      ? ('; at ' + sec + 's this generates about ' + budget + ' shots' + (over ? ' — over 1.5× the suggestion, expect repetitive filler' : '') + '.')
      : ('；当前 ' + sec + ' 秒将生成约 ' + budget + ' 镜' + (over ? '，已超建议 1.5 倍，易出重复水镜' : '') + '。');
    return lead + tail;
  }

  function expandOutlineMessages(charLines, shells, cfg, continuity) {
    var seconds = (cfg && cfg.seconds) || 90;
    var shotBudget = Math.min(MAX_SHOTS_PER_EP, Math.max(1, Math.floor(seconds / curShotDur())));
    var charsTxt = charLines.length
      ? '【核心人物设定（仅供定妆/外貌参考，绝不代表本段可以让他们出场；本段文本里没出现的人物，剧本中一律不得出现）】\n' + charLines.join('\n') + '\n\n'
      : '';
    var listed = shells.map(function (ep, i) {
      var budget = ep.shotBudget || calcShotBudget(ep);
      return '[' + (i + 1) + '] 目标时长 ' + (ep.seconds || seconds) + ' 秒 · 约 ' + budget + ' 镜 · 标题：' + ep.title + '\n【待改写的小说正文】\n' + (ep.text || '');
    }).join('\n\n---\n\n');
    var contBlock = (continuity && continuity.trim())
      ? '\n【连续性骨架】\n' + continuity + '\n注意：上述骨架只用于把握本集在整季中的位置与情绪走向，绝不代表本集可以出现其他集专属的事件或人物。\n\n'
      : '';
    var sys = '你是专业短剧编剧兼导演。你的任务不是「翻译」或「格式化」小说，而是从一段小说里**先提炼出一部可以在 ' + seconds + ' 秒内拍完的短剧的核心戏剧事件**，再围绕这个事件写剧本。\n\n' +
      '【第一步：先抽象戏剧事件，再下笔】\n' +
      '写任何剧本之前，你必须先从小说里抓出一个**能独立成戏的戏核**——有人物目标、有阻碍、有转折、有悬念的"这一集真正要拍的那件事"。所谓"戏核"只能来自**本段文本自身**已经发生或明确铺垫的内容，不得向其他段落借人物、借事件。\n\n' +
      '【最高铁律——禁止编造（违反即不合格）】\n' +
      '0. 只使用本段文本中【已经出现】的人物、事件、地点。绝对禁止引入本段未出场的人物（哪怕它在人物设定里出现过），绝对禁止编造本段未发生的冲突或情节。若本段仅为氛围/铺垫/人物亮相（如开篇写景、纯心理活动），则只做"立人物 + 建立困境基调"的钩子镜头——用本段已有的描写撑起情绪与处境，严禁为了凑冲突而借用其他段落的角色或自己加戏。例：开篇只写小女孩寒冬劈柴，则戏核就是"三岁孤女在酷寒里替病弱奶奶挣柴火"，钩子镜头只拍她裂手、破袄、呼白气，不要凭空出现鞭打/抢柴/药罐等本段没有的戏。\n\n' +
      '【戏剧事件卡片 eventCard（必填，先填它再写剧本）】\n' +
      '- core（一句话核心事件）：这集到底在讲什么"戏"。如果本段只是氛围铺垫，core 也要 honest 写成氛围铺垫，不要硬编冲突。\n' +
      '- want（主角想要/正在做什么）：具体目标与动机。纯铺垫段可以写"无"或"只是呈现处境"。\n' +
      '- block（阻碍/冲突）：她遇到什么具体困难、对手或矛盾。必须是本段文本里已有的阻碍；**若没有，诚实填"无"，禁止硬编对手**。\n' +
      '- turn（转折）：剧情在哪一点反转、升级、或揭示关键信息。若没有，诚实填"无"。\n' +
      '- cliff（卡点）：结尾停在哪个悬念或强情绪上。纯铺垫段停在"情绪定格"也算卡点；若没有，诚实填"无"。\n\n' +
      '【第二步：围绕事件写剧本——铁律】\n' +
      '1. 剧本所有内容必须服务于 eventCard 的事件，且事件必须来自本段。删除一切不推动该事件的纯环境描写、纯外貌描写、纯氛围铺陈、无关心理活动。\n' +
      '2. 优先四节拍结构，但允许"弱冲突"或"纯铺垫"节拍。总镜头约 ' + shotBudget + ' 个：钩子（立人物+处境）→ 冲突（可选，本段有冲突才写）→ 转折（可选）→ 卡点（情绪定格或悬念）。如果本段没有对手/冲突，就只写钩子+情绪升华，不要硬凑。\n' +
      '3. 动作+对白驱动，禁止旁白概述；对白 250~350 字，口语化、有冲突。纯铺垫段对白可以极少甚至为零。\n' +
      '4. 场景极简，1~3 个核心场景。\n' +
      '5. 动作必须具体可拍（不写"她很伤心"，写"她攥紧柴刀、指节发白"）。\n' +
      '6. 核心人物、人物关系、关键事件、核心设定不能丢；但"怎么呈现"由你重新设计。\n' +
      '7. 出场人物严格限定在本段文本出现过的角色；人物设定仅用于统一外貌/定妆，绝不作为"让该角色出场"的许可。\n\n' +
      '【剧本格式】\n' +
      '1. 场景标题「场景·地点·时间」写在段首。\n' +
      '2. 动作神态用（）括起且具体。\n' +
      '3. 对白「角色名：台词」。\n\n' +
      contBlock +
      '【输出 JSON】长度严格等于输入段数；每项对象：\n' +
      '{\n' +
      '  "eventCard": { "core":"一句话核心事件", "want":"主角想要", "block":"阻碍/冲突", "turn":"转折", "cliff":"卡点" },\n' +
      '  "script": "围绕事件写的紧凑可拍剧本（四节拍完整，已删无关描写）",\n' +
      '  "summary": "30~50字核心事件+情绪落点",\n' +
      '  "beats": [ "钩子·0-5秒·具体动作/对白", "冲突·5-25秒·具体动作/对白", ... ],\n' +
      '  "scenes": [ { "name": "场景名", "text": "该场景剧本正文" } ]\n' +
      '}\n' +
      '只输出 JSON 数组，不要解释、不要代码块围栏。';
    return [
      { role: 'system', content: sys },
      { role: 'user', content: charsTxt + listed }
    ];
  }

  // 调平台理解引擎，把 shells（已切好的集壳，text=原梗概）逐集扩写成剧本正文；免费。
  // 成功：ep.source=原梗概存档，ep.text=扩写剧本；失败返回 false（调用方降级保留梗概）。
  // 校验 AI 改写是否编造了本段未出场的人物。返回 null=无编造；否则返回编造的角色名数组。
  function checkFabrication(ep, item, charNames) {
    var source = (ep.source || ep.text || '').toString();
    var script = ((item && item.script) || '').toString();
    var ev = (item && item.eventCard) || {};
    var evText = ['core', 'want', 'block', 'turn', 'cliff'].map(function (k) { return (ev[k] || ''); }).join(' ');
    var allText = script + '\n' + evText;
    // 生成可能的昵称/后缀变体，避免原文用"小满"、AI 输出用"林小满"全名时被误判为编造。
    function nameVariants(name) {
      var set = {};
      if (!name) return set;
      set[name] = true;
      if (/^[\u4e00-\u9fa5]{2,6}$/.test(name)) {
        for (var i = 1; i < name.length && (name.length - i) >= 2; i++) {
          set[name.slice(i)] = true;
        }
      }
      return set;
    }
    function hasVariant(name, text) {
      var vs = nameVariants(name);
      for (var v in vs) {
        if (text.indexOf(v) >= 0) return true;
      }
      return false;
    }
    var present = {};
    (charNames || []).forEach(function (name) {
      if (hasVariant(name, source)) present[name] = true;
    });
    var fabricated = [];
    (charNames || []).forEach(function (name) {
      if (hasVariant(name, allText) && !present[name]) fabricated.push(name);
    });
    return fabricated.length ? fabricated : null;
  }

  function expandOutlineToScript(p, shells, cfg) {
    // 汇总人物设定（优先 bible.characters，兜底从 blocks 的 profile 提取）
    var charLines = [];
    var charNames = [];
    var chars = (p.bible && p.bible.characters) || [];
    chars.forEach(function (c) {
      if (c && c.name) {
        charLines.push('- ' + c.name + (c.role ? '（' + c.role + '）' : '') + ((c.appearance || c.desc) ? '：' + (c.appearance || c.desc) : ''));
        charNames.push(c.name);
      }
    });
    if (!charLines.length) {
      (p.script.blocks || []).forEach(function (b) {
        if (b.type === 'profile' && b.meta === 'character' && b.name) {
          charLines.push('- ' + b.name + (b.role ? '（' + b.role + '）' : '') + (b.desc ? '：' + b.desc.slice(0, 60) : ''));
          charNames.push(b.name);
        }
      });
    }
    // #723：转剧本加 120s 硬超时，避免无 timeout 时默认 360s 挂死；同时把原始响应当次日志吐出，方便定位失败。
    return MG.api('/api/llm', 'POST', { messages: expandOutlineMessages(charLines, shells, cfg, buildContinuityContext(p, shells)) }, 120000).then(function (r) {
      if (!(r && r.ok && !r.noKey && r.text)) {
        if (r && r.noKey) alert('我这边还没接上写作通道（缺少密钥），剧本扩写没法自动做。原始分集梗概我原样留着没动，你可以在集工作区自己补写，或者去设置里补上密钥再让我重跑。');
        console.log('[rewrite] API not ok:', r);
        return { ok: false, fails: [{ reason: (r && r.err) ? r.err : (_swEn() ? 'I did not get valid content' : '我没拿到有效内容') }] };
      }
      var arr = extractJsonArray(r.text);
      if (!Array.isArray(arr) || arr.length !== shells.length) {
        console.error('[rewrite] JSON parse/length fail. expect=' + shells.length + ' got=' + (arr ? arr.length : 0) + ' rawLength=' + (r.text || '').length + '\n' + (r.text || ''));
        return { ok: false, fails: [{ reason: _swEn()
          ? ('The AI reply is not a valid JSON array (length=' + (arr ? arr.length : 0) + ', expected=' + shells.length + '). Refunded — please retry')
          : ('AI 返回格式不是合法 JSON 数组（长度=' + (arr ? arr.length : 0) + '，期望=' + shells.length + '），已退款，请重试') }] };
      }
      var fails = [];
      shells.forEach(function (ep, i) {
        var item = arr[i];
        var script = (item && typeof item === 'object' && item.script != null) ? String(item.script)
          : (typeof item === 'string' ? item : '');
        var summ = (item && typeof item === 'object' && item.summary != null) ? String(item.summary).trim() : '';
        script = (script || '').toString().trim();
        if (script) {
          ep.source = ep.text || ''; // 原始梗概存档（对照用）
          // 反编造校验：AI 改写的剧本/事件卡片里出现的人物，必须在本段原文里出现过
          var fab = checkFabrication(ep, item, charNames);
          if (fab && fab.length) {
            fails.push({ index: i, title: ep.title, reason: (_swEn()
              ? ('The AI invented characters that never appear in this segment: ' + fab.join(', ') + '. Blocked — the original text is kept.')
              : ('检测到 AI 编造本段未出场角色：' + fab.join('、') + '，已拦截并保留原文。')) });
            return; // 该集不接受改写，保留原 ep.text
          }
          ep.text = script;          // 扩写后的剧本正文（分镜要吃的）
          if (summ) ep.summary = summ; // 顺带提取剧情概要
          ep.rewriteMode = 'llm';    // 标记为 AI 改写成功
          // ① 结构化剧本层：把本段内的场景切分存下来，供「场景接分镜」与场景边界识别使用
          var sc = (item && typeof item === 'object' && Array.isArray(item.scenes)) ? item.scenes : [];
          ep.scriptStruct = sc.length ? { scenes: sc.map(function (s) {
            return { name: (s && s.name) ? String(s.name) : '', text: (s && s.text) ? String(s.text) : '' };
          }) } : null;
          // ③ 戏剧事件卡片：编剧 Agent 先抽象出本集戏核（想要/阻碍/转折/卡点），供分镜强约束 + 用户把关
          var ev = (item && typeof item === 'object' && item.eventCard && typeof item.eventCard === 'object') ? item.eventCard : null;
          ep.eventCard = ev ? {
            core: (ev.core != null) ? String(ev.core) : '',
            want: (ev.want != null) ? String(ev.want) : '',
            block: (ev.block != null) ? String(ev.block) : '',
            turn: (ev.turn != null) ? String(ev.turn) : '',
            cliff: (ev.cliff != null) ? String(ev.cliff) : ''
          } : null;
          // ② 短剧节拍：把四节拍镜头列表存下来，供分镜直接按节拍生成镜头，避免再按句子切描述性镜头
          var beats = (item && typeof item === 'object' && Array.isArray(item.beats)) ? item.beats : [];
          ep.beats = beats.map(function (b) { return (b == null) ? '' : String(b); }).filter(Boolean);
        }
      });
      return { ok: fails.length === 0, fails: fails };
    }).catch(function () { return { ok: false, fails: [] }; });
  }

  // 场景标头识别：章内「X · Y · Z」式时空标头，或强时空跳转开场句
  function isSceneMarker(ln) {
    if (!ln) return false;
    // 强场景标头：中文＋间隔号三段（须为短标头，如「古代 · 秋云集 · 午后」「现代 · 林家客厅 · 续」）
    if (ln.length <= 40 && /^[一-龥]{1,6}\s*[·・]\s*[一-龥]{1,10}\s*[·・]\s*[一-龥]{1,8}$/.test(ln)) return true;
    // 强时空跳转开场：当天晚上 / 与此同时 / 第二天 / 午夜 / 一年后 等（允许长句，不卡长度）
    if (/^(当天晚上|与此同时|同一时刻|同一时间|第二天|次日|午夜|凌晨|傍晚|深夜|清晨|黄昏|一年后|半年后|一个月后|半个月后|一周后|三天后|数日后)[，,。：:·]/.test(ln)) return true;
    // 弱开场（后来）：仅当整行很短，避免误切中段叙述
    if (ln.length <= 24 && /^后来[，,。：:]/.test(ln)) return true;
    return false;
  }

  // 把「一整章」按章内场景标头拆成多个可拍摄的场景段；无标头则保持原样
  function splitBySceneMarkers(eps, cfg) {
    var out = [];
    eps.forEach(function (ep) {
      var text = ep.text || '';
      var lines = text.split(/\r?\n/);
      var breaks = [];
      for (var i = 0; i < lines.length; i++) {
        var ln = lines[i].trim();
        if (ln && isSceneMarker(ln)) breaks.push(i);
      }
      if (!breaks.length) { out.push(ep); return; }
      var bounds = [0].concat(breaks).concat([lines.length]);
      for (var b = 0; b < bounds.length - 1; b++) {
        var s = bounds[b], e = bounds[b + 1];
        var seg = [];
        for (var k = s; k < e; k++) { var t = lines[k].trim(); if (t) seg.push(t); }
        if (!seg.length) continue;
        var segText = seg.join('\n');
        var firstLn = seg[0];
        var title;
        if (isSceneMarker(firstLn)) {
          var t2 = firstLn.replace(/^当天晚上[，,]/, '').replace(/\s*[·・]\s*/g, '·');
          var cut2 = t2.split(/[，,。：:——]/)[0].trim();
          title = (cut2 && cut2.length >= 2 && cut2.length <= 18) ? cut2 : t2.slice(0, 18);
        } else {
          title = cleanEpisodeTitle(ep.title, segText);
        }
        var ne = makeEpisode([], segText, title, '', cfg, out.length);
        ne.source = segText;
        ne.parentTitle = ep.title;
        out.push(ne);
      }
    });
    return out;
  }

  // 用户已写分集标题时，按标题之间的正文归并成集；同一章内再按场景标头拆成多个场景段
  function segmentByHeadings(blocks, cfg) {
    var eps = [], curIdxs = [], curTexts = [], curTitle = '', curNum = 1, started = false, curHeadingText = '';
    function flush() {
      // 集标题自身可能就带着本集梗概（如「第 1 集：开学调座……」），去掉标题前缀后作为本集内容；
      // 即使集与集之间没有独立正文段落，也能切出完整的一集，不会被跳过
      if (!curIdxs.length && !curHeadingText) return;
      var txt = (curHeadingText ? [curHeadingText] : []).concat(curTexts).join('\n');
      var title = curTitle || ('第' + cn(curNum) + '集');
      eps.push(makeEpisode(curIdxs, txt, title, '', cfg, curNum - 1));
      curIdxs = []; curTexts = []; curHeadingText = ''; curNum++;
    }
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.type === 'episode') {
        flush();
        curTitle = b.text.replace(/^[#【\s]+|[】\s]+$/g, '').trim();
        // 去掉「第 N 集」标题前缀，剩下的是本集梗概正文
        curHeadingText = curTitle.replace(/^第\s*[0-9零一二三四五六七八九十百千]+\s*集[\s：:·\-—]*/, '').trim();
        started = true;
      } else if (b.type === 'body') {
        // 首个集标题之前的前言/正文一律忽略，避免被吸进第 1 集（导入大纲时的常见坑）
        if (!started) continue;
        curIdxs.push(i);
        curTexts.push(b.text);
      }
    }
    flush();
    return splitBySceneMarkers(eps, cfg);
  }

  // ============ 单入口：「按文档结构分集」 ============
  // 尊重作者三个尺度：章(故事弧) / 章内场景(时空切换) / 产品的「目标时长成片集」。
  // 流程：① 中枢大纲可用则沿用(原生中枢路径)；② 否则把文档解析为「章→场景」，章边界为硬断、
  //       场景标头识别时空切换；③ 章内把场景拆成句单元，按目标时长贪心打包（短场景合并凑满、
  //       长场景在句末切断、不瘦集、绝不删戏）；④ 强制剧本化层照常改写。

  // 章/集标题识别（扩充 parseScript 的 isEpisodeHeading，补上「第X章/卷」与序章楔子）
  function isChapterHeadingText(t) {
    var s = (t || '').replace(/^[#*_\s]+|[#*_\s]+$/g, '').trim();
    if (/^第\s*[0-9零一二三四五六七八九十百千]+\s*[章卷集]/.test(s)) return true;
    if (/^(序章|楔子|尾声|终章|番外|引子)[\s：:·\-—]/.test(s)) return true;
    return false;
  }
  function cleanChapterTitle(t) {
    var s = (t || '').replace(/^[#*_\s]+|[#*_\s]+$/g, '').trim();
    s = s.replace(/^第\s*[0-9零一二三四五六七八九十百千]+\s*[章卷集][\s：:·\-—]*/, '')
         .replace(/^(序章|楔子|尾声|终章|番外|引子)[\s：:·\-—]*/, '');
    return s.trim();
  }
  function sceneTitleFromMarker(line) {
    var t = (line || '').replace(/^当天晚上[，,]/, '').replace(/\s*[·・]\s*/g, '·');
    var cut = t.split(/[，,。：:——]/)[0].trim();
    return (cut && cut.length >= 2 && cut.length <= 18) ? cut : t.slice(0, 18);
  }

  // 把 blocks 解析成「章 → 场景」结构。章边界：episode 块 / title·section 块里的章标题 / 正文中的章标题行。
  // 场景边界：isSceneMarker 识别的时空标头（X·Y·Z 或「当天晚上」等）。无标头则整章一场景。
  function extractChapters(blocks) {
    var chapters = [], curCh = null, curSc = null;
    var seenHeading = false;   // 是否出现过「第X章/集」等章标题
    var preMatter = [];        // 首个章标题之前的「前言/人物设定/结构说明」等非剧集内容，命中章标题即作废
    function flushScene() { if (curSc && (curSc.text || '').replace(/\s/g, '').length) curCh.scenes.push(curSc); curSc = null; }
    function flushCh() { if (curCh) { flushScene(); chapters.push(curCh); } curCh = null; }
    function newCh(title) { flushCh(); curCh = { title: title || '', scenes: [] }; }
    function newSc(title, firstLine, blockIdx) {
      flushScene();
      curSc = { blockIdxs: [blockIdx], text: (firstLine || '') + '\n', title: title || '', marker: !!title };
    }
    function appendSc(line, blockIdx) {
      // 首个章标题出现前的内容：攒进 preMatter，绝不进成片（命中章标题后会被清空）
      if (!curCh) { preMatter.push({ line: line, blockIdx: blockIdx }); return; }
      if (!curSc) curSc = { blockIdxs: [blockIdx], text: '', title: '', marker: false };
      curSc.blockIdxs.push(blockIdx);
      curSc.text += line + '\n';
    }
    (blocks || []).forEach(function (b) {
      if (b.type === 'episode') {
        seenHeading = true; preMatter = [];   // 出现章/集标题，此前前言作废
        newCh(cleanChapterTitle(b.text));
        // 集/章标题行自带正文（如「第 1 集：开学调座…」）→ 后缀当首段内容，避免整段丢失
        var _er = b.text.replace(/^第\s*[0-9零一二三四五六七八九十百千]+\s*[章卷集][\s：:·\-—]*/, '')
                         .replace(/^(序章|楔子|尾声|终章|番外|引子)[\s：:·\-—]*/, '').trim();
        if (_er.replace(/[\s「」『』]/g, '').length > 20) {
          curSc = { blockIdxs: [b.blockIdx], text: _er + '\n', title: '', marker: false };
        }
        return;
      }
      if (b.type === 'title' || b.type === 'section') {
        if (isChapterHeadingText(b.text)) { seenHeading = true; preMatter = []; newCh(cleanChapterTitle(b.text)); }
        return; // 非正文区不进内容
      }
      if (b.type !== 'body') return;
      var lines = (b.text || '').split(/\r?\n/);
      for (var li = 0; li < lines.length; li++) {
        var ln = lines[li].trim();
        if (!ln) continue;
        if (isChapterHeadingText(ln)) {
          seenHeading = true; preMatter = [];   // 章标题出现，此前前言作废
          newCh(cleanChapterTitle(ln));
          // 章标题行自带正文（如「章2「开学调座…【钩子】」」）时，把后缀当首段内容，避免整段丢失
          var _pm = ln.match(/^(?:第\s*[0-9零一二三四五六七八九十百千]+\s*[章卷集]|序章|楔子|尾声|终章|番外|引子)[\s：:·\-—]*/);
          var _rest = ln.slice(_pm ? _pm[0].length : 0).replace(/^[「『]/, '').replace(/[」』]$/, '').trim();
          if (_rest.replace(/[\s「」『』]/g, '').length > 20) appendSc(_rest, b.blockIdx);
          continue;
        }
        if (!curCh) { preMatter.push({ line: ln, blockIdx: b.blockIdx }); continue; } // 章标题前的非剧集内容
        if (isSceneMarker(ln)) { newSc(sceneTitleFromMarker(ln), ln, b.blockIdx); continue; }
        appendSc(ln, b.blockIdx);
      }
    });
    // 若全文无任何章/集标题（纯小说/散文），把前言整体作为唯一章发出，保证零丢失（场景标头照常拆分）
    if (!seenHeading && preMatter.length) {
      newCh('');
      preMatter.forEach(function (m) {
        var ln = (m.line || '').trim();
        if (!ln) return;
        if (isSceneMarker(ln)) newSc(sceneTitleFromMarker(ln), ln, m.blockIdx);
        else appendSc(ln, m.blockIdx);
      });
    }
    flushCh();
    return chapters;
  }

  // 把一章的场景拆成「句单元」，场景标头首句带 sceneTitle（用于打包时保留场景标题行）
  function chapterPackUnits(ch) {
    var units = [];
    (ch.scenes || []).forEach(function (sc) {
      var lines = (sc.text || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
      lines.forEach(function (ln, i) {
        var parts = ln.split(/([。！？；…\.!?;]+)/);
        for (var j = 0; j < parts.length; j += 2) {
          var s = (parts[j] || '') + (parts[j + 1] || '');
          s = s.trim();
          if (!s) continue;
          var isStart = (i === 0 && j === 0 && sc.marker);
          units.push({ idxs: sc.blockIdxs.slice(), text: s, sceneTitle: isStart ? sc.title : '' });
        }
      });
    });
    return units;
  }

  // 按目标时长贪心打包句单元：短合并凑满、长场景在句末切断、不瘦集(尾部过瘦并入上一集)、绝不删内容。
  function packUnits(units, cfg, startIdx) {
    var target = (cfg.seconds || 90) * (cfg.charsPerSec || 6);
    var minChars = Math.floor(target * 0.5);
    var eps = [];
    var cur = { idxs: [], text: '', title: '', chars: 0 };
    function flush() {
      if (cur.chars > 0) {
        var ep = makeEpisode(cur.idxs, cur.text, cur.title || '', '', cfg, eps.length + startIdx);
        ep._idxs = cur.idxs.slice();
        eps.push(ep);
      }
      cur = { idxs: [], text: '', title: '', chars: 0 };
    }
    units.forEach(function (u) {
      var uc = (u.text || '').replace(/\s/g, '').length;
      if (cur.chars > 0 && (cur.chars + uc) > target && cur.chars >= minChars) flush();
      u.idxs.forEach(function (x) { if (cur.idxs.indexOf(x) < 0) cur.idxs.push(x); });
      cur.text += (cur.text ? '\n' : '') + u.text;
      cur.chars += uc;
      if (!cur.title && u.sceneTitle) cur.title = u.sceneTitle;
    });
    flush();
    // 尾部过瘦（<目标一半）且并入上一集不超 1.6 倍目标时，合并，避免瘦集
    if (eps.length >= 2) {
      var L = eps[eps.length - 1], P = eps[eps.length - 2];
      if (L.chars < minChars && (P.chars + L.chars) <= Math.floor(target * 1.6)) {
        var merged = makeEpisode(P._idxs.concat(L._idxs), P.text + '\n' + L.text, P.title || L.title, '', cfg, eps.length - 2 + startIdx);
        merged._idxs = P._idxs.concat(L._idxs);
        eps[eps.length - 2] = merged;
        eps.pop();
      }
    }
    return eps;
  }

  // 单入口分集：中枢大纲可用→沿用；否则文档结构(章内拆场景·按目标时长打包)
  function segmentByDocStructure(p, cfg) {
    var blocks = p.script.blocks || [];
    var oeps = segmentByOutline(p, cfg); // 原生中枢路径保留
    if (oeps && oeps.length) return { eps: oeps, mode: 'outline' };
    var chapters = extractChapters(blocks);
    var eps = [];
    if (chapters.length) {
      chapters.forEach(function (ch) {
        var packed = packUnits(chapterPackUnits(ch), cfg, eps.length);
        packed.forEach(function (e) { eps.push(e); });
      });
    }
    if (!eps.length) {
      // 兜底：整篇正文按句打包（无章无场景标头时）
      var bodies = bodyParagraphs(p);
      var scenes = bodies.map(function (b) { return { blockIdxs: [b.blockIdx], text: b.text, title: '' }; });
      eps = packUnits(chapterPackUnits({ scenes: scenes }), cfg, 0);
    }
    return { eps: eps, mode: 'doc' };
  }

  function makeEpisode(blockIdxs, text, title, summary, cfg, idx) {
    var seconds = (cfg && cfg.seconds) || 90;
    var cps = (cfg && cfg.charsPerSec) || 6;
    var chars = text.replace(/\s/g, '').length;
    var availableSeconds = Math.max(0, Math.ceil(chars / cps));
    var effectiveSeconds = Math.min(seconds, availableSeconds);
    var shortfallSeconds = Math.max(0, seconds - availableSeconds);
    var needChars = Math.max(0, seconds * cps - chars);
    return {
      id: 'ep' + (idx + 1),
      title: title || ('第' + cn(idx + 1) + '集'),
      summary: summary || '',
      paraRange: [blockIdxs[0] || 0, blockIdxs[blockIdxs.length - 1] || 0],
      seconds: seconds,
      chars: chars,
      availableSeconds: availableSeconds,
      effectiveSeconds: effectiveSeconds,
      shortfallSeconds: shortfallSeconds,
      needChars: needChars,
      shotBudget: calcShotBudget({ seconds: seconds, text: text }),
      text: text,
      outlineIndex: -1,
      characters: [],
      scenes: [],
      beats: [],
      eventCard: null,
      rewriteMode: 'rule'
    };
  }

  /* ---------- 步骤④ 改编剧本 / 步骤⑤ 生成分镜脚本 ---------- */
  function centralRefHtml(p, ep) {
    var en = (window.SW_I18N && SW_I18N.getLang() === 'en');
    var oi = (typeof ep.outlineIndex === 'number') ? ep.outlineIndex : -1;
    var olen = (p.bible.outline || []).length;
    var o = (oi >= 0 && p.bible.outline && p.bible.outline[oi]) ? p.bible.outline[oi] : null;
    var box = '<div class="central-ref">';
    box += '<div class="cr-head">' + (en
      ? ('Episode outline · Story Bible' + (o ? (' (' + (oi + 1) + ' / ' + olen + ')') : ' (none mapped yet)'))
      : ('本集大纲 · 故事中枢' + (o ? ('（第 ' + (oi + 1) + ' / ' + olen + ' 条）') : '（本集暂无对应大纲）'))) + '</div>';
    if (!o) {
      if (olen) {
        box += '<div class="cr-empty">本集排在中枢大纲 ' + olen + ' 条之后，暂无一一对应的条目。分镜仍以本集原文为准；可在步骤②查看全剧大纲对照，不影响成片。</div>';
      } else {
        box += '<div class="cr-empty">故事中枢尚未生成大纲。完成步骤②故事中枢（首次 AI 通读免费）后，各集会自动匹配对应大纲，无需二次付费。</div>';
      }
    } else {
      if (o.title) box += '<div class="cr-title">' + esc(o.title) + '</div>';
      if (o.summary) box += '<div class="cr-summary">' + esc(o.summary) + '</div>';
      if (o.planChars) {
        var meet = ep.chars >= 250 && ep.chars <= 700; // 90 秒短剧以对白驱动，字数只是参考，核心看节拍
        var shotN = ep.shotBudget || calcShotBudget(ep);
        box += '<div class="cr-chars ' + (meet ? 'ok' : 'warn') + '">目标时长 <b>' + (ep.seconds || 90) + 's</b> · 约 <b>' + shotN + ' 镜</b> · 节拍结构 <b>钩子/冲突/转折/卡点</b> · 对白建议 <b>250–350 字</b> · 本集已写 <b>' + ep.chars + '</b> 字</div>';
      }
      var tags = [];
      var _enT = (window.SW_I18N && SW_I18N.getLang && SW_I18N.getLang() !== 'zh');
      var _sepT = _enT ? ', ' : '、';
      if (o.characters && o.characters.length) tags.push('<span class="cr-tag">' + (_enT ? 'Characters: ' : '人物：') + esc(o.characters.join(_sepT)) + '</span>');
      if (o.scenes && o.scenes.length) tags.push('<span class="cr-tag">' + (_enT ? 'Scenes: ' : '场景：') + esc(o.scenes.join(_sepT)) + '</span>');
      if (o.beats && o.beats.length) tags.push('<span class="cr-tag">' + (_enT ? 'Beats: ' : '情节点：') + esc(o.beats.join(_sepT)) + '</span>');
      if (tags.length) box += '<div class="cr-tags">' + tags.join('') + '</div>';
      box += '<div class="cr-hint">创作与生成分镜时，请以本集大纲为锚，确保人物、场景、情绪与大纲一致，不跑偏。</div>';
    }
    box += '</div>';
    return box;
  }

  /* ---------- 步骤④ 改编剧本 / 步骤⑤ 生成分镜脚本（同一集工作台，按视图拆分） ---------- */
  function renderEpisode(p, view) {
    var en = (window.SW_I18N && SW_I18N.getLang() === 'en');
    ensureOutlineMapping(p);
    if (!p.episodes.length) {
      return '<div class="need-prev">还没有分集。<a id="goSeg">← 先回到步骤③分集大纲</a></div>';
    }
    if (p.curEp >= p.episodes.length) p.curEp = 0;
    var ep = p.episodes[p.curEp];

    // 集导航：横向 tab 条在百集剧会横向溢出，改为左侧集列表 + 右侧当前集详情（主战场导航）
    var epShellNav = '<aside class="md-nav"><div class="md-search"><input id="epSearch" placeholder="搜索集标题…"></div>' +
      p.episodes.map(function (e, i) {
        var active = (i === p.curEp) ? ' active' : '';
        return '<div class="md-nav-item' + active + '" data-epnav="' + i + '">' + esc((i + 1) + '. ' + (e.title || (en ? ('Episode ' + (i + 1)) : ('第 ' + (i + 1) + ' 集')))) + '</div>';
      }).join('') + '</aside>';
    function epShell(inner) {
      return '<div class="md-shell ep-shell">' + epShellNav + '<section class="md-detail" id="epDetail">' + inner + '</section></div>';
    }

    var hasBeats = ep.beats && ep.beats.length;
    var shortNote = !hasBeats
      ? '<span class="mode-note" style="color:#F5A623;">' + (en ? 'No short-drama beats yet — open this episode and hit "✨ To script" above' : '尚未生成短剧节拍，进入本集后点上方「✨ 转剧本」生成') + '</span>'
      : '<span class="mode-note" style="color:#2DD4A8;">' + (en ? ('Generated ' + ep.beats.length + ' short-drama beats') : ('已生成 ' + ep.beats.length + ' 个短剧节拍')) + '</span>';

    var rhythmHint2 = '';
    if (p.skill && p.skill.rhythm) {
      var rh = p.skill.rhythm;
      rhythmHint2 = '<div class="hint skill-rhythm-hint">' + (en
        ? ('Skill rhythm baseline: ~<b>' + (rh.epLen || '—') + 's</b> per episode · ~<b>' + (rh.shots || '—') + ' shots</b> · dialogue <b>' + (rh.dialogue || '—') + '</b>. This episode\'s shot budget is <b>' + (ep.shotBudget || 0) + ' shots</b> (bounded by length and character count; max ' + MAX_SHOTS_PER_EP + ' per episode).')
        : ('技能节奏基准：每集约 <b>' + (rh.epLen || '—') + 's</b> · 约 <b>' + (rh.shots || '—') + ' 镜</b> · 对白 <b>' + (rh.dialogue || '—') + '</b>。本集镜头预算为 <b>' + (ep.shotBudget || 0) + ' 镜</b>（受时长与字数共同约束，单集封顶 ' + MAX_SHOTS_PER_EP + ' 镜）。')) + '</div>';
    }
    var hlCls = (pendingHighlightEp === p.curEp) ? ' hl' : '';
    var ws;

    if (view === 'script') {
      // 改编剧本：剧情概要 + 原文/剧本，改写工具
      var scriptToolbar = '<div class="shot-toolbar">' +
        '<button class="primary-btn" id="btnRewriteEp">✨ 转剧本' + _mjChargeSuffix('to_script', 0) + '</button>' +
        '<button class="ghost-btn" id="btnExpandEp">✨ AI 补写' + _mjChargeSuffix('expand', 0) + '</button>' +
        '</div>';
      var hasScript = (ep.rewriteMode === 'llm');
      var hasOrig = !!(ep.source && ep.source !== ep.text);
      var srcHead, srcBody, srcHint = '';
      if (hasScript && hasOrig) {
        srcHead = '<span class="src-toggle"><button class="src-chip active" data-srcview="script">剧本</button><button class="src-chip" data-srcview="orig">原文</button></span>';
        srcBody = esc(ep.text);
        srcHint = '<div class="hint src-hint">「剧本」为本集 AI 改写后的可拍脚本，「原文」为导入时该集的原著段落，二者可随时切换对照。</div>';
      } else if (hasScript) {
        srcHead = '剧本';
        srcBody = esc(ep.text);
      } else {
        srcHead = '原文';
        srcBody = esc(hasOrig ? ep.source : ep.text);
      }
      ws = '<div class="ws ws-script' + hlCls + '">' +
        '<div><div class="ws-col-h">剧情概要</div><textarea class="ws-summary" id="epSummary" placeholder="本集剧情概要（可编辑）">' + esc(ep.summary || '') + '</textarea></div>' +
        '<div><div class="ws-col-h">' + srcHead + '</div><div class="ws-src" id="wsSrcBody">' + srcBody + '</div>' + srcHint + '</div>' +
        '</div>';
      var scriptFoot = '<div class="ws-foot">' +
        '<button class="primary-btn" id="btnToShots">下一步：生成分镜脚本 →</button>' +
        '<span class="hint" style="margin:0;">改写完成后进入分镜脚本，逐镜展开并出图。</span>' +
        '</div>';
      return epShell(centralRefHtml(p, ep) + rhythmHint2 + storyMapStripHtml(p) + scriptToolbar + ws + scriptFoot);
    }

    // 生成分镜脚本：列表 / 画布 双视图（P1-2）
    var isCanvas = (p.shotView === 'canvas');
    if (isCanvas) _shotSel = {};   // 进入画布先清残留多选态，避免重排后勾选错位
    var viewToggle = '<span class="shot-view-toggle">' +
      '<button class="svt-btn' + (isCanvas ? '' : ' active') + '" data-view="list">列表</button>' +
      '<button class="svt-btn' + (isCanvas ? ' active' : '') + '" data-view="canvas">画布</button>' +
      '</span>';
    // 镜头时长档选择器（5/10/15/30 秒）：切换后按「本集秒数 ÷ 档位」重算镜头预算
    var _sd = curShotDur(p);
    var _sdSeg = [5, 10, 15, 30].map(function (v) {
      return '<button class="svt-btn sd-opt' + (v === _sd ? ' active' : '') + '" data-sd="' + v + '">' + v + '秒</button>';
    }).join('');
    var _sdWarn = (_sd >= 30) ? ' title="30 秒档：多数视频模型单条上限 10~15 秒，出片后窗口按实际素材时长收缩，需多镜或分轨补足"' : '';
    var shotDurSel = '<span class="shot-view-toggle" id="shotDurSeg"' + _sdWarn + '>' +
      '<span class="sd-label">镜头时长</span>' + _sdSeg + '</span>' +
      '<span class="sd-budget">' + (en
        ? ('This episode: ' + (ep.seconds || 90) + 's ÷ ' + _sd + 's ≈ ' + calcShotBudget(ep) + ' shots')
        : ('本集 ' + (ep.seconds || 90) + 's ÷ ' + _sd + 's ≈ ' + calcShotBudget(ep) + ' 镜')) + '</span>';
    var shotsToolbar = '<div class="shot-toolbar">' + viewToggle +
      '<button class="primary-btn" id="btnGenShots">生成分镜' + _mjChargeSuffix('gen_shots', 0) + '</button>' +
      shotDurSel +
      '<button class="ghost-btn" id="btnContinuity">' + (en ? 'Continuity check' : '连续性检查') + '</button>' +
      '<button class="ghost-btn" id="btnAddShot">+ 添加镜头</button>' +
      (isCanvas ? '' : '<button class="ghost-btn" id="btnToggleAll">全部收起</button>') +
      '<span class="mode-note" id="shotMode">' + shotModeText(ep) + '</span>' +
      shortNote +
      '</div>';
    var shots = p.shots[ep.id] || [];
    MJ_setSketchList(shots);
    var emptyHint = '<div class="hint">这一集还没有分镜。点「生成分镜」，我按镜头预算拆出来；也可以自己「添加镜头」。</div>';
    var listCls = isCanvas ? 'shot-canvas' : 'shots';
    var listInner = shots.length ? shots.map(function (s, i) { return isCanvas ? shotTileHtml(s, i, p) : shotCardHtml(s, i, p); }).join('') : emptyHint;
    var batchBar = isCanvas ? '<div class="shot-batch-bar" id="shotBatchBar">' +

    var deliver = '';
    if (!isCanvas && shots.length) {
      function dsec(title, txt, id) {
        return '<div class="dlv-item"><div class="dlv-head"><b>' + title + '</b>' +
          '<button class="ghost-btn dlv-copy" data-dlv="' + id + '"' + (txt ? '' : ' disabled') + '>复制</button></div>' +

          dsec('字幕表（可直接贴剪映）', deriveSubtitleList(p, shots), 'sub') +

    ws = '<div class="ws ws-shots' + hlCls + '">' +

      '</div>';
    return epShell(centralRefHtml(p, ep) + rhythmHint2 + storyMapStripHtml(p) + ws);
  }

  function shotCardHtml(s, i, p) {
    var en = (window.SW_I18N && SW_I18N.getLang() === 'en');
    var preview = s.scene || (en ? ('Shot ' + (i + 1)) : ('镜 ' + (i + 1)));
    var warn = '';
    var warnEn = '';
    var fixHint = '';
    try {
      var _bn = ((p && p.bible && p.bible.characters) || []).map(function (c) { return c.name; }).filter(Boolean);
      var _un = (s.chars || []).some(function (nm) { return nm && nm.length >= 2 && _bn.indexOf(nm) < 0; });
      if (_un) fixHint = '<div class="shot-fix-hint" data-go="central">去故事中枢补定妆 →</div>';
    } catch (e) {}
    var vp = s.videoPrompt || s.prompt || '';
    if ((s.prompt || '').length > 500) { warn += ' 提示词超长'; warnEn += ' prompt too long'; }
    if (!s.videoPrompt) { warn += ' 缺图生视频词'; warnEn += ' missing video prompt'; }
    if (!/衔接前置|承接上|上一镜|衔接/.test(vp)) { warn += ' 缺连贯段'; warnEn += ' missing continuity link'; }
    if (warn) warn = '<span class="shot-warn">' + (en ? warnEn.trim() : warn.trim()) + '</span>';
    return '<div class="shot-card" data-i="' + i + '">' + fixHint +
      '<div class="shot-head" data-fold="' + i + '">' +
        '<span class="shot-num">' + (i + 1) + '</span>' +
        '<span class="shot-preview">' + esc(preview) + '</span>' +
        warn +
        '<span class="shot-toggle">▼</span>' +
        '<button class="shot-refine" data-i="' + i + '">🔄 精修' + _mjChargeSuffix('refine', 0) + '</button>' +
        '<button class="shot-del" data-i="' + i + '">删除</button>' +
      '</div>' +
      '<div class="shot-body">' +
        '<div class="shot-main">' +
          '<div class="shot-top"><input class="shot-title" data-i="' + i + '" value="' + esc(s.scene || '') + '" placeholder="场景 / 景别（标题）"></div>' +
          field(i, '人物', 'chars', s.chars && s.chars.length ? s.chars.join('、') : '', '人物名，多个用、分隔') +
          field(i, '动作', 'action', s.action || '', '画面中发生的动作') +
          field(i, '对白', 'dialogue', s.dialogue || '', '该镜对白（可空）') +
          field(i, '音效/配乐', 'sound', s.sound || '', '如：雨声 / 悬疑BGM（可空）') +
          field(i, '光线', 'light', s.light || '', '如：黄昏暖光 / 冷调') +
          field(i, '机位', 'camera', s.camera || '', '如：近景 / 俯拍') +
          shotSizeSelect(i, s.size || '') +
          field(i, '情绪', 'mood', s.mood || '', '如：紧张 / 温情') +
          field(i, '文生图提示词', 'prompt', s.prompt || '', '纯视觉：人物+场景+光线+景别+画风，供出图') +
          field(i, '图生视频提示词', 'videoPrompt', s.videoPrompt || s.prompt || '', '镜头运动+动作+时间轴+角色映射，供出视频') +
        '</div>' +
        '<div class="shot-right">' +
          '<div><div class="lab">时长(秒)</div><input type="number" min="1" max="30" step="1" data-k="dur" data-i="' + i + '" value="' + (s.dur || 5) + '"></div>' +
          '<div><div class="lab">节奏</div><select data-k="pace" data-i="' + i + '">' +
          paceOpt(s.pace || 'normal') + '</select></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
  function field(i, label, key, val, ph) {
    if (key === 'action' || key === 'dialogue' || key === 'sound' || key === 'prompt' || key === 'videoPrompt') {
      return '<div class="shot-field"><label>' + label + '</label>' +
        '<textarea data-k="' + key + '" data-i="' + i + '" placeholder="' + (ph || '') + '">' + esc(val) + '</textarea></div>';
    }
    return '<div class="shot-field"><label>' + label + '</label>' +
      '<input data-k="' + key + '" data-i="' + i + '" value="' + esc(val) + '" placeholder="' + (ph || '') + '"></div>';
  }
  function paceOpt(cur) {
    var arr = [['slow', '慢'], ['normal', '正常'], ['fast', '快']];
    return arr.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === cur ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('');
  }
  // 景别硬化（#583）：AI 分镜强制结构化景别，与编辑器 SHOT_SIZES 保持一致
  var WB_SHOT_SIZES = ['大远景','远景','全景','中景','近景','特写','大特写'];
  function shotSizeSelect(i, val) {
    return '<div class="shot-field"><label>景别</label><select data-k="size" data-i="' + i + '">' +
      [''].concat(WB_SHOT_SIZES).map(function (s) { return '<option value="' + esc(s) + '"' + (s === val ? ' selected' : '') + '>' + esc(s || '不指定') + '</option>'; }).join('') +
      '</select></div>';
  }

  // 分镜连续性检查：把当前项目交给内置 ShotLock 引擎跑 15 条规则。
  // 本地纯规则计算，不调模型、不花额度。
  function runContinuityCheck(p, btn) {
    var en = (window.SW_I18N && SW_I18N.getLang() === 'en');
    var lang = en ? 'en' : 'zh';
    var oldTxt = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = en ? 'Checking…' : '检查中…'; }
    return MG.api('/api/continuity_check', 'POST', { project: p, lang: lang })
      .then(function (r) {
        if (!r || !r.ok) {
          MG.alert((en ? 'Continuity check failed: ' : '连续性检查失败：')
            + ((r && (r.error || r.err)) || (en ? 'unknown error' : '未知错误')));
          return;
        }
        MG.modal({
          title: en ? 'Continuity check · ShotLock' : '连续性检查 · ShotLock',
          html: r.html || ''
        });
      })
      .catch(function (e) {
        MG.alert((en ? 'Continuity check failed: ' : '连续性检查失败：')
          + ((e && e.message) ? e.message : e));
      })
      .then(function () {
        if (btn) { btn.disabled = false; btn.textContent = oldTxt; }
      });
  }

  function wireEpisode(p, view) {
    if (!window.__storywrightShotFixBound) {
      document.addEventListener('click', function (e) {
        var el = e.target && e.target.closest ? e.target.closest('.shot-fix-hint') : null;
        if (el) {
          var pp = curProject();
          if (pp) { pp.step = 2; save(); render(); } // 去故事中枢补定妆
        }
      });
      window.__storywrightShotFixBound = true;
    }
    var go = document.getElementById('goSeg');
    if (go) go.onclick = function () { p.step = 3; save(); render(); };
    if (!p.episodes.length) return; // 尚未分集，只保留「先回到步骤③」链接，不做镜头区绑定

    Array.prototype.forEach.call(document.querySelectorAll('.md-nav-item[data-epnav]'), function (el) {
      el.onclick = function () {
        var i = parseInt(el.getAttribute('data-epnav'), 10);
        if (isNaN(i) || i === p.curEp) return;
        p.curEp = i;
        save(); renderStep(p);
      };
    });
    var epSearch = document.getElementById('epSearch');
    if (epSearch) epSearch.addEventListener('input', function () {
      var q = (epSearch.value || '').trim().toLowerCase();
      Array.prototype.forEach.call(document.querySelectorAll('.md-nav-item[data-epnav]'), function (it) {
        var txt = (it.textContent || '').toLowerCase();
        it.style.display = (!q || txt.indexOf(q) >= 0) ? '' : 'none';
      });
    });

    var sum = document.getElementById('epSummary');
    if (sum) sum.addEventListener('input', function () {
      p.episodes[p.curEp].summary = sum.value; scheduleSave();
    });

    var gen = document.getElementById('btnGenShots');
    if (gen) gen.onclick = function () { runGenShots(p, gen); };
    // 连续性检查（内置 ShotLock 引擎，纯本地规则计算）
    var cont = document.getElementById('btnContinuity');
    if (cont) cont.onclick = function () { runContinuityCheck(p, cont); };
    // 镜头时长档切换：写 p.shotDur → 重算本集镜头预算 → 重渲染（下重生成分镜即按新档位）
    var sdSeg = document.getElementById('shotDurSeg');
    if (sdSeg) Array.prototype.forEach.call(sdSeg.querySelectorAll('.sd-opt'), function (el) {
      el.onclick = function () {
        var v = parseInt(el.getAttribute('data-sd'), 10);
        if ([5, 10, 15, 30].indexOf(v) < 0 || v === curShotDur(p)) return;
        p.shotDur = v;
        // 全部集的镜头预算都按新档位重算（各处渲染优先读存量 ep.shotBudget，不能只刷当前集）
        p.episodes.forEach(function (e0) { if (e0) e0.shotBudget = calcShotBudget(e0); });
        save(); renderStep(p);
        MG.toast('镜头时长档已切到 ' + v + ' 秒，各集镜头预算已重算（重新生成分镜后生效）', 3500);
      };
    });
    var rw = document.getElementById('btnRewriteEp');
    if (rw) rw.onclick = function () { runRewriteEpisode(p, p.curEp, rw, '✨ 转剧本'); };
    // 第四批：交付三件套折叠 + 复制（文本即时从当前分镜派生，复制前编辑过的内容也最新）
    var dlvT = document.querySelector('[data-dlv-toggle]');
    if (dlvT) dlvT.onclick = function () {
      var box = dlvT.parentNode;
      var body = box.querySelector('.dlv-body');
      var ico = dlvT.querySelector('.fold-ico');
      var open = body.style.display !== 'none';
      body.style.display = open ? 'none' : '';
      ico.textContent = open ? '▸' : '▾';
    };
    Array.prototype.forEach.call(document.querySelectorAll('.dlv-copy'), function (el) {
      el.onclick = function () {
        var kind = el.getAttribute('data-dlv');
        var ep = p.episodes[p.curEp];
        var sh = (p.shots && p.shots[ep.id]) || [];
        var txt = kind === 'dub' ? deriveDubScript(p, sh) : (kind === 'sub' ? deriveSubtitleList(p, sh) : deriveSoundCue(p, sh));
        copyDeliverText(txt);
      };
    });
    // F 修复：剧本 / 原文 切换对照
    Array.prototype.forEach.call(document.querySelectorAll('.src-chip'), function (el) {
      el.onclick = function () {
        var view = el.getAttribute('data-srcview');
        var body = document.getElementById('wsSrcBody');
        var epc = p.episodes[p.curEp];
        if (!body || !epc) return;
        var txt = (view === 'script') ? (epc.text || '') : (epc.source || epc.text || '');
        body.textContent = txt;
        document.querySelectorAll('.src-chip').forEach(function (c) { c.classList.remove('active'); });
        el.classList.add('active');
      };
    });
    var exp = document.getElementById('btnExpandEp');
    if (exp) exp.onclick = function () { runExpandEpisode(p, exp); };
    var add = document.getElementById('btnAddShot');
    if (add) add.onclick = function () {
      var ep = p.episodes[p.curEp];
      if (!p.shots[ep.id]) p.shots[ep.id] = [];
      p.shots[ep.id].push(blankShot(p.shots[ep.id].length));
      save(); renderStep(p);
    };
    var ska = document.getElementById('btnSketchAll');
    if (ska) ska.onclick = function () { runSketchAll(p, ska); };
    var toShots = document.getElementById('btnToShots');
    if (toShots) toShots.onclick = function () { p.step = 5; save(); render(); };

    // #735：全剧地图折叠条开合（常驻步骤④⑤，状态持久化到 p._smStripOpen）。
    // 仅替换该细条自身 outerHTML，不重渲染整页，避免丢失脚本视图里未保存的输入框内容。
    (function bindSmStripToggle() {
      var smHead = document.querySelector('#smStrip .sm-strip-head');
      if (smHead) smHead.onclick = function () {
        p._smStripOpen = !p._smStripOpen;
        save();
        var strip = document.getElementById('smStrip');
        if (strip) { strip.outerHTML = storyMapStripHtml(p); bindSmStripToggle(); }
      };
      // #735 增强：无地图时细条内「生成故事地图」按钮，就地生成，不必回步骤③
      var genBtn = document.querySelector('#smStrip [data-sm-gen]');
      if (genBtn) genBtn.onclick = function (ev) {
        ev.stopPropagation();
        if (p.storyMapBuilding) return;
        p.storyMapBuilding = true; save();
        var strip = document.getElementById('smStrip');
        if (strip) { strip.outerHTML = storyMapStripHtml(p); bindSmStripToggle(); }
        setTimeout(function () {
          buildStoryMap(p).then(function () {
            p.storyMapBuilding = false;
            p._smStripOpen = true;
            save();
            var s2 = document.getElementById('smStrip');
            if (s2) { s2.outerHTML = storyMapStripHtml(p); bindSmStripToggle(); }
          });
        }, 0);
      };
    })();

    // 分镜多轮精修环：单镜「🔄 精修」→ 由理解引擎基于本集上下文重打磨该镜，不破坏其他镜
    Array.prototype.forEach.call(document.querySelectorAll('.shot-refine'), function (el) {
      el.onclick = function (ev) {
        ev.stopPropagation();
        var i = parseInt(el.getAttribute('data-i'), 10);
        refineShot(p, p.episodes[p.curEp], i);
      };
    });

    wireShotInputs(p);

    // 分镜卡片折叠：点卡片头收起/展开，点「删除」不触发折叠
    Array.prototype.forEach.call(document.querySelectorAll('.shot-head[data-fold]'), function (el) {
      el.addEventListener('click', function (ev) {
        if (ev.target.closest('.shot-del') || ev.target.closest('.shot-refine') || ev.target.closest('.shot-sketch-btn')) return;
        var card = el.closest('.shot-card');
        if (card) card.classList.toggle('collapsed');
        syncToggleAllLabel();
      });
    });
    var ta = document.getElementById('btnToggleAll');
    function syncToggleAllLabel() {
      var cards = document.querySelectorAll('.shot-card');
      if (!cards.length) { if (ta) ta.style.display = 'none'; return; }
      if (ta) ta.style.display = '';
      var anyOpen = Array.prototype.some.call(cards, function (c) { return !c.classList.contains('collapsed'); });
      ta.textContent = anyOpen ? '全部收起' : '全部展开';
    }
    if (ta) ta.onclick = function () {
      var cards = document.querySelectorAll('.shot-card');
      var anyOpen = Array.prototype.some.call(cards, function (c) { return !c.classList.contains('collapsed'); });
      Array.prototype.forEach.call(cards, function (c) { c.classList.toggle('collapsed', anyOpen); });
      syncToggleAllLabel();
    };
    syncToggleAllLabel();

    // 交付中心入口已随开源版裁剪移除（开源版不含付费交付中心）
    var nx = document.getElementById('btnNextEp');
    if (nx) nx.onclick = function () {
      if (p.episodes.length > 1) p.curEp = (p.curEp + 1) % p.episodes.length;
      save(); renderStep(p);
    };

    // P1-2 视图切换 + 画布交互
    // 注意：必须限定 [data-view]，否则会误伤复用 svt-btn 样式的镜头时长档按钮（.sd-opt），覆盖其 onclick 导致档位切换失效
    Array.prototype.forEach.call(document.querySelectorAll('.svt-btn[data-view]'), function (el) {
      el.onclick = function () {
        p.shotView = el.getAttribute('data-view');
        _shotSel = {};
        save(); renderStep(p);
      };
    });
    if (p.shotView === 'canvas') wireCanvas(p);

    // 从画布点卡片聚焦进来：展开 + 高亮 + 滚到对应镜头
    if (p.shotView !== 'canvas' && p._focusShot != null) {
      var fc = document.querySelector('.shot-card[data-i="' + p._focusShot + '"]');
      if (fc) {
        fc.classList.remove('collapsed');
        fc.classList.add('hl');
        fc.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(function () { fc.classList.remove('hl'); }, 2200);
      }
      p._focusShot = null; save();
    }
  }

  function wireShotInputs(p) {
    var ep = p.episodes[p.curEp];
    var shots = p.shots[ep.id] || [];
    Array.prototype.forEach.call(document.querySelectorAll('.shot-title'), function (el) {
      el.addEventListener('input', function () {
        var i = parseInt(el.getAttribute('data-i'), 10);
        shots[i].scene = el.value; scheduleSave();
        var card = el.closest('.shot-card');
        var pv = card && card.querySelector('.shot-preview');
        if (pv) pv.textContent = el.value || ('镜 ' + (i + 1));
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.shot-field [data-k]'), function (el) {
      var tag = el.tagName.toLowerCase();
      var ev = (tag === 'textarea' || tag === 'input') ? 'input' : 'change';
      el.addEventListener(ev, function () {
        var i = parseInt(el.getAttribute('data-i'), 10);
        var k = el.getAttribute('data-k');
        var v = el.value;
        if (k === 'chars') shots[i].chars = v.split(/[、,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
        else if (k === 'dur') shots[i].dur = Math.max(1, parseInt(v, 10) || 5);
        else if (k === 'pace') shots[i].pace = v;
        else shots[i][k] = v;
        scheduleSave();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.shot-del'), function (el) {
      el.onclick = function () {
        var i = parseInt(el.getAttribute('data-i'), 10);
        shots.splice(i, 1);
        save(); renderStep(p);
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('.shot-sketch-btn'), function (el) {
      el.onclick = function (ev) {
        ev.stopPropagation();
        var i = parseInt(el.getAttribute('data-i'), 10);
        runSketchShot(p, i, el);
      };
    });
  }

  function blankShot(n) {
    return { scene: '', chars: [], action: '', dialogue: '', sound: '', light: '', camera: '', size: '', mood: '', prompt: '', videoPrompt: '', dur: curShotDur(), pace: 'normal', sketch: '' };
  }

  // P1-2 分镜总览画布：网格卡片 / 拖拽重排 / 多选批量
  var _shotSel = {};   // 画布多选态：{ [index]: true }

  function shotTileHtml(s, i, p) {
    var en = (window.SW_I18N && SW_I18N.getLang() === 'en');
    var sel = _shotSel[i] ? ' sel' : '';
    var thumb;
    if (s.sketch) thumb = '<img src="' + esc(s.sketch) + '" alt="" onerror="this.style.display=\'none\'">';
    else thumb = '<div class="ph"><b>' + (i + 1) + '</b>' + esc(s.scene || (en ? ('Shot ' + (i + 1)) : ('镜 ' + (i + 1)))) + '</div>';
    var chars = (s.chars || []).slice(0, 3).map(function (c) { return '<span>' + esc(c) + '</span>'; }).join('');
    var pl = (s.prompt || s.action || '').trim();
    if (pl.length > 48) pl = pl.slice(0, 48) + '…';
    return '<div class="shot-tile' + sel + '" draggable="true" data-i="' + i + '">' +
      '<div class="thumb">' + thumb + '</div>' +
      '<div class="tnum">' + (i + 1) + '</div>' +
      '<label class="tsel"><input type="checkbox" data-sel="' + i + '"' + (_shotSel[i] ? ' checked' : '') + '></label>' +
      '<div class="tmeta">' +
        '<div class="tscene">' + esc(s.scene || (en ? ('Shot ' + (i + 1)) : ('镜 ' + (i + 1)))) + '</div>' +
        (chars ? '<div class="tchars">' + chars + '</div>' : '') +
        (pl ? '<div class="tprompt">' + esc(pl) + '</div>' : '') +
      '</div>' +
      '<div class="tdur">' + (s.dur || 5) + 's' + (s.size ? ' · ' + esc(s.size) : '') + '</div>' +
      '</div>';
  }

  function wireCanvas(p) {
    var ep = p.episodes[p.curEp];
    var list = document.getElementById('shotList');
    var fromIdx = null;

    function clearDropMarkers() {
      Array.prototype.forEach.call(document.querySelectorAll('.shot-tile.drop-before, .shot-tile.drop-after'), function (t) {
        t.classList.remove('drop-before', 'drop-after');
      });
    }
    function readingOrderTiles() {
      if (!list) return [];
      return Array.prototype.slice.call(list.querySelectorAll('.shot-tile:not(.dragging)')).map(function (t) {
        var r = t.getBoundingClientRect();
        return { el: t, idx: parseInt(t.getAttribute('data-i'), 10), cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
      }).sort(function (a, b) { return a.cy - b.cy || a.cx - b.cx; });
    }
    function computeDropIndex(clientX, clientY) {
      var tiles = readingOrderTiles();
      if (!tiles.length) return 0;
      var best = 0, bestDist = Infinity;
      tiles.forEach(function (r, i) {
        var d = (r.cx - clientX) * (r.cx - clientX) + (r.cy - clientY) * (r.cy - clientY);
        if (d < bestDist) { bestDist = d; best = i; }
      });
      var br = tiles[best];
      var dx = clientX - br.cx, dy = clientY - br.cy;
      var after = (Math.abs(dy) > Math.abs(dx)) ? (dy > 0) : (dx > 0);
      return after ? best + 1 : best;
    }
    function setDropMarker(insertIdx) {
      clearDropMarkers();
      var tiles = readingOrderTiles();
      if (insertIdx >= 0 && insertIdx < tiles.length) tiles[insertIdx].el.classList.add('drop-before');
      else if (insertIdx === tiles.length && tiles.length) tiles[tiles.length - 1].el.classList.add('drop-after');
    }

    Array.prototype.forEach.call(document.querySelectorAll('.shot-tile'), function (tile) {
      var i = parseInt(tile.getAttribute('data-i'), 10);
      tile.addEventListener('click', function (ev) {
        if (ev.target.closest('[data-sel]')) return;          // 点复选框不触发编辑
        p.shotView = 'list';
        p._focusShot = i;
        save(); renderStep(p);
      });
      tile.addEventListener('dragstart', function (ev) {
        fromIdx = i;
        tile.classList.add('dragging');
        ev.dataTransfer.setData('text/plain', String(i));
        ev.dataTransfer.effectAllowed = 'move';
      });
      tile.addEventListener('dragend', function () {
        tile.classList.remove('dragging');
        clearDropMarkers();
        fromIdx = null;
      });
    });

    if (list) {
      list.addEventListener('dragover', function (ev) {
        ev.preventDefault();
        setDropMarker(computeDropIndex(ev.clientX, ev.clientY));
      });
      list.addEventListener('dragleave', function (ev) {
        if (!list.contains(ev.relatedTarget)) clearDropMarkers();
      });
      list.addEventListener('drop', function (ev) {
        ev.preventDefault();
        clearDropMarkers();
        var f = parseInt(ev.dataTransfer.getData('text/plain'), 10);
        var t = computeDropIndex(ev.clientX, ev.clientY);
        if (isNaN(f)) return;
        var arr = p.shots[ep.id];
        if (!arr || arr.length < 2) return;
        if (f === t || f === t - 1) return;                    // 目标位置与当前位置相同（或相邻且无需移动）
        var moved = arr.splice(f, 1)[0];
        if (f < t) t -= 1;                                     // 移除后，原目标之后的索引前移一位
        arr.splice(t, 0, moved);
        save(); renderStep(p);
      });
    }

    Array.prototype.forEach.call(document.querySelectorAll('[data-sel]'), function (cb) {
      cb.addEventListener('change', function () {
        var i = parseInt(cb.getAttribute('data-sel'), 10);
        _shotSel[i] = cb.checked;
        var tile = cb.closest('.shot-tile');
        if (tile) tile.classList.toggle('sel', cb.checked);
        updateBatchBar();
      });
    });
    var bb = document.getElementById('shotBatchBar');
    if (bb) {
      var del = document.getElementById('btnBatchDel'); if (del) del.onclick = function () { batchDeleteShots(p); };
      var mg = document.getElementById('btnBatchMerge'); if (mg) mg.onclick = function () { batchMergeShots(p); };
      var rg = document.getElementById('btnBatchRegen'); if (rg) rg.onclick = function () { batchRegenShots(p); };
      var cl = document.getElementById('btnBatchClear'); if (cl) cl.onclick = function () {
        _shotSel = {}; updateBatchBar();
        Array.prototype.forEach.call(document.querySelectorAll('.shot-tile.sel'), function (t) { t.classList.remove('sel'); });
        Array.prototype.forEach.call(document.querySelectorAll('[data-sel]'), function (c) { c.checked = false; });
      };
    }
    updateBatchBar();
  }

  function updateBatchBar() {
    var bb = document.getElementById('shotBatchBar');
    if (!bb) return;
    var ids = Object.keys(_shotSel).filter(function (k) { return _shotSel[k]; }).map(Number);
    var cnt = document.getElementById('selCount'); if (cnt) cnt.textContent = ids.length;
    bb.classList.toggle('on', ids.length > 0);
  }

  function batchDeleteShots(p) {
    var ep = p.episodes[p.curEp];
    var arr = p.shots[ep.id] || [];
    var ids = Object.keys(_shotSel).filter(function (k) { return _shotSel[k]; }).map(Number).sort(function (a, b) { return b - a; });
    if (!ids.length) return;
    ids.forEach(function (i) { if (arr[i]) arr.splice(i, 1); });
    _shotSel = {};
    save(); renderStep(p);
  }

  function batchMergeShots(p) {
    var ep = p.episodes[p.curEp];
    var arr = p.shots[ep.id] || [];
    var ids = Object.keys(_shotSel).filter(function (k) { return _shotSel[k]; }).map(Number).sort(function (a, b) { return a - b; });
    if (!ids.length) return;
    ids.forEach(function (i) {
      if (i + 1 < arr.length) {
        var a = arr[i], b = arr[i + 1];
        b.action = [a.action, b.action].filter(Boolean).join('；');
        b.dialogue = [a.dialogue, b.dialogue].filter(Boolean).join(' ');
        b.prompt = [a.prompt, b.prompt].filter(Boolean).join(' ');
        b.videoPrompt = [a.videoPrompt, b.videoPrompt].filter(Boolean).join(' ');
        if (a.chars && a.chars.length) b.chars = b.chars.concat(a.chars.filter(function (c) { return b.chars.indexOf(c) < 0; }));
        if (!b.scene) b.scene = a.scene;
        if (!b.dur) b.dur = a.dur;
        if (!b.size) b.size = a.size;
      }
    });
    ids.slice().reverse().forEach(function (i) { if (i + 1 < arr.length) arr.splice(i, 1); });  // 删被合并的镜
    _shotSel = {};
    save(); renderStep(p);
  }

  function batchRegenShots(p) {
    var ep = p.episodes[p.curEp];
    var ids = Object.keys(_shotSel).filter(function (k) { return _shotSel[k]; }).map(Number);
    if (!ids.length) return;
    _shotSel = {};
    updateBatchBar();
    ids.forEach(function (i) { refineShot(p, ep, i); });   // 复用单镜精修（带计费+重打磨）
  }

  // #707 分镜线稿预览：用万相2.1-Turbo 文生图（¥0.05/张）生成黑白线稿分镜草图，落 shot.sketch 字段并回显缩略图
  function sketchPromptOf(s) {
    return (s.prompt || s.action || s.videoPrompt || s.scene || '').trim();
  }
  function renderSketchBox(idx, url) {
    var box = document.querySelector('[data-sketch-box="' + idx + '"]');
    if (!box) return;

      ? '<img src="' + esc(url) + '" alt="线稿" onclick="MJ_openSketchModal(' + idx + ')">'
      : '<span class="shot-sketch-empty">点「线稿预览」出构图草图（¥0.05/张）· 仅看画面感觉，与正式出图构图无关</span>';
  }
  // #747 线稿预览弹窗：替代新开网页。支持 ←/→ 翻页浏览本集所有线稿、点击/滚轮缩放、Esc 关闭。
  var _mgSketchList = []; // 当前集 shots 引用数组（与 p.shots[ep.id] 同对象），供线稿弹窗翻页，避免依赖 p.curEp 查找
  function MJ_setSketchList(arr) { _mgSketchList = (arr || []).slice(); }
  function MJ_openSketchModal(startIdx) {
    startIdx = startIdx || 0;
    if (!_mgSketchList.length) { MG.toast('本集还没有分镜', 2000); return; }
    var idx = startIdx;
    if (!(_mgSketchList[idx] && _mgSketchList[idx].sketch)) {
      var first = -1;
      for (var k = 0; k < _mgSketchList.length; k++) { if (_mgSketchList[k] && _mgSketchList[k].sketch) { first = k; break; } }
      if (first < 0) { MG.toast('本集还没有任何线稿，先点「线稿预览」生成', 2500); return; }

    mask.innerHTML =
      '<div class="sk-modal">' +
        '<div class="sk-bar">' +
          '<span class="sk-title" id="skTitle"></span>' +
          '<span class="sk-zoom" id="skZoom">100%</span>' +
          '<button class="sk-close" id="skClose" title="关闭 (Esc)">✕</button>' +
        '</div>' +
        '<div class="sk-stage">' +
          '<button class="sk-nav sk-prev" id="skPrev" title="上一镜 (←)">‹</button>' +
          '<div class="sk-imgwrap" id="skWrap"><img id="skImg" alt="线稿"></div>' +
          '<button class="sk-nav sk-next" id="skNext" title="下一镜 (→)">›</button>' +
        '</div>' +
        '<div class="sk-tip">← → 翻页 · 点击图片放大/还原 · 滚轮缩放 · Esc 关闭</div>' +
        '<div class="sk-tip" style="opacity:.75;">线稿仅作画面感觉参考，与正式出图的构图无关联（正式图以你指定的出图工具为准）</div>' +
      '</div>';
    document.body.appendChild(mask);
    requestAnimationFrame(function () { mask.classList.add('show'); });
    var img = document.getElementById('skImg');
    var title = document.getElementById('skTitle');
    var zoomEl = document.getElementById('skZoom');
    var wrap = document.getElementById('skWrap');
    var scale = 1;
    function applyZoom() {
      if (scale === 1) { img.style.maxWidth = ''; img.style.width = ''; }
      else { img.style.maxWidth = 'none'; img.style.width = (100 * scale) + '%'; }
      zoomEl.textContent = Math.round(scale * 100) + '%';
    }
    function render() {
      var s = _mgSketchList[idx];
      if (s && s.sketch) {
        img.src = s.sketch; img.style.display = '';
        title.textContent = '镜 ' + (idx + 1) + ' / ' + _mgSketchList.length + ' · 线稿预览';
      } else {
        img.removeAttribute('src'); img.style.display = 'none';
        title.textContent = '镜 ' + (idx + 1) + ' / ' + _mgSketchList.length + '（本镜尚未生成线稿）';
      }
      scale = 1; applyZoom(); wrap.scrollLeft = 0; wrap.scrollTop = 0;
    }
    function go(d) {
      var n = idx + d;
      if (n < 0) n = _mgSketchList.length - 1;
      if (n >= _mgSketchList.length) n = 0;
      idx = n; render();
    }
    function closeModal() {
      if (mask.parentNode) mask.parentNode.removeChild(mask);
      document.removeEventListener('keydown', onKey);
    }
    function onKey(e) {
      if (e.key === 'Escape') closeModal();
      else if (e.key === 'ArrowLeft') go(-1);
      else if (e.key === 'ArrowRight') go(1);
    }
    document.addEventListener('keydown', onKey);
    document.getElementById('skClose').onclick = closeModal;
    mask.onclick = function (e) { if (e.target === mask) closeModal(); };
    document.getElementById('skPrev').onclick = function () { go(-1); };
    document.getElementById('skNext').onclick = function () { go(1); };
    img.onclick = function () {
      var seq = [1, 1.5, 2, 1];
      var pos = seq.indexOf(scale);
      scale = seq[(pos < 0 ? 0 : pos) + 1] || 1;
      applyZoom();
    };
    wrap.onwheel = function (e) {
      e.preventDefault();
      scale += (e.deltaY < 0 ? 0.15 : -0.15);
      if (scale < 0.5) scale = 0.5; if (scale > 4) scale = 4;
      applyZoom();
    };
    render();
  }
  // #736 方案 A：真线稿。出图后做一道 canvas 边缘检测（灰度 + Sobel），把万相返回的灰度草图转成
  // 干净的「白底黑线」勾线稿。因远端 OSS 图跨域会污染 canvas，必须经同源代理 /api/img_proxy 取像素。
  // 返回 dataURL；任何环节失败返回 null（上层降级为原图）。
  function toLineArt(srcUrl) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () {
        try {
          var W = img.naturalWidth, H = img.naturalHeight;
          var MAX = 1024;
          if (W > MAX || H > MAX) { var sc = MAX / Math.max(W, H); W = Math.round(W * sc); H = Math.round(H * sc); }
          var cv = document.createElement('canvas');
          cv.width = W; cv.height = H;
          var ctx = cv.getContext('2d');
          ctx.drawImage(img, 0, 0, W, H);
          var sd = ctx.getImageData(0, 0, W, H);
          var px = sd.data;
          var gray = new Float32Array(W * H);
          for (var i = 0, p = 0; i < px.length; i += 4, p++) gray[p] = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
          var out = ctx.createImageData(W, H);
          var od = out.data;
          var TH = 64; // 边缘阈值：越小线越多
          for (var y = 1; y < H - 1; y++) {
            for (var x = 1; x < W - 1; x++) {
              var i00 = (y - 1) * W + (x - 1), i01 = (y - 1) * W + x, i02 = (y - 1) * W + (x + 1);
              var i10 = y * W + (x - 1), i12 = y * W + (x + 1);
              var i20 = (y + 1) * W + (x - 1), i21 = (y + 1) * W + x, i22 = (y + 1) * W + (x + 1);
              var gx = -gray[i00] - 2 * gray[i10] - gray[i20] + gray[i02] + 2 * gray[i12] + gray[i22];
              var gy = -gray[i00] - 2 * gray[i01] - gray[i02] + gray[i20] + 2 * gray[i21] + gray[i22];
              var mag = Math.sqrt(gx * gx + gy * gy);
              var edge = mag > TH ? 0 : 255; // 黑线白底
              var o = (y * W + x) * 4;
              od[o] = od[o + 1] = od[o + 2] = edge; od[o + 3] = 255;
            }
          }
          // 边界 1px 填白（createImageData 默认透明，转白底）
          for (var bb = 0; bb < W * H; bb++) { if (od[bb * 4 + 3] === 0) { od[bb * 4] = od[bb * 4 + 1] = od[bb * 4 + 2] = 255; od[bb * 4 + 3] = 255; } }
          ctx.putImageData(out, 0, 0);
          resolve(cv.toDataURL('image/png'));
        } catch (e) { resolve(null); }
      };
      img.onerror = function () { resolve(null); };
      // 远端 http(s) 图（极少数「下载失败、回退远端 URL」的情况）才走同源代理绕过跨域；
      // 正常情况万相出图已被服务端下载到本地 /uploads/（同域，crossOrigin 不会污染 canvas），直接加载即可。
      var isRemote = /^https?:\/\//i.test(srcUrl);
      img.src = isRemote ? ('/api/img_proxy?u=' + encodeURIComponent(srcUrl)) : srcUrl;
    });
  }
  async function genOneSketch(p, s, idx, attempts) {
    attempts = attempts || 0;
    if (s) s._lastSketchErr = '';
    var base = sketchPromptOf(s);
    if (!base) return false;
    try {
      // #736 方案 A：把提示词钉死为严格线稿规格，从源头逼出接近手绘的黑白勾线草图
      var r = await MG.api('/api/generate', 'POST', {
        modelId: 'wanx2.1-t2i-turbo',
        prompt: '纯线稿，白底黑线，无阴影，无灰度填充，无颜色，仅用清晰轮廓线条勾勒动画分镜草图，简洁黑白漫画线稿：' + base,
        ratio: '9:16', variants: 1
      });
      // 关键修复 #715：服务端单张出图把图 URL 放在 r.result.url（嵌套），旧的 r.url / r.candidates[0].url
      // 在单图场景恒为空，导致前端永远判「生成失败」——而服务端其实已生成成功并扣了 ¥0.05（偷偷扣费）。
      // 这里按「result.url → url → candidates[0].url」顺序兜底所有返回形态。
      var url = (r && r.result && r.result.url) || (r && r.url) || (r && r.candidates && r.candidates[0] && r.candidates[0].url) || '';
      if (r && r.ok && url) {
        s.sketchRaw = url; // 保留原始出图，便于回溯
        var line = await toLineArt(url);
        s.sketch = line || url; // lineart 后处理失败则降级为原图
        if (s) delete s._lastSketchErr;
        renderSketchBox(idx, s.sketch);
        return true;
      }
      // 出图接口 per-token 限速 12/60s：触发则避让后重试
      if (r && r.err && /频繁/.test(r.err) && attempts < 2) {
        await new Promise(function (res) { setTimeout(res, 4000); });
        return await genOneSketch(p, s, idx, attempts + 1);
      }
      // 余额不足 / 今日额度用尽 / 内容被屏蔽 / 上游报错：记录真实原因，让上层提示不再只说「请重试」
      if (r && r.err) { if (s) s._lastSketchErr = r.err; }
      return false;
    } catch (e) {
      if (attempts < 2) { await new Promise(function (res) { setTimeout(res, 4000); }); return await genOneSketch(p, s, idx, attempts + 1); }
      if (s) s._lastSketchErr = (e && e.message) ? e.message : String(e);
      return false;
    }
  }
  async function runSketchShot(p, idx, btn) {
    var ep = p.episodes[p.curEp];
    if (!ep) return;
    var shots = p.shots[ep.id] || [];
    var s = shots[idx];
    if (!s) return;
    if (!sketchPromptOf(s)) { MG.toast('该镜暂无可用于线稿的画面描述，请先填写「文生图提示词」或「动作」', 3000); return; }
    if (btn) { btn.disabled = true; btn.textContent = '生成中…'; }
    try {
      var ok = await genOneSketch(p, s, idx, 0);
      if (ok) { save(); MG.toast('线稿已生成（¥0.05）', 1500); MJ_setSketchList(p.shots[ep.id]); MJ_openSketchModal(idx); }
      else { MG.toast('线稿生成失败' + (s._lastSketchErr ? '：' + s._lastSketchErr : '，请重试'), 3500); }
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '线稿预览'; }
    }
  }
  async function runSketchAll(p, btn) {
    var ep = p.episodes[p.curEp];
    if (!ep) return;
    var shots = p.shots[ep.id] || [];
    if (!shots.length) { MG.toast('本集还没有分镜，先点「生成分镜」', 2500); return; }
    if (btn) { btn.disabled = true; btn.textContent = '批量生成中…'; }
    var done = 0, fail = 0, lastErr = '';
    for (var i = 0; i < shots.length; i++) {
      var ok = await genOneSketch(p, shots[i], i, 0);
      if (ok) done++; else { fail++; if (shots[i]._lastSketchErr) lastErr = shots[i]._lastSketchErr; }
      save();
      // 避让 per-token 限速（12/60s）：6s 间距保证任意滑动窗口内 < 12 次
      if (i < shots.length - 1) await new Promise(function (res) { setTimeout(res, 6000); });
    }
    if (btn) { btn.disabled = false; btn.textContent = '批量线稿预览'; }
    MJ_setSketchList(p.shots[ep.id]); MJ_openSketchModal(0);
    MG.toast('线稿批量完成：成功 ' + done + ' · 失败 ' + fail + (lastErr ? '（' + lastErr + '）' : ''), 4000);
  }

  async function runExpandEpisode(p, btn) {
    var ep = p.episodes[p.curEp];
    if (!ep) return;
    var need = Math.max(0, (ep.seconds * p.segConfig.charsPerSec) - ep.chars);
    if (need <= 0) {
      alert('本集字数已足够支撑 ' + ep.seconds + ' 秒，无需补写。');
      return;
    }
    var ch = await ensureCharge('expand', 0);
    if (!ch) return;
    btn.disabled = true; btn.textContent = '补写中…';
    showProgress('正在扩写本集', '我在保持原意、人物和情绪不变的前提下补细节、补镜头感。');
    doExpandEpisode(p).then(function (usedLLM) {
      hideProgress();
      if (!usedLLM) {
        refundLastCharge();
        alert('我这边还没接上写作通道，没法自动补写。你可以直接在原文区自己扩，或者换到更短的秒数档位。');
      } else {
        // 扩写成功后清空旧分镜（因为镜头预算已变），让用户重新生成分镜
        delete p.shots[ep.id];
      }
      btn.disabled = false; btn.textContent = '✨ AI 补写';
      save(); renderStep(p);
    }).catch(function (e) {
      hideProgress();
      btn.disabled = false; btn.textContent = '✨ AI 补写';
      refundLastCharge();
      alert('补写失败：' + (e && e.message ? e.message : e));
    });
  }

  function doExpandEpisode(p) {
    var ep = p.episodes[p.curEp];
    var cfg = p.segConfig;
    var targetChars = (ep.seconds * cfg.charsPerSec) - ep.chars;
    if (targetChars <= 0) return Promise.resolve(false);
    var ctx = buildBibleContext(p);
    return MG.api('/api/llm', 'POST', {
      messages: expandEpisodeLLMMessages(ep, targetChars, ctx, p.structureRef)
    }).then(function (r) {
      if (r && r.ok && !r.noKey && r.text) {
        var expanded = parseExpandResponse(r.text);
        if (expanded) {
          ep.text = expanded;
          // 重新计算本集字数相关字段
          var chars = ep.text.replace(/\s/g, '').length;

  function parseShotObject(text) {

      if (m && m[1]) t = m[1].trim();

    try {
      var j = JSON.parse(t);
      if (j && typeof j === 'object') {
        var o = {};
        if (typeof j.scene === 'string') o.scene = j.scene;
        if (j.chars != null) o.chars = (Array.isArray(j.chars) ? j.chars : String(j.chars).split(/[、，,；;]/)).map(function (x) { return (x || '').trim(); }).filter(Boolean);
        if (typeof j.action === 'string') o.action = j.action;
        if (typeof j.dialogue === 'string') o.dialogue = j.dialogue;
        if (typeof j.light === 'string') o.light = j.light;

  var _genShotsRunning = false; // 模块级（不落盘），防止进度遮罩隐藏后重复点击触发两次生成

    var perBlock = blocks.map(function () { return null; });

    if (!sents.length) sents = [raw];

    budget = Math.max(1, budget || 1);

    var hi = Math.max(lo + 40, Math.floor(per * 1.6));

      if (cur && cur.length >= lo && cur.length + sent.length > hi) { blocks.push(cur); cur = ''; }

      '- 每个镜头必须是**一个独立、具体、与其他镜头不重复**的画面。\n' +
      '- **video_prompt 唯一性**：每个镜头的 video_prompt 文本必须彼此完全不同，禁止任何两镜 video_prompt 相同或高度雷同（归一化后一致即雷同）。\n' +
      '- prompt 必须是纯画面描写（180~300 字），不得含"后来/接着/于是/然后/忽然"等时间连词或叙事词；含叙事词视为不合格。\n' +
      '【景别】多近景/特写/大特写，不用远景，少用中景。\n' +
      '【违禁词】血腥/低俗/敏感词改中性近义。\n' +
      '【结尾】本段最后一镜尽量留情绪钩子。\n\n' +
      '【输出】严格 JSON：{shots:[{panel_index, scene, size, chars, action, dialogue, sound, light, camera, mood, prompt, video_prompt, dur}]}，shots 长度=' + n + '。只输出 JSON，不要解释。';
    if (ref && STRUCTURE_TEMPLATES[ref]) sys += '\n\n' + STRUCTURE_TEMPLATES[ref].shotConstraint;
    return [
      { role: 'system', content: sys },
      { role: 'user', content: '请基于上面的单一事件，生成 ' + n + ' 个不同侧面、互不重复的镜头（JSON）。' }
    ];
  }

  // 归一化 video_prompt（去空白与标点），用于雷同判定（被 doGenShots / parseShotsResponse 共用）
  function normVP(v) { return (v || '').replace(/[\s，。、；：:！!？?\.]/g, ''); }

  // 统一封装：从 LLM 返回中解析 shots，兼容旧数组格式与新对象格式（新格式含 bible 提取）
  function parseShotsResponse(text, budget, ctx) {
    var shots = null, bible = null;
    try {
      var m = text.match(/(\{[\s\S]*\}|\[[\s\S]*\])/);
      if (!m) return null;
      var raw = JSON.parse(m[0]);
      if (Array.isArray(raw)) {
        shots = raw;
      } else if (raw && Array.isArray(raw.shots)) {
        shots = raw.shots;
        bible = { characters: raw.characters || [], scenes: raw.scenes || [] };
      } else {
        return null;
      }
    } catch (err) { return null; }

    var out = shots.slice(0, budget).map(function (it, i) {
      var c = it.chars;
      if (typeof c === 'string') c = c.split(/[、,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
      if (!Array.isArray(c)) c = [];
      var s = {
        scene: it.scene || '', size: it.size || '', chars: c, action: it.action || '', dialogue: it.dialogue || '',
        light: it.light || '', camera: it.camera || '', mood: it.mood || '',
        sound: it.sound || '',
        prompt: it.prompt || '', videoPrompt: it.video_prompt || it.videoPrompt || '', dur: (it.dur != null ? Math.max(1, Math.min(30, parseInt(it.dur, 10) || 0)) : curShotDur()), pace: 'normal'
      };
      // 新三字段标准：prompt 为文生图（纯视觉），videoPrompt 为图生视频。
      // 若 LLM 没出 videoPrompt，**禁止直接复用 prompt 文本**——按 prompt 单独构造"加镜头运动/时间轴"的版本，
      // 杜绝"两个 prompt 完全相同"的退化（截图早就暴露过这事）。
      if (!s.videoPrompt) {
        s.videoPrompt = paintableVideoPrompt(s, ctx);
      }
      s.prompt = enrichPrompt(s, ctx);
      return s;
    });
    // 重复检测：① 全局去重——任何两镜 video_prompt 归一化后相同即视为重复，记下索引；
    //           ② 相邻连续雷同；③ 唯一率不足 60% 整批作废（避免"同一动作循环播放"的废片）。
    var seen = {}, dupIndices = [];
    for (var k = 0; k < out.length; k++) {
      var key = normVP(out[k].videoPrompt);
      if (key && seen[key]) dupIndices.push(k);
      else if (key) seen[key] = true;
    }
    var repRun = 1, maxRep = 1;
    for (var k2 = 1; k2 < out.length; k2++) {
      if (out[k2].videoPrompt && normVP(out[k2].videoPrompt) === normVP(out[k2 - 1].videoPrompt)) {
        repRun++; maxRep = Math.max(maxRep, repRun);
      } else { repRun = 1; }
    }
    if (out.filter(function (s) { return !s.prompt; }).length > out.length / 2) return null;
    var uniqueKeys = Object.keys(seen).length;
    if (out.length >= 3 && uniqueKeys / out.length < 0.6) return null; // 唯一率不足，整批作废
    if (maxRep >= 3) return null; // 相邻连续 3+ 雷同，整批作废
    return { shots: out, bible: bible, dupIndices: dupIndices };
  }

  function parseShots(text, budget) {
    var r = parseShotsResponse(text, budget, '');
    return r ? r.shots : null;
  }

  function looksLikeAppearance(t) {
    if (!t) return false;
    return /(岁|头发|短发|长发|眼神|神情|穿着|身穿|身着|穿|戴|面容|肤色|身高|体型|棉袄|工装|旗袍|西装|夹克|长裙|衬衫)/.test(t);
  }
  function looksLikeSceneDetail(t) {
    if (!t) return false;
    return /(年代|时期|江南|北方|房间|街道|室内|室外|后台|舞台|桌子|椅子|窗户|门|墙|地板|角落|堆着|散落|破旧|木质|砖墙|水泥|灯光|阳光|月光|天色|暮色|黄昏|凌晨)/.test(t);
  }

  function looksLikeNarrative(prompt) {
    if (!prompt) return false;
    // 时间标志 + 叙事连接词 + 长度超标 → 判定为"叙事复述"，不该当画面提示词用
    var t = prompt;
    var narrRe = /(起初|先开始|最开始|后来|接下来|接着|于是|就|忽然|突然|然后|于是|然后|刚开始|刚|才|已开始|快看|等待着|等着|临近|渐渐|这才)/;
    if (narrRe.test(t)) return true;
    return false;
  }

  function enrichPrompt(s, ctx) {
    var prompt = (s.prompt || '').trim();
    // 若 prompt 是叙事复述（直接抄原文/含时间标志/过长），放弃，按画面化重新构造
    if (prompt && looksLikeNarrative(prompt)) prompt = '';
    if (!prompt) prompt = synthesizePrompt(s, ctx);
    if (!prompt) return '';

    // 若 prompt 缺少场景细节，从 scene/action 和圣经上下文补
    if (!looksLikeSceneDetail(prompt)) {
      var sceneHint = s.scene || '';
      if (!sceneHint && s.action) {
        var am = s.action.match(/([^，。]+(?:里|内|外|中|上|下|旁|边|间|台|房|院|街|巷))/);
        if (am) sceneHint = am[1];
      }
      if (sceneHint) prompt = sceneHint + '，' + prompt;
    }

    // 若 prompt 缺少人物外貌/服装，从圣经上下文补
    if (s.chars && s.chars.length && !looksLikeAppearance(prompt)) {
      for (var i = 0; i < s.chars.length; i++) {
        var info = lookupCharInContext(s.chars[i], ctx);
        if (info) {
          prompt = prompt.replace(new RegExp(s.chars[i], 'g'), s.chars[i] + '（' + info + '）');

      }

    if (!/电影感|胶片|cinematic|film/.test(prompt)) {
      prompt += '，电影感画面，高清，写实风格';
    }
    return prompt;
  }

  function lookupCharInContext(name, ctx) {
    if (!name || !ctx) return '';
    // 优先取「定妆：」整行（新格式，详细定妆允许含逗号，取到行尾）
    var re = new RegExp(name + '[\\s\\S]*?定妆[：:]?\\s*([^\\n]+)');
    var m = ctx.match(re);
    if (m && m[1]) return m[1].trim();
    // 兼容旧格式「外貌：」
    var re2 = new RegExp(name + '[\\s\\S]*?外貌[：:]?\\s*([^\\n]+)');
    var m2 = ctx.match(re2);
    if (m2 && m2[1]) return m2[1].trim();
    return '';
  }

  function synthesizePrompt(s, ctx) {
    var parts = [];
    if (s.scene) parts.push(s.scene);
    if (s.chars && s.chars.length) {
      var charParts = [];
      for (var i = 0; i < s.chars.length; i++) {
        var info = lookupCharInContext(s.chars[i], ctx || '');
        charParts.push(info ? s.chars[i] + '（' + info + '）' : s.chars[i]);
      }
      parts.push('人物：' + charParts.join('、'));
    }
    if (s.action) parts.push('动作：' + s.action);
    if (s.light) parts.push('光线：' + s.light);
    if (s.size) parts.push('景别：' + s.size);
    if (s.camera) parts.push('机位：' + s.camera);
    if (s.mood) parts.push('情绪：' + s.mood);
    if (!parts.length) return '';
    return parts.join('，');
  }

  function mergeBibleExtract(p, extract) {
    if (!p.bible) p.bible = { characters: [], scenes: [], relations: [], foreshadow: [], hiddenLines: [], beats: [], auditRules: [] };
    var bc = p.bible.characters || [];
    (extract.characters || []).forEach(function (c) {

      for (var i = 0; i < bc.length; i++) { if (bc[i].name === c.name) { idx = i; break; } }
      if (idx >= 0) {

  function worldSampleText(p) {

    var head = bodies.slice(0, Math.min(n, 12)).map(function (b) { return b.text; }).join('\n');

    var mid = n > 32 ? bodies.slice(Math.floor(n / 2) - 3, Math.floor(n / 2) + 3).map(function (b) { return b.text; }).join('\n') : '';
    return (head + '\n' + mid + '\n' + tail).slice(0, 9000);
  }

  function worldLLMMessages(map, sample) {
    var mapStr = (map && map.arc)

      mapStr +
      '【代表段落（头/中/尾抽样，用于判断年代与风貌）】\n' + sample + '\n\n' +
      '【返回格式】只输出 JSON，不要解释：\n{\n' +
      '  "period":"年代类型且须明确，如 古代·虚拟近宋 / 现代都市 / 近代 / 架空·近唐 / 穿越；若原剧未明说朝代，必须给一个建议（虚拟近唐/近宋/近明等），绝不能留空",\n' +
      '  "eraLabel":"年代标签，如 北宋背景·架空王朝 / 现代都市·2024 / 穿越（古代X朝+现代都市）",\n' +
      '  "eraBasis":"哪些原文线索指向该朝代；若原剧未明说，写明『原文未明说，系统依据…建议』（实在无法判断可空）",\n' +
      '  "macroSetting":"大环境概述：结合朝代从原剧提取+补全——时代背景、地理/社会风貌、核心冲突土壤、关键场景类型，具体到能照着搭出来；以『拍得出来戏』为下限，不展开成世界观长篇",\n' +
      '  "visualSystem":"全片统一的视觉/美术基调：主色调、质感、光影、构图锚（供 AI 出图出视频保持一致性）",\n' +
      '  "costumeSystem":"装束体系：结合朝代与场景，各身份（贵族/平民/军人/仕女/僧道等）人物的服饰材质·颜色·形制总纲，全片统一；现代剧写各圈层穿搭总纲；穿越剧分别给『古代侧』与『现代侧』两套装束",\n' +
      '  "statusSystem":"社会等级与物料质感体系：描述各阶层（皇室/贵族/平民/军人等）的居所与陈设应有的物料等级（如 皇室=金丝楠/云锦/鎏金/羊脂玉，贵族=紫檀/绸缎，平民=榆木/粗布），出图时场景物料必须匹配人物身份，禁止公主房出现破屋/普通木/冷灰"\n}\n\n' +
      '【铁律】\n' +
      '1) 必须先判断 period 类型：古代 / 现代 / 近代 / 架空 / 穿越。\n' +
      '2) 原剧未明说朝代时，必须给一个合理建议（虚拟近唐/近宋/近明等），绝不能留空；eraBasis 写清"原文未明说，建议依据…"。\n' +
      '3) 穿越剧：costumeSystem 必须分别给出"古代侧"与"现代侧"两套装束体系；period 标"穿越"，eraLabel 写"古代X朝 + 现代都市"。\n' +

      '6) 除 eraBasis 外，所有字段禁止留空。\n' +

  function parseWorldResponse(text) {
    try {
      var m = text.match(/(\{[\s\S]*\})/);
      if (!m) return null;
      var raw = JSON.parse(m[0]);
      var out = {};
      WORLD_KEYS.forEach(function (k) { out[k] = (raw[k] != null) ? String(raw[k]) : ''; });
      return out;
    } catch (e) { return null; }
  }

  // 合并 world：用户已改（_user[k]）的字段保留；其余用 AI 新值覆盖（带「AI补」标记）
  function mergeWorld(existing, parsed) {
    existing = existing || {};
    existing._user = existing._user || {};
    WORLD_KEYS.forEach(function (k) {
      if (existing._user[k]) return; // 用户改过，保留
      if (parsed && parsed[k] != null && String(parsed[k]).trim()) existing[k] = parsed[k];
    });
    return existing;
  }

  // 总纲一致性锚：注入出图/出视频提示词，防古装被现代风带偏
  function worldConsistencyAnchor(p) {
    var w = (p.bible && p.bible.world) || {};
    if (!w.eraLabel && !w.period && !w.costumeSystem && !w.visualSystem && !w.macroSetting) return '';
    var lines = ['【整部剧总纲（年代/装束/视觉，所有镜头必须贯穿一致，禁止冲突）】'];
    if (w.period || w.eraLabel) lines.push('年代：' + (w.eraLabel || w.period));
    if (w.macroSetting) lines.push('大环境：' + w.macroSetting);
    if (w.visualSystem) lines.push('视觉基调：' + w.visualSystem);
    if (w.costumeSystem) lines.push('装束体系：' + w.costumeSystem);

    text = text || (p.script.raw || '');

    if (!p.bible.world) p.bible.world = {};

    var sample = worldSampleText(p);
