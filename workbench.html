<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storywright 故事匠 · 剧本工作台</title>
<link rel="icon" href="data:," />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#060A14; color:#E8EDF6;
    font-family:'Plus Jakarta Sans','Noto Sans SC',system-ui,sans-serif;
    overflow:hidden;
  }
  button { font-family:inherit; cursor:pointer; }
  a { color:inherit; text-decoration:none; }

  /* 顶栏 */
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 28px; border-bottom:1px solid rgba(255,255,255,0.06);
    height:58px;
  }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-mark {
    width:30px; height:30px; border-radius:9px;
    background:#F5A623;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px; color:#0A0B0E;
  }
  .crumb { color:#5A6B85; font-size:12px; }
  .crumb b { color:#C9D3E3; font-weight:500; }
  .proj-name { color:#FFFFFF; font-size:15px; font-weight:700; margin-left:10px; letter-spacing:.3px; }
  .seg-summary { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; background:rgba(45,212,168,0.08); border:1px solid rgba(45,212,168,0.24); border-radius:12px; padding:13px 18px; font-size:13px; color:#9FB0C9; margin-bottom:6px; }
  .seg-summary b { color:#2DD4A8; font-weight:700; font-size:19px; margin:0 3px 0 2px; }
  .seg-summary .sep { width:1px; height:16px; background:rgba(255,255,255,0.12); margin:0 8px; }
  .seg-warning { background:rgba(245,166,35,0.09); border:1px solid rgba(245,166,35,0.28); border-radius:10px; padding:10px 14px; font-size:12px; color:#F5C87C; margin-bottom:10px; line-height:1.6; }
  .ep-warning { background:rgba(245,166,35,0.09); border-left:3px solid #F5A623; border-radius:0 8px 8px 0; padding:9px 12px; font-size:12px; color:#F5C87C; margin:0 16px 12px; line-height:1.55; }
  .title-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .proj-item .nm { font-size:14px; color:#E8EDF6; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item-actions { display:flex; align-items:center; gap:2px; flex-shrink:0; }
  .item-actions button { background:transparent; border:none; color:#5A6B85; width:22px; height:22px; padding:0; border-radius:5px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .item-actions button:hover { background:rgba(255,255,255,0.08); color:#2DD4A8; }
  .item-actions button.del:hover { color:#F56565; }
  .top-right { display:flex; align-items:center; gap:14px; }
  .save-stat { font-size:12px; color:#5A6B85; }
  .save-stat.ok { color:#2DD4A8; }
  .save-stat.busy { color:#F5A623; }
  .mini-btn {
    background:transparent; border:1px solid rgba(255,255,255,0.14);
    color:#C9D3E3; padding:6px 14px; border-radius:8px; font-size:13px;
  }
  .mini-btn:hover { border-color:#2DD4A8; color:#2DD4A8; }

  /* 登录门 */
  #loginGate{position:fixed;inset:0;background:#060A14;display:none;align-items:center;justify-content:center;z-index:2000;}
  #loginGate .box{text-align:center;max-width:420px;padding:30px;}
  #loginGate .logo{width:60px;height:60px;border-radius:16px;background:#F5A623;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#0A0B0E;margin:0 auto 18px;}
  #loginGate h1{font-size:22px;margin-bottom:8px;color:#E8EDF6;}
  #loginGate p{color:#7C8AA3;font-size:13px;margin-bottom:22px;line-height:1.7;}
  #loginGate .btn{background:#2DD4A8;border:none;color:#06231B;padding:12px 32px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
  #loginGate .btn:hover{filter:brightness(1.08);}

  /* 主区 */
  .main { height:calc(100vh - 58px - var(--mg-footer-height,34px)); display:flex; flex-direction:column; }
  .wb-strip { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:8px 28px; border-bottom:1px solid rgba(255,255,255,0.06); min-height:42px; }
  .wb-strip #projName { color:#fff; font-weight:700; font-size:15px; letter-spacing:.3px; }
  .wb-row { display:flex; flex:1; min-height:0; }
  .sidebar {
    width:248px; border-right:1px solid rgba(255,255,255,0.06);
    padding:18px 16px; overflow-y:auto; flex-shrink:0;
  }
  .sidebar.sb-hidden { width:0; min-width:0; padding-left:0; padding-right:0; border-right:none; overflow:hidden; }
  .sb-toggle { background:transparent; border:1px solid rgba(255,255,255,0.12); color:#9FB0C9; font-size:12px; padding:4px 10px; border-radius:7px; cursor:pointer; flex:0 0 auto; }
  .sb-toggle:hover { border-color:#2DD4A8; color:#2DD4A8; }
  .content { flex:1; overflow-y:auto; padding:28px 32px; }
  .content-inner { max-width:1180px; margin:0 auto; }

  /* 项目列表 */
  .side-title { font-size:12px; color:#5A6B85; letter-spacing:1px; margin-bottom:12px; }
  .proj-item {
    padding:11px 13px; border-radius:10px; border:1px solid transparent;
    margin-bottom:8px; cursor:pointer; transition:all .12s;
  }
  .proj-item:hover { background:rgba(45,212,168,0.06); }
  .proj-item.active { background:rgba(45,212,168,0.1); border-color:rgba(45,212,168,0.3); }
  .proj-item .nm { font-size:14px; color:#E8EDF6; }
  .proj-item .mt { font-size:11px; color:#5A6B85; margin-top:3px; }
  .new-btn {
    width:100%; margin-top:6px; padding:11px; border-radius:10px;
    background:rgba(45,212,168,0.1); border:1px dashed rgba(45,212,168,0.4);
    color:#2DD4A8; font-size:13px; font-weight:600;
  }
  .new-btn:hover { background:rgba(45,212,168,0.16); }

  /* 预设库（创建项目入口，非顶栏） */
  .preset-wrap { margin-top:4px; }
  .preset-head { display:flex; align-items:baseline; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .preset-head .pt { font-size:19px; font-weight:600; color:#E8EDF6; }
  .preset-head .ps { font-size:12px; color:#5A6B85; }
  .preset-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .preset-card {
    background:#0F1420; border:1px solid rgba(255,255,255,0.08); border-radius:12px;
    padding:14px; cursor:pointer; transition:all .14s; display:flex; flex-direction:column;
  }
  .preset-card:hover { border-color:rgba(45,212,168,0.45); transform:translateY(-2px); }
  .pc-thumb { height:86px; border-radius:9px; margin-bottom:11px; position:relative; overflow:hidden; }
  .pc-thumb .pc-tag { position:absolute; left:8px; top:8px; font-size:11px; color:#fff; background:rgba(0,0,0,.35); padding:2px 9px; border-radius:20px; }
  .pc-name { font-size:14px; font-weight:600; color:#E8EDF6; }
  .pc-desc { font-size:12px; color:#7C8AA3; margin-top:6px; line-height:1.6; flex:1; }
  .pc-use {
    margin-top:12px; width:100%; padding:9px; border-radius:8px; border:none;
    background:#2DD4A8; color:#06231B; font-weight:600; font-size:13px; cursor:pointer;
  }
  .pc-use:hover { filter:brightness(1.08); }
  .preset-foot { font-size:12px; color:#5A6B85; margin-top:16px; line-height:1.6; }
  .preset-foot b { color:#2DD4A8; }

  /* 技能库 / 技能横幅 / 项目技能徽章 (#13 改名"技能") */
  .skill-banner {
    display:flex; align-items:flex-start; gap:10px; margin:0 0 14px 0;
    background:rgba(245,166,35,0.08); border:1px solid rgba(245,166,35,0.32);
    border-radius:10px; padding:11px 14px;
  }
  .skill-banner .sb-chip {
    flex:0 0 auto; font-size:12px; font-weight:600; color:#06231B;
    background:#F5A623; border-radius:20px; padding:3px 11px; white-space:nowrap;
  }
  .skill-banner .sb-text { font-size:12.5px; color:#E8C98A; line-height:1.65; }
  .skill-badge {
    display:inline-block; font-size:11px; color:#F5A623; background:rgba(245,166,35,0.12);
    border:1px solid rgba(245,166,35,0.35); border-radius:5px; padding:1px 7px; margin-left:7px;
    vertical-align:middle;
  }

  /* 步骤轨 */
  /* 改编蓝图（步骤⑨）编辑卡 */
  .bp-wrap .ref-block{margin-bottom:12px;}
  .bp-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .bp-row .bp-in{flex:1;min-width:0;background:#0B111E;border:1px solid rgba(255,255,255,.14);border-radius:8px;color:#E8EDF6;padding:7px 9px;font-size:12px;font-family:inherit;}
  .bp-row .bp-in:focus{outline:none;border-color:rgba(45,212,168,.55);}
  .bp-row .bp-in.bp-grow{flex:1.6;}
  .bp-row.bp-head{font-size:11px;color:#6b7894;padding:0 2px;}
  .bp-row.bp-head span{flex:1;}
  .bp-del{background:transparent;border:1px solid rgba(255,255,255,.14);color:#8b98b3;border-radius:7px;padding:5px 9px;font-size:11px;cursor:pointer;font-family:inherit;flex:0 0 auto;}
  .bp-del:hover{color:#ff9b9b;border-color:rgba(255,155,155,.5);}
  .bp-add{font-size:12px;}
  .bp-ta{width:100%;box-sizing:border-box;background:#0B111E;border:1px solid rgba(255,255,255,.14);border-radius:8px;color:#E8EDF6;padding:9px 11px;font-size:12px;line-height:1.7;font-family:inherit;resize:vertical;}
  .bp-ta:focus{outline:none;border-color:rgba(45,212,168,.55);}
  .bp-foot{display:flex;gap:10px;align-items:center;margin-top:14px;}

  /* 故事中枢：人物 DNA 档案 / 场景三段描写（纯文字内容交付） */
  .dna-box{margin-top:12px;border:1px solid rgba(245,166,35,.25);border-radius:10px;padding:10px 12px;background:rgba(245,166,35,.04);}
  .dna-box .dna-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .dna-box .dna-head b{font-size:12px;color:#F5A623;letter-spacing:.5px;}
  .dna-box .dna-head .dna-tip{font-size:11px;color:#6b7894;}
  .dna-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;}
  .dna-cell{display:flex;gap:6px;align-items:flex-start;min-width:0;}
  .dna-cell label{flex:0 0 62px;font-size:11px;color:#6b7894;padding-top:6px;text-align:right;}
  .dna-cell input,.dna-cell textarea{flex:1;min-width:0;background:#0B111E;border:1px solid rgba(255,255,255,.12);border-radius:7px;color:#E8EDF6;padding:5px 8px;font-size:11.5px;font-family:inherit;}
  .dna-cell textarea{resize:vertical;line-height:1.6;}
  .dna-cell input:focus,.dna-cell textarea:focus{outline:none;border-color:rgba(45,212,168,.55);}
  .dna-full{display:flex;gap:6px;align-items:flex-start;margin-top:6px;}
  .dna-full label{flex:0 0 62px;font-size:11px;color:#F5A623;padding-top:6px;text-align:right;}
  .dna-full textarea{flex:1;min-width:0;background:#0B111E;border:1px solid rgba(245,166,35,.35);border-radius:7px;color:#F0D9AC;padding:7px 9px;font-size:11.5px;line-height:1.7;font-family:inherit;resize:vertical;}
  .dna-full textarea:focus{outline:none;border-color:rgba(45,212,168,.55);}
  .d3-box{margin-top:12px;border:1px solid rgba(45,212,168,.25);border-radius:10px;padding:10px 12px;background:rgba(45,212,168,.04);}
  .d3-box .d3-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .d3-box .d3-head b{font-size:12px;color:#2DD4A8;letter-spacing:.5px;}
  .d3-box .d3-head .d3-tip{font-size:11px;color:#6b7894;}
  .d3-item{margin-bottom:7px;}
  .d3-item label{display:block;font-size:11px;color:#6b7894;margin-bottom:3px;}
  .d3-item textarea{width:100%;box-sizing:border-box;background:#0B111E;border:1px solid rgba(255,255,255,.12);border-radius:7px;color:#E8EDF6;padding:7px 9px;font-size:11.5px;line-height:1.75;font-family:inherit;resize:vertical;}
  .d3-item textarea:focus{outline:none;border-color:rgba(45,212,168,.55);}

  .rail { display:flex; flex-direction:column; gap:4px; }
  .rail-step {
    display:flex; align-items:flex-start; gap:9px; padding:8px 12px;
    border-radius:9px; cursor:pointer; color:#7C8AA3; transition:all .12s;
    border-left:2px solid transparent;
  }
  .rail-step .verb { display:block; font-size:11px; color:#F5A623; letter-spacing:.5px; margin-bottom:1px; opacity:.9; }
  .rail-step .noun { display:block; font-size:14px; color:#AEB9CC; font-weight:600; }
  .rail-step:hover { background:rgba(255,255,255,0.04); }
  .rail-step.active { background:rgba(45,212,168,0.1); border-left-color:#2DD4A8; }
  .rail-step.active .noun { color:#2DD4A8; }
  .rail-step.done .verb { color:#8a7a4a; }
  .rail-step.done .noun { color:#6E7C93; }
  .rail-step.done:before { content:'✓'; color:#2DD4A8; font-size:12px; margin-top:2px; opacity:.65; flex:none; }
  .rail-back { margin-top:14px; }
  .side-title.guard-title { margin-top:20px; opacity:.55; font-size:11px; }
  .rail.guard-rail { gap:2px; }
  .rail.guard-rail .rail-step { padding:9px 12px 9px 14px; color:rgba(255,255,255,.6); font-size:13px; font-weight:500; }
  .rail.guard-rail .rail-step .num { display:none; }
  .rail.guard-rail .rail-step.active { color:#2DD4A8; background:rgba(45,212,168,0.08); }
  .rail.guard-rail .rail-step:hover { background:rgba(255,255,255,0.03); }
  .rail.guard-rail .rail-step:before { content:''; width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.28); margin-right:9px; flex:none; }
  .rail.guard-rail .rail-step.active:before { background:#2DD4A8; }

  /* 步骤内容通用 */
  .step-head { margin-bottom:22px; }
  .step-eyebrow { font-size:11px; letter-spacing:1.5px; color:#F5A623; margin-bottom:7px; text-transform:uppercase; }
  .step-head h2 { font-size:22px; font-weight:600; }
  .step-verb { color:#F5A623; font-weight:500; margin-right:2px; }
  .step-head p { color:#7C8AA3; font-size:13px; margin-top:6px; line-height:1.6; }
  .panel {
    background:#0F1420; border:1px solid rgba(255,255,255,0.07);
    border-radius:14px; padding:22px;
  }
  .primary-btn {
    background:#2DD4A8; border:none; color:#06231B; font-weight:600;
    padding:12px 22px; border-radius:9px; font-size:14px;
  }
  .primary-btn:hover { filter:brightness(1.08); }
  .primary-btn:disabled { opacity:.45; cursor:not-allowed; }
  .ghost-btn {
    background:transparent; border:1px solid rgba(255,255,255,0.14); color:#C9D3E3;
    padding:12px 22px; border-radius:9px; font-size:14px;
  }
  .ghost-btn:hover { border-color:#2DD4A8; color:#2DD4A8; }

  /* 步骤① 导入 */
  .import-area {
    width:100%; min-height:320px; resize:vertical; background:#0A0F1C;
    border:1px solid #243049; color:#E8EDF6; border-radius:10px;
    padding:16px; font-size:14px; line-height:1.8; outline:none; font-family:inherit;
  }
  .import-area:focus { border-color:#2DD4A8; }
  .import-bar { display:flex; align-items:center; gap:14px; margin-top:16px; flex-wrap:wrap; }
  .stat-pill { font-size:12px; color:#7C8AA3; background:rgba(255,255,255,0.04); padding:6px 12px; border-radius:20px; }
  .stat-pill b { color:#2DD4A8; font-weight:600; }
  .file-label {
    font-size:13px; color:#C9D3E3; border:1px solid rgba(255,255,255,0.14);
    padding:10px 16px; border-radius:9px; cursor:pointer;
  }
  .file-label:hover { border-color:#2DD4A8; color:#2DD4A8; }
  .hint { color:#5A6B85; font-size:12px; margin-top:14px; line-height:1.6; }

  /* 步骤① 过亿结构参照模版 */
  .ref-block { margin-top:18px; border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:14px 16px; background:rgba(255,255,255,0.02); }
  .ref-label { font-size:12px; color:#7C8AA3; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
  .ref-label::before { content:''; width:6px; height:6px; border-radius:50%; background:#2DD4A8; display:inline-block; }
  .ref-row { display:flex; gap:10px; flex-wrap:wrap; }
  .ref-btn {
    background:transparent; border:1px solid rgba(255,255,255,0.14); color:#C9D3E3;
    padding:9px 14px; border-radius:8px; font-size:13px; cursor:pointer; transition:all .15s;
  }
  .ref-btn:hover { border-color:#2DD4A8; color:#2DD4A8; }
  .ref-btn.active { border-color:#2DD4A8; color:#06231B; background:#2DD4A8; font-weight:600; }
  .ref-note { font-size:12px; color:#2DD4A8; margin-top:10px; line-height:1.6; }
  .parse-info {
    display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;
    font-size:12px; color:#7C8AA3;
  }
  .parse-info .pi-tag {
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
    border-radius:18px; padding:5px 12px;
  }
  .parse-info .pi-tag b { color:#2DD4A8; font-weight:600; margin:0 3px; }
  .parse-info .pi-tag.warn { border-color:rgba(245,166,35,0.3); background:rgba(245,166,35,0.06); color:#F5A623; }
  .parse-info .pi-tag.warn b { color:#F5A623; }

  /* 待实现占位 */
  .todo {
    text-align:center; padding:60px 20px; color:#5A6B85;
  }
  .todo .big { font-size:18px; color:#7C8AA3; margin-bottom:10px; }
  .todo .sm { font-size:13px; line-height:1.7; }
  .todo .step-tag {
    display:inline-block; margin-bottom:18px; font-size:12px; padding:4px 12px;
    border-radius:20px; background:rgba(245,166,35,0.12); color:#F5A623;
  }

  /* 共用：区块提示 */
  .need-prev { color:#F5A623; font-size:13px; background:rgba(245,166,35,0.08); border:1px solid rgba(245,166,35,0.25); padding:14px 16px; border-radius:10px; line-height:1.7; }
  .need-prev a { color:#2DD4A8; cursor:pointer; text-decoration:underline; }

  /* 步骤② 分集 */
  .seg-config { display:flex; flex-direction:column; gap:16px; }
  .seg-tabs { display:flex; gap:10px; flex-wrap:wrap; }
  .seg-tab {
    padding:10px 18px; border-radius:10px; border:1px solid rgba(255,255,255,0.14);
    color:#C9D3E3; font-size:14px; background:transparent; text-align:center;
  }
  .seg-tab.active { border-color:#2DD4A8; color:#2DD4A8; background:rgba(45,212,168,0.08); }
  .seg-tab small { color:#5A6B85; font-size:11px; display:block; margin-top:3px; }
  .custom-sec { display:flex; align-items:center; gap:10px; font-size:13px; color:#7C8AA3; }
  .custom-sec input {
    width:90px; background:#0A0F1C; border:1px solid #243049; color:#E8EDF6;
    border-radius:8px; padding:8px 10px; font-size:13px; outline:none;
  }
  .custom-sec input:focus { border-color:#2DD4A8; }
  .src-tabs { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .src-label { font-size:13px; color:#7C8AA3; }
  .src-tab {
    padding:8px 16px; border-radius:10px; border:1px solid rgba(255,255,255,0.14);
    color:#C9D3E3; font-size:13px; background:transparent; cursor:pointer;
  }
  .src-tab.active { border-color:#2DD4A8; color:#2DD4A8; background:rgba(45,212,168,0.08); }
  .src-tab:disabled { opacity:0.4; cursor:not-allowed; }
  .run-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .mode-note { font-size:12px; color:#5A6B85; }
  .ep-list { margin-top:6px; display:flex; flex-direction:column; gap:12px; }
  .ep-card { background:#0A0F1C; border:1px solid rgba(255,255,255,0.12); border-radius:12px; overflow:hidden; transition:border-color .18s ease, box-shadow .18s ease; }
  /* 分集每集作为独立单元突出；鼠标悬停细线高亮（品牌绿描边 + 微发光，与人物锁脸卡片 hover 统一） */
  .ep-card:hover { border-color:#2DD4A8; box-shadow:0 0 0 1px rgba(45,212,168,0.45), 0 8px 24px rgba(45,212,168,0.12); }

  function curShotDur(p) {

    var d = (p && p.shotDur) ? parseInt(p.shotDur, 10) : 5;
    return [5, 10, 15, 30].indexOf(d) >= 0 ? d : 5;
  }

  function defaultProject(name) {

      step: (function (s) {

  /* ============ 持久化 ============ */
  function setSaveStat(txt, cls) {
    var el = document.getElementById('saveStat');
    if (!el) return;
    el.textContent = txt;
    el.className = 'save-stat' + (cls ? ' ' + cls : '');
  }
  var lastBlockAlert = 0;
  function save(confirmEmpty) {
    if (!MG.isLoggedIn()) { setSaveStat('未登录', ''); return Promise.resolve(); }
    setSaveStat('保存中…', 'busy');
    return MG.api('/api/save_state', 'POST', { data: state, confirmEmpty: !!confirmEmpty, merge: true }).then(function (r) {
      if (r.ok) setSaveStat('已保存', 'ok');
      else if (r.blocked) {
        setSaveStat('内容被屏蔽', '');
        var now = Date.now();
        if (now - lastBlockAlert > 4000) {
          lastBlockAlert = now;
          alert('内容安全拦截：您提交的内容包含违反法律法规的信息（' + ((r.reasons || []).join('、') || '违规') + '），已被系统屏蔽且未保存。请移除相关内容后重试。');
        }
      }
      else setSaveStat(r.err || '保存失败', '');
    }).catch(function () { setSaveStat('保存失败', ''); });
  }
  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 600);
  }
  function load() {
    if (!MG.isLoggedIn()) {
      MG.openLogin(function () { location.reload(); });
      return;
    }
    // 方案 A：先拿轻量列表，再按需增量加载当前项目（不再全量下载 900KB+ state）
    MG.api('/api/list_projects').then(function (lr) {
      if (!lr.ok || !lr.projects) { return fallbackLoad(); }
      PROJECT_SUMMARY = lr.projects || [];
      var m = /[?&]project=([^&]+)/.exec(location.search);
      var cur = '';
      if (m) { var nm = decodeURIComponent(m[1]); if (PROJECT_SUMMARY.some(function (p) { return p.name === nm; })) cur = nm; }
      if (!cur && lr.current && PROJECT_SUMMARY.some(function (p) { return p.name === lr.current; })) cur = lr.current;
      if (!cur && PROJECT_SUMMARY.length) cur = PROJECT_SUMMARY[0].name;
      if (!cur) { state = { projects: {}, current: '' }; render(); return; }
      MG.api('/api/load_state?project=' + encodeURIComponent(cur)).then(function (r) {
        if (!r.ok) { return fallbackLoad(); }
        state = { projects: r.data.projects || {}, current: cur };
        Object.keys(state.projects).forEach(function (nm) { state.projects[nm] = normalizeProject(nm, state.projects[nm]); });
        syncProjectUrl(cur);
        render();
      }).catch(function () { fallbackLoad(); });
    }).catch(function () { fallbackLoad(); });
  }
  // 全量加载兜底（兼容老服务端 / 接口异常），保证不白屏
  function fallbackLoad() {
    MG.api('/api/load_state').then(function (r) {
      if (r.ok && r.data && r.data.projects) {
        state = Object.assign({ projects: {}, current: '' }, r.data);
        Object.keys(state.projects).forEach(function (nm) { state.projects[nm] = normalizeProject(nm, state.projects[nm]); });
        var m = /[?&]project=([^&]+)/.exec(location.search);
        if (m && state.projects[decodeURIComponent(m[1])]) state.current = decodeURIComponent(m[1]);
        PROJECT_SUMMARY = Object.keys(state.projects).map(function (nm) {
          var p = state.projects[nm] || {};
          return { name: nm, title: p.title || nm, updatedAt: p.updatedAt || 0, cover: '', step: p.step || 1, scene: p.scene || '', skillName: '' };
        });
        render();
      }
    });
  }

  /* ============ 渲染 ============ */
  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function cn(n) {
    var d = ['零','一','二','三','四','五','六','七','八','九','十'];
    if (n <= 10) return d[n];
    if (n < 20) return '十' + d[n - 10];
    if (n < 100) { var t = Math.floor(n / 10), o = n % 10; return d[t] + '十' + (o ? d[o] : ''); }
    return '' + n;
  }

  // 地址栏 ?project= 与当前项目保持同步，避免点进项目后 URL 仍显示第一个项目名
  function syncProjectUrl(nm) {
    try {
      var url = location.pathname + (nm ? ('?project=' + encodeURIComponent(nm)) : '');
      history.replaceState(null, '', url);
    } catch (e) {}
  }

  /* ---------------- 底部状态栏（与Storywright编辑器一致的落地感） ---------------- */
  var setStatus = null;
  function initStatusBar() {
    if (setStatus) return;
    setStatus = MG.mountStatusBar([
      { id: 'wbStProj',  label: '当前项目' },
      { id: 'wbStStep',  label: '当前步骤' },
      { id: 'wbStEp',    label: '集数' },
      { id: 'wbStShot',  label: '总镜头' },
      { id: 'wbStChar',  label: '剧本字数' }
    ], '剧本工作台');
  }
  function refreshStatusBar() {
    if (!setStatus) return;
    var p = curProject();
    if (!p) {
      ['wbStProj', 'wbStStep', 'wbStEp', 'wbStShot', 'wbStChar'].forEach(function (k) { setStatus(k, '—'); });
      setStatus('wbStProj', '未选择');
      return;
    }
    var eps = p.episodes || [];
    var shotCount = 0;
    Object.keys(p.shots || {}).forEach(function (k) {
      var arr = p.shots[k];
      if (Array.isArray(arr)) shotCount += arr.length;
    });
    var chars = (p.script && (p.script.charCount || (p.script.raw || '').length)) || 0;
    setStatus('wbStProj', p.name || '—');
    setStatus('wbStStep', (STEP_LABEL[p.step] || ('第' + p.step + '步')));
    setStatus('wbStEp', eps.length ? (eps.length + ' 集') : '未分集');
    setStatus('wbStShot', shotCount ? (shotCount + ' 镜') : '未分镜');
    setStatus('wbStChar', chars ? (chars.toLocaleString() + ' 字') : '—');
  }

  function render() {
    initStatusBar();
    var p = curProject();
    // 全局风格缓存：让 paintablePrompt / paintableVideoPrompt / 各类 LLM 系统提示词都能读当前项目风格
    window.__storywrightCurrentStyle = (p && p.style) ? p.style : '';
    // 第五批：全局风格卡缓存（卡上有内容时优先于预设风格词）
    window.__storywrightCurrentStyleCard = (p && p.styleCard) ? p.styleCard : null;
    var pn = document.getElementById('projName');
    if (p) {
      pn.style.display = '';
      pn.textContent = p.name;
    } else {
      pn.style.display = 'none';
      pn.textContent = '';
    }
    if (!p) renderProjectList();
    else renderWorkbench(p);
    refreshStatusBar();
  }

  window.__swRerender = function () { try { render(); } catch (e) {} };

      if (Array.isArray(wins)) {

  var PROJ_GRADIENTS = ['linear-gradient(135deg,#2d5a4a,#8b5a2b,#1f3a3a)', 'linear-gradient(135deg,#3a2f1a,#6b4f2a,#1a2a2a)', 'linear-gradient(135deg,#1f3a5a,#2a4f6b,#1a1a2a)', 'linear-gradient(135deg,#5a2d4a,#8b2b5a,#2a1f3a)', 'linear-gradient(135deg,#2d4a5a,#2b6b8b,#1a2a3a)', 'linear-gradient(135deg,#4a2d2d,#6b2a2a,#2a1a1a)'];
  function projectGradient(nm) {
    var h = 0; for (var i = 0; i < (nm || '').length; i++) h = (h * 31 + nm.charCodeAt(i)) >>> 0;

  // 切换项目：若已加载则直接切，否则按需增量拉取（方案 A，不重新全量下载）
  function switchProject(nm) {
    if (state.projects[nm]) {
      state.current = nm; syncProjectUrl(nm); save(); render();
      return;
    }
    MG.api('/api/load_state?project=' + encodeURIComponent(nm)).then(function (r) {
      if (!r.ok) { MG.alert('项目没拿到：' + (r.err || '未知错误')); return; }
      state.projects[nm] = normalizeProject(nm, (r.data.projects || {})[nm]);
      state.current = nm; syncProjectUrl(nm); save(); render();
    }).catch(function () { MG.alert('项目没拿到'); });
  }
  // 确保某项目已加载进 state.projects，未加载则按需拉取（供重命名等需要先拿完整数据的操作）
  function ensureProjectLoaded(nm) {
    if (state.projects[nm]) return Promise.resolve(state.projects[nm]);
    return MG.api('/api/load_state?project=' + encodeURIComponent(nm)).then(function (r) {
      if (!r.ok) return null;
      state.projects[nm] = normalizeProject(nm, (r.data.projects || {})[nm]);
      return state.projects[nm];
    });
  }

    var opts = '<option value="">不套用（稍后在步骤①选择）</option>';
    PRESETS.forEach(function (ps) { opts += '<option value="' + ps.id + '">' + esc(ps.name) + '</option>'; });

      + '<button class="np-ok" id="npOk">创建</button>'
      + '</div></div>';

    if (nameEl) nameEl.focus();

    mask.onclick = function (e) { if (e.target === mask) close(); };
    if (nameEl) nameEl.onkeydown = function (e) { if (e.key === 'Enter' && ok) ok.onclick(); };
    if (ok) ok.onclick = function () {
      var nm = (nameEl.value || '').trim();
      // #749：留空则生成占位名「草稿N」，导入剧本后自动识别剧名改名
      var autoNamed = false;
      if (!nm) {
        var dn = 1;

      state.projects[nm] = pr;
      PROJECT_SUMMARY.push({ name: nm, title: nm, updatedAt: Date.now(), cover: '', step: 1, scene: '', skillName: '' });

  // 判断当前文本是否是技能/模板的骨架文本（空白也算）
  function isPresetTemplateText(raw) {
    if (!raw || !raw.trim()) return true;
    var text = raw.trim();
    for (var i = 0; i < PRESETS.length; i++) {
      if (PRESETS[i].scriptTemplate && PRESETS[i].scriptTemplate.trim() === text) return true;
    }
    for (var k in STRUCTURE_TEMPLATES) {
      var t = STRUCTURE_TEMPLATES[k];
      if (t && t.skeleton && t.skeleton.trim() === text) return true;
    }
    return false;
  }
  // 用户是否已写入真实剧本（非空、非模板骨架）
  function hasUserScript(p) {
    var raw = (p.script && p.script.raw) || '';
    if (!raw.trim() || raw.trim().length < 60) return false;
    return !isPresetTemplateText(raw);
  }

  function applyPreset(p, preset, opts) {
    opts = opts || {};
    var hasUser = hasUserScript(p);
    var replaceScript = opts.replaceScript !== false && !hasUser;
    // ② 草稿骨架：只在用户没有真实剧本时填充技能模板；有用户剧本时只套制式，不替代故事
    p.script = p.script || {};
    if (replaceScript) {
      p.script.raw = preset.scriptTemplate || '';
      p.script.paragraphs = splitParagraphs(p.script.raw);
      p.script.blocks = parseScript(p.script.raw);
      p.script.charCount = (p.script.raw || '').replace(/\s/g, '').length;
      p.script.paraCount = p.script.paragraphs.length;
    }

    p.style = preset.style;                         // Storywright顶栏风格直读 proj.style
    // 技能高于风格：风格锁定、直接拿来用（定律）
    p.skill = {
      id: preset.id,
      name: preset.name,
      styleName: preset.styleName || preset.name,
      style: preset.style,
      styleLocked: true,                            // 锁定不可改（定律）
      tag: preset.tag || '官方',
      cine: { enhance: preset.cine.enhance, useEnglish: preset.cine.useEnglish },
      shotDefault: preset.shotDefault || null,      // Storywright窗口默认镜头基调（#438 自动套进新窗口）
      charBlueprint: preset.charBlueprint || [],    // 角色槽位蓝图（#437 自动铺到角色步骤）
      rhythm: preset.rhythm || null                 // 分集节奏（#436 提示接入分集/分镜）
    };
    // #437 角色蓝图自动铺到故事中枢（步骤④ 角色）：把技能角色预填为人物卡，含推荐音色；已有用户角色时合并不覆盖
    applySkillBlueprint(p);
    return p;
  }

  // #437 把技能 charBlueprint（[{role, voice}]）并入 p.bible.characters，按 name 合并、不覆盖已有字段
  function applySkillBlueprint(p) {
    if (!(p.skill && p.skill.charBlueprint && p.skill.charBlueprint.length)) return;
    if (!p.bible) p.bible = defaultProject('').bible;
    var cand = p.skill.charBlueprint.map(function (b) {
      return { name: b.role, role: b.role, voice: b.voice || '', fromBlueprint: true };
    });
    p.bible.characters = mergeBibleItems(p.bible.characters, cand, ['name'], function (existing, c) {
      if (!existing.role) existing.role = c.role || '';
      if (!existing.voice) existing.voice = c.voice || '';
      existing.fromBlueprint = true;
      return existing;
    });
  }

  // #442 把技能套用到「当前项目」（不再前置建项目）：有用户剧本时只套制式，无内容时才以技能模板作草稿骨架
  function applyPresetToCurrent(p, presetId) {
    var preset = null;
    for (var i = 0; i < PRESETS.length; i++) { if (PRESETS[i].id === presetId) { preset = PRESETS[i]; break; } }
    if (!preset) return;
    var hasUser = hasUserScript(p);
    var msg = hasUser
      ? '将把「' + preset.name + '」的制式（风格/镜头基调/节奏/角色蓝图）套用到当前剧本，你的故事与文本不会被替换。确定继续？'
      : '文本框为空或只有模板骨架，将载入「' + preset.name + '」的示例草稿，并把风格锁定为「' + preset.styleName + '」。确定继续？';
    MG.confirm(msg).then(function (ok) {
      if (!ok) return;
      applyPreset(p, preset, { replaceScript: !hasUser });

      renderStep(p);
      var doneMsg = hasUser
        ? '已套用「' + preset.name + '」制式：风格/镜头基调/节奏已锁定，角色蓝图已合并，原剧本未改动。'

  function renameProject(oldName) {
    ensureProjectLoaded(oldName).then(function (pr) {
      if (!pr) { MG.alert('项目不存在'); return; }
      MG.prompt('项目名称（当前：' + oldName + '）', oldName).then(function (nm) {
        if (nm === null) return;
        nm = (nm || '').trim();
        if (!nm || nm === oldName) return;
        if (PROJECT_SUMMARY.some(function (p) { return p.name === nm; })) { MG.alert('已存在同名项目：「' + nm + '」'); return; }
        MG.api('/api/rename_project', 'POST', { old: oldName, new: nm }).then(function (r) {
          if (!r.ok) { MG.alert('重命名失败：' + (r.err || '服务端拒绝')); return; }
          _localRename(oldName, nm, pr);
        });
      });
    });
  }
  // #749：导入剧本后按识别出的剧名自动改名（仅占位名触发），含重 key + URL 同步
  function autoRenameProject(p, newName) {
    newName = (newName || '').trim();
    if (!newName || newName === p.name) return;
    var oldName = p.name;
    if (PROJECT_SUMMARY.some(function (s) { return s.name === newName; })) {
      var alt = newName + ' 2', k = 2;
      while (PROJECT_SUMMARY.some(function (s) { return s.name === alt; })) { k++; alt = newName + ' ' + k; }
      newName = alt;
    }
    MG.api('/api/rename_project', 'POST', { old: oldName, new: newName }).then(function (r) {
      // 后端成功才落地本地改名（保持前端与服务端一致）；失败则提示手动改名，
      // 不擅自改 key —— 增量模式下本地没有旧项目完整数据，盲目改名会造成服务端新旧双份
      if (!r.ok) { MG.toast('自动改名未生效（' + (r.err || '服务端') + '），可在项目列表手动改名'); return; }
      _localRename(oldName, newName, p);
    });
  }
  function _localRename(oldName, newName, p) {
    delete state.projects[oldName];
    state.projects[newName] = p;
    p.name = newName;
    if (state.current === oldName) state.current = newName;
    p._autoNamed = false;
    var idx = -1;
    for (var i = 0; i < PROJECT_SUMMARY.length; i++) { if (PROJECT_SUMMARY[i].name === oldName) { idx = i; break; } }
    var sum = { name: newName, title: newName, updatedAt: p.updatedAt || Date.now(), cover: p.cover || '', step: p.step || 1, scene: p.scene || '', skillName: (p.skill && p.skill.name) ? p.skill.name : '' };
    if (idx >= 0) PROJECT_SUMMARY[idx] = sum; else PROJECT_SUMMARY.push(sum);
    syncProjectUrl(newName);
    save();
    render();
  }
  function deleteProject(name) {
    MG.confirm('确认删除项目「' + name + '」？删除后不可恢复。').then(function (ok) {
      if (!ok) return;
      MG.api('/api/delete_project', 'POST', { name: name }).then(function (r) {
        if (!r.ok) { MG.alert('删除失败：' + (r.err || '服务端拒绝')); return; }
        delete state.projects[name];
        var idx = -1;
        for (var i = 0; i < PROJECT_SUMMARY.length; i++) { if (PROJECT_SUMMARY[i].name === name) { idx = i; break; } }
        if (idx >= 0) PROJECT_SUMMARY.splice(idx, 1);
        // 重新拉取列表并定位当前项目（删除当前后自动落到下一个）
        load();
      });
    });
  }

  // pivot 收窄：主线到此为止——导入→故事中枢→分集大纲→改编剧本→生成分镜脚本（不再进视频空间）
  // 视频收敛到「广告视频」独立小口；工作台出口改为「导出资产包」，所有提示词带走去即梦/可灵/Midjourney 生图生视频
  // 一致性审计 / 完整性校验 仍是贯穿全程的质量护栏，不占用主线编号
  var STEP_LABEL = {
    1: '作品',
    2: '故事中枢',
    9: '改编蓝图',
    3: '分集大纲',
    4: '剧本',
    5: '分镜脚本',
    6: '导出资产包',
    7: '一致性审计',
    8: '完整性校验'
  };
  // 主线流程：改编蓝图（9）插在故事中枢与分集大纲之间——小说改编为主的核心步骤。
  // 用空闲号 9 而非重排 3/4/5：老项目 step 号语义完全不变，零迁移成本。
  var FLOW_STEPS = [1, 2, 9, 3, 4, 5];
  // 质量保障：一致性审计 / 完整性校验，是贯穿全程的护栏，不占用主线编号
  var GUARD_STEPS = [7, 8];
  // 主线步骤「动词弱 · 名词强」两段式
  var STEP_VERB = { 1: '导入', 2: '创建', 9: '决策', 3: '梳理', 4: '改编', 5: '生成' };

  function renderWorkbench(p) {
    // 侧栏：主线流程（动词弱·名词强，无 1234 编号，用高亮/打勾/置灰表达进度）+ 质量保障（弱化分组）
    var rail = '<div class="side-title">主线流程</div><div class="rail">';
    FLOW_STEPS.forEach(function (id) {
      var cls = 'rail-step';
      if (id === p.step) cls += ' active';
      else if (FLOW_STEPS.indexOf(id) < FLOW_STEPS.indexOf(p.step)) cls += ' done';
      var verb = STEP_VERB[id] ? ('<span class="verb">' + STEP_VERB[id] + '</span>') : '';
      rail += '<div class="' + cls + '" data-step="' + id + '">' + verb + '<span class="noun">' + STEP_LABEL[id] + '</span></div>';
    });
    rail += '</div>';
    rail += '<div class="side-title guard-title">质量保障</div><div class="rail guard-rail">';
    GUARD_STEPS.forEach(function (id) {
      var cls = 'rail-step guard-step';
      if (id === p.step) cls += ' active';
      rail += '<div class="' + cls + '" data-step="' + id + '"><span class="noun">' + STEP_LABEL[id] + '</span></div>';
    });
    rail += '</div>';
    rail += '<div class="rail-back"><button class="mini-btn" id="btnRailExport" style="width:100%;margin-bottom:8px;">⬇ 导出资产包（.md）</button><button class="mini-btn" id="btnBack" style="width:100%">← 项目列表</button></div>';
    document.getElementById('sidebar').style.display = '';
    document.getElementById('sidebar').innerHTML = rail;
    var _ex = document.getElementById('btnRailExport');
    if (_ex) _ex.onclick = function () { exportAssetPack(p); };

    Array.prototype.forEach.call(document.querySelectorAll('.rail-step'), function (el) {
      el.onclick = function () {
        var s = parseInt(el.getAttribute('data-step'), 10);
        // 只有用户主动点「进入视频空间」这一步才真的跳走；页面加载等自动渲染不得跳转，
        // 否则从视频工作台点顶栏回剧本工作台会被立刻弹回去，形成互跳死循环。
        if (s === 6) _step6ByUser = true;
        p.step = s; save(); render();
      };
    });
    document.getElementById('btnBack').onclick = function () { state.current = ''; syncProjectUrl(''); save(); render(); };

    renderStep(p);
  }

  // 步骤⑥「进入视频空间」本身没有编辑界面，历史上 renderStep 一遇到 step===6 就无条件
  // location.href 到 jinge.html。结果是：项目一旦走到第 6 步，从视频工作台点顶栏
  // 「剧本工作台」→ 页面加载 → renderStep(6) → 又被弹回 jinge，永远回不来。
  // 现在改为：仅当用户主动点该步骤时才跳转；其余情况渲染落地页，给两条明确出路。
  var _step6ByUser = false;

  function renderStep6(p) {
    var eps = p.episodes || [];
    var done = 0;
    eps.forEach(function (e) { if (p.shots && p.shots[e.id] && p.shots[e.id].length) done++; });
    var stat = eps.length ? ('当前 ' + done + ' / ' + eps.length + ' 集已生成分镜。') : '当前项目还没有分集。';
    return '<div class="gate">' +
      '<div class="gate-head">剧本已生成完毕</div>' +
      '<div class="gate-note">' + esc(stat) + '本地版是纯剧本工作台——出图、配音、成片请拿导出的提示词去你自己的即梦 / 可灵 / Midjourney 等工具完成。点右侧按钮一键导出全剧内容资产包（.md），带走即开工。</div>' +
      '<div class="gate-actions">' +
      '<button class="ghost-btn" id="btnS6Back">← 回到分镜脚本</button>' +
      '<button class="primary-btn" id="btnS6Go">导出全剧内容资产包 →</button>' +
      '</div></div>';
  }
  function wireStep6(p) {
    var go = document.getElementById('btnS6Go');
    if (go) go.onclick = function () { exportAssetPack(p); };
    var back = document.getElementById('btnS6Back');
    if (back) back.onclick = function () { p.step = 5; save(); render(); };
  }

  function renderStep(p) {
    var n = p.step;
    var head;
    var fi = FLOW_STEPS.indexOf(n);
    if (fi >= 0) {
      var verb = STEP_VERB[n] ? ('<span class="step-verb">' + STEP_VERB[n] + '</span> ') : '';
      head = '<div class="step-head"><div class="step-eyebrow">主线流程 · 第 ' + (fi + 1) + ' / ' + FLOW_STEPS.length + ' 步</div>' +
        '<h2>' + verb + esc(STEP_LABEL[n]) + '</h2><p>' + (STEP_DESC[n] || '') + '</p></div>';
    } else {
      head = '<div class="step-head"><div class="step-eyebrow">质量保障</div>' +
        '<h2>' + esc(STEP_LABEL[n]) + '</h2><p>' + (STEP_DESC[n] || '') + '</p></div>';
    }
    // pivot：视频空间已从主线移除，老项目若停在 step=6 直接落回分镜脚本，出口改为导出资产包
    if (n === 6) { p.step = 5; save(); render(); return; }
    var body = '';
    if (n === 6) body = renderStep6(p);
    else if (n === 1) body = renderImport(p);
    else if (n === 2) { ensureCentral(p); body = renderCentral(p); }
    else if (n === 9) body = renderBlueprint(p);
    else if (n === 3) body = renderSeg(p);
    else if (n === 4) body = renderEpisode(p, 'script');
    else if (n === 5) body = renderEpisode(p, 'shots');
    else if (n === 7) body = renderAudit(p);
    else if (n === 8) body = renderGate(p);
    else body = renderTodo(n, p);
    document.getElementById('contentInner').innerHTML = head + skillBanner(p) + '<div class="panel">' + body + '</div>';
    if (n === 6) wireStep6(p);
    else if (n === 1) wireImport(p);
    else if (n === 2) wireCentral(p);
    else if (n === 9) wireBlueprint(p);
    else if (n === 3) wireSeg(p);
    else if (n === 4) wireEpisode(p, 'script');
    else if (n === 5) wireEpisode(p, 'shots');
    else if (n === 7) wireAudit(p);
    else if (n === 8) wireGate(p);
  }

  var STEP_DESC = {
    1: '把你的故事交给我——粘贴或上传都行（小说 / 剧本 / 散文 / 口述均可），我先数清字数和段落。接着进「故事中枢」，我通读全稿，把全剧设定建起来。',
    2: '故事中枢是我记住你世界的地方。我通读全稿，把全剧大纲（每集详情）、人物档案、场景、关系、伏笔、暗线与审计规则都记下来，后面每一步都照着它走。你随时可以改我记的东西。',
    9: '这一步我只干一件事：决定这部小说怎么变成短剧。我通读全稿后给出改编方案——保留哪些线、砍掉哪些线、哪些人物合并、每一集从原著哪里切进来、爽点怎么重排、哪些忠于原著哪些二创。每一项你都可以改，改完确认才进分集大纲。改编权在你手里。',
    3: '我先通读全稿、画出「故事地图」（叙事弧 + 关键转折 + 情绪曲线），再按故事事件的重要程度切集——每一集都保证有足够可拍的素材，不做机械按字数切。你在评审页逐集看素材够不够，过薄的集可以舍掉。',
    4: '我一集一集改写成可拍的剧本：人物、动作、对白、光线、机位、情绪，按短剧节拍铺开。右侧「本集大纲（故事中枢）」对照这一集的目标内容与目标字数，我盯着不跑偏。',
    5: '我把剧本拆成一个个镜头：时长、节奏、景别、人物、对白、光线、机位、画面与图生视频提示词，字段全铺开。镜头时长档可选 5/10/15/30 秒（默认 5 秒），镜头数按「本集秒数 ÷ 档位」自动分配。可以整集交给我，也可以自己增删。分镜就绪后，从底部「导出资产包」一键把所有提示词带走，去即梦 / 可灵 / Midjourney 生图生视频。',
    6: '分镜就绪。本地版是纯剧本工作台，不内置出图 / 出片；点「导出资产包」把所有提示词一次性带走，去即梦 / 可灵 / Midjourney 生图生视频。',
    7: '我会逐条核对人物 / 时间线 / 设定有没有打架，列出问题并定位到集和镜。平时不用常看。',
    8: '交片前我对照故事中枢和分镜做一遍完整性检查（软提示），列「建议完善」项，但不拦你出片。快速试片和正式交付都能用。'
  };

  function skillBanner(p) {
    if (!(p.skill && p.skill.styleLocked)) return '';
    return '<div class="skill-banner">' +
      '<span class="sb-chip">技能 · ' + esc(p.skill.name) + '</span>' +
      '<span class="sb-text">已锁定风格「' + esc(p.skill.styleName || p.skill.style) + '」，出片画风与镜头基调由该技能统一设定，不可在编辑器中更改。你只需在模板草稿上改稿、走流程出片即可。</span>' +
    '</div>';
  }

  function renderTodo(n, p) {
    var extra = '';
    if (n === 7) extra = '一致性审计将校验人物 / 时间线 / 设定矛盾，列出问题并定位到集与镜，将在后续阶段实现。';
    return '<div class="todo"><div class="big">本步骤将在后续实现</div><div class="sm">' + extra + '</div></div>';
  }

  /* 本地开源版只含剧本工作台；出图 / 配音 / 成片在云端托管版提供，不内置 jinge.html */
  function gotoJinge(p) {
    save();
    alert('本地开源版是纯剧本工作台，不内置出图、配音、成片。后续渲染工序请把导出的资产包拿去云端托管版或你自己的出图 / 出视频工具完成。');
  }

  /* ---------- 步骤⑦ 一致性审计 ---------- */
  function shotText(s) {
    if (!s) return '';
    return [s.scene, (s.chars || []).join(' '), s.action, s.dialogue, s.light, s.camera, s.mood, s.prompt].join(' ');
  }
  function charInShot(s, name) {
    if (!name || !s) return false;
    if (s.chars && s.chars.indexOf(name) >= 0) return true;
    var t = shotText(s);
    return t.indexOf(name) >= 0;
  }
  function allShotsOf(p) {
    var list = [];
    (p.episodes || []).forEach(function (ep, ei) {
      var ss = p.shots[ep.id] || [];
      ss.forEach(function (s, idx) { list.push({ ep: ep, epIdx: ei, shot: s, idx: idx }); });
    });
    return list;
  }
  function shotsAsText(p) {
    var out = [];
    allShotsOf(p).forEach(function (x) {
      out.push('（第' + (x.epIdx + 1) + '集·镜' + (x.idx + 1) + '）' + shotText(x.shot));
    });
    return out.join('\n');
  }

  // 结构校验：比对故事圣经与全部分镜，产出可定位的发现
  function computeStructuralChecks(p) {
    var checks = [];
    var bible = p.bible || {};
    var chars = bible.characters || [];
    var scenes = bible.scenes || [];
    var rels = bible.relations || [];
    var all = allShotsOf(p);

    if (!all.length) {
      checks.push({ sev: 'tip', key: 'no-shots', title: '尚未生成分镜，暂无可审计内容', detail: '请先完成步骤③分集大纲与步骤⑤生成分镜脚本，审计会自动比对全剧人物 / 场景设定与分镜画面是否一致。' });
      return checks;
    }

    var bibleNames = chars.map(function (c) { return c.name; }).filter(Boolean);

    // 1) 圣经人物出场 + 服装 / 不可变标志物漂移
    chars.forEach(function (c) {
      if (!c.name) return;
      var inShots = all.filter(function (x) { return charInShot(x.shot, c.name); });
      if (!inShots.length) {
        checks.push({ sev: 'tip', key: 'char-absent:' + c.name, title: '故事中枢人物「' + c.name + '」尚未出现在任何分镜', detail: '若此角色已下线可忽略；否则请确认步骤⑤已为该角色生成镜头。' });
        return;
      }
      // 服装锁定 token 检查（仅报告首处缺失）
      if (c.costume) {
        var toks = c.costume.split(/[+、，,]/).map(function (t) { return t.trim(); }).filter(function (t) { return t.length >= 2; });
        for (var i = 0; i < inShots.length; i++) {
          var t = shotText(inShots[i].shot);
          var miss = toks.filter(function (tk) { return t.indexOf(tk) === -1; });
          if (miss.length) {
            checks.push({ sev: 'warn', key: 'cost-drift:' + c.name + ':' + inShots[i].epIdx + ':' + inShots[i].idx, fix: { kind: 'appendPrompt', epIdx: inShots[i].epIdx, shotIdx: inShots[i].idx, text: c.costume }, title: '「' + c.name + '」服装可能漂移', detail: '故事中枢锁定服装「' + c.costume + '」，但第' + (inShots[i].epIdx + 1) + '集·镜' + (inShots[i].idx + 1) + '未出现：' + miss.join('、') + '（仅显示首处）。可一键把锁定服装补回该镜画面提示词。' });
            break;
          }
        }
      }
      // 不可变标志物
      if (c.mustNotChange) {
        var mks = c.mustNotChange.split(/[、，,。；;]/).map(function (t) { return t.trim(); }).filter(function (t) { return t.length >= 2; });
        for (var j = 0; j < inShots.length; j++) {
          var t2 = shotText(inShots[j].shot);
          var mm = mks.filter(function (mk) { return t2.indexOf(mk) === -1; });
          if (mm.length) {
            checks.push({ sev: 'warn', key: 'mustchg:' + c.name + ':' + inShots[j].epIdx + ':' + inShots[j].idx, fix: { kind: 'appendPrompt', epIdx: inShots[j].epIdx, shotIdx: inShots[j].idx, text: c.mustNotChange }, title: '「' + c.name + '」不可变标志物可能丢失', detail: '故事中枢要求始终保留「' + c.mustNotChange + '」，第' + (inShots[j].epIdx + 1) + '集·镜' + (inShots[j].idx + 1) + '未见：' + mm.join('、') + '（仅显示首处）。可一键把该标志物补回画面提示词。' });
            break;
          }
        }
      }
    });

    // 2) 分镜出现但未在圣经登记的人物（疑似笔误 / 漏录）
    var seenUnknown = {};
    all.forEach(function (x) {
      (x.shot.chars || []).forEach(function (nm) {
        if (!nm || seenUnknown[nm]) return;
        if (bibleNames.indexOf(nm) < 0 && nm.length >= 2) {
          seenUnknown[nm] = true;
          checks.push({ sev: 'warn', key: 'char-unreg:' + nm, title: '分镜出现人物「' + nm + '」但未在故事中枢登记', detail: '可能是笔误，或需在步骤②（故事中枢）补充该人物档案，否则出图无法锁定其定妆。' });
        }
      });
    });

    // 3) 圣经场景使用 + 分镜场景未登记
    var sceneNames = scenes.map(function (s) { return s.name; }).filter(Boolean);
    scenes.forEach(function (sc) {
      if (!sc.name) return;
      var used = all.some(function (x) { return (x.shot.scene && x.shot.scene.indexOf(sc.name) >= 0) || shotText(x.shot).indexOf(sc.name) >= 0; });
      if (!used) checks.push({ sev: 'tip', key: 'scene-absent:' + sc.name, title: '故事中枢场景「' + sc.name + '」尚未在分镜中出现', detail: '若该场景暂未用到可忽略。' });
    });
    var seenScene = {};
    all.forEach(function (x) {
      var sn = x.shot.scene;
      if (!sn || seenScene[sn]) return;
      seenScene[sn] = true;
      if (sceneNames.indexOf(sn) < 0) {
        checks.push({ sev: 'warn', key: 'scene-unreg:' + sn, title: '分镜场景「' + sn + '」未在故事中枢登记', detail: '建议在步骤②（故事中枢）补充该场景档案，统一其定妆与色调。' });
      }
    });

    // 4) 关系涉及未登记人物
    rels.forEach(function (r) {
      if (!r) return;
      [r.from, r.to].forEach(function (nm) {
        if (nm && bibleNames.indexOf(nm) < 0) {
          checks.push({ sev: 'tip', key: 'rel-unreg:' + nm, title: '人物关系涉及未登记人物「' + nm + '」', detail: '关系：' + (r.from || '') + ' — ' + (r.type || '') + ' — ' + (r.to || '') + '。' });
        }
      });
    });

    if (!checks.length) {
      checks.push({ sev: 'pass', key: 'pass', title: '结构一致性校验通过', detail: '全剧人物 / 场景的出场与登记未发现明显漂移。审计规则请见下方手动或自动核对。' });
    }
    return checks;
  }

  // 把缺失的既定元素补回某镜画面提示词（只改 shot.prompt，绝不动剧情正文）
  function applyPromptFix(p, fix) {
    if (!fix || fix.kind !== 'appendPrompt') return false;
    var ep = p.episodes[fix.epIdx]; if (!ep) return false;
    var ss = p.shots[ep.id] || []; var s = ss[fix.shotIdx]; if (!s) return false;
    if (!s.prompt) s.prompt = '';
    if (s.prompt.indexOf(fix.text) >= 0) return false; // 已含，无需改
    s.prompt = (s.prompt + ' ' + fix.text).trim();
    return true;
  }
  function findCheckByKey(p, key) {
    var cs = computeStructuralChecks(p);
    for (var i = 0; i < cs.length; i++) { if (cs[i].key === key) return cs[i]; }
    return null;
  }
  function fixSingleByKey(p, key) {
    var c = findCheckByKey(p, key);
    if (!c || !c.fix) return 0;
    return applyPromptFix(p, c.fix) ? 1 : 0;
  }
  // 一次性修复所有「可自动修」的结构性提示词缺失（服装 / 标志物漂移）
  function fixAuditPromptDrift(p) {
    var cs = computeStructuralChecks(p); var n = 0;
    cs.forEach(function (c) { if (c.fix && applyPromptFix(p, c.fix)) n++; });
    return n;
  }
  function runAutoFixAll(p, btn) {
    var en = (window.SW_I18N && SW_I18N.getLang() === 'en');
    var cs = computeStructuralChecks(p);
    var fixableCount = cs.filter(function (c) { return c.fix; }).length;
    if (!fixableCount) {
      alert(en
        ? 'Nothing can be auto-fixed right now.\n\nOnly these are auto-fixable: costumes / invariant markers locked for a character in the Story Bible · Setting layer, when they are missing from the corresponding shot\'s image prompt.\n\nTo create fixable items: step 2 Story Bible → expand "Setting layer" → fill in "Look description / costume" or "Invariant markers" on a character card, then run the audit in step 5 to see "Auto-fix".'
        : '当前没有可自动修复的项。\n\n可自动修复的只有：在故事中枢·设定层里给人物锁定的「服装 / 不可变标志物」，于对应分镜的「画面提示词」中缺失时。\n\n若想产生可修复项：步骤④ 故事中枢 → 展开「设定层」→ 人物卡填写「定妆描述 / 服装」或「不可变标志物」，再去步骤⑤ 审计即可看到「自动修复」。');
      return;
    }
    if (btn) { btn.disabled = true; btn.textContent = en ? 'Fixing…' : '修复中…'; }
    var n = fixAuditPromptDrift(p);
    if (btn) { btn.disabled = false; btn.textContent = en ? 'Auto-fix all' : '一键自动修复'; }

      }
      if ((bp.episodeCuts || []).length) {
        L.push('');
        L.push(en ? '### Episode cut points' : '### 分集切分点');
        bp.episodeCuts.forEach(function (x) {
          L.push('- **' + (en ? ('Episode ' + (x.ep || '?')) : ('第' + (x.ep || '?') + '集')) + '**' + (en ? ' (' : '（') + (x.source || '') + (en ? ')' : '）'));
          if (x.hook) L.push('  - ' + (en ? 'Ending hook: ' : '结尾钩子：') + x.hook);
          if (x.beats) L.push('  - ' + (en ? 'Three beats: ' : '本集三拍：') + x.beats);

    }

    L = L.concat(catLinesStyle(p));
    L = L.concat(catLinesChars(p));
    L = L.concat(catLinesScenes(p));

    var eps = p.episodes || [];
    L.push(en ? '## Episodes / Storyboard' : '## 分集 / 分镜');
    if (!eps.length) L.push(en ? '(no episodes yet)' : '（暂无分集）');

      L.push('### ' + (en ? ('Episode ' + (idx + 1)) : ('第 ' + (idx + 1) + ' 集')) + ' ' + (ep.title || ''));
      if (ep.summary) L.push(ep.summary);
      if (ep.text) { L.push(''); L.push(ep.text); }
      var sh = (p.shots && p.shots[ep.id]) || [];
      if (sh.length) {
        L.push('');
        L.push(en ? '**Storyboard (for video):**' : '**分镜（生视频）：**');
        sh.forEach(function (s, i) {

  /* 审计条目本地化：title/detail 是运行时拼接的（含人名/集数/镜数），字典精确匹配管不到，

  var AUDIT_TITLE_EN = [
    [/^故事中枢人物「(.+)」尚未出现在任何分镜$/, '"$1" from the Story Bible has not appeared in any shot'],
    [/^「(.+)」服装可能漂移$/, 'Possible costume drift for "$1"'],

    [/^分镜场景「(.+)」未在故事中枢登记$/, 'Shot scene "$1" is not registered in the Story Bible'],
    [/^人物关系涉及未登记人物「(.+)」$/, 'Relation involves unregistered character "$1"']
  ];
  var AUDIT_DETAIL_EN = [
    [/^故事中枢锁定服装「(.+)」，但第(\d+)集·镜(\d+)未出现：(.+)（仅显示首处）。可一键把锁定服装补回该镜画面提示词。$/, 'The Story Bible locks costume "$1", but episode $2 · shot $3 is missing: $4 (first occurrence shown). One click patches it back into that shot\'s image prompt.'],
    [/^故事中枢要求始终保留「(.+)」，第(\d+)集·镜(\d+)未见：(.+)（仅显示首处）。可一键把该标志物补回画面提示词。$/, 'The Story Bible requires "$1" at all times, but episode $2 · shot $3 does not show it: $4 (first occurrence shown). One click patches the marker back into the image prompt.'],
    [/^关系：(.+) — (.+) — (.+)。$/, 'Relation: $1 — $2 — $3.']
  ];
  function localizeCheck(c) {
    if (!(window.SW_I18N && SW_I18N.getLang() === 'en')) return c;
    var out = { sev: c.sev, key: c.key, fix: c.fix, title: c.title, detail: c.detail };
    var i;
    for (i = 0; i < AUDIT_TITLE_EN.length; i++) {
      if (AUDIT_TITLE_EN[i][0].test(c.title)) { out.title = c.title.replace(AUDIT_TITLE_EN[i][0], AUDIT_TITLE_EN[i][1]); break; }
    }
    if (c.detail) {
      for (i = 0; i < AUDIT_DETAIL_EN.length; i++) {
        if (AUDIT_DETAIL_EN[i][0].test(c.detail)) { out.detail = c.detail.replace(AUDIT_DETAIL_EN[i][0], AUDIT_DETAIL_EN[i][1]); break; }

  function renderAudit(p) {
    var en = (window.SW_I18N && SW_I18N.getLang() === 'en');

    var checks = computeStructuralChecks(p).filter(function (c) {
      return c.key ? (p.audit.ignoredKeys.indexOf(c.key) === -1) : true;
    });
    var pass = checks.filter(function (c) { return c.sev === 'pass'; }).length;
    var warn = checks.filter(function (c) { return c.sev === 'warn' || c.sev === 'fail'; }).length;
    var tip = checks.filter(function (c) { return c.sev === 'tip'; }).length;
    var fixable = checks.filter(function (c) { return c.fix; }).length;

    var lastRun = p.audit.lastRun
      ? ((window.SW_I18N && SW_I18N.getLang() === 'en') ? ('(last auto-check: ' + fmtTime(p.audit.lastRun) + ')') : ('（上次自动核对：' + fmtTime(p.audit.lastRun) + '）'))
      : '';

    var toolbar = '<div class="audit-toolbar">' +

      (fixable ? '<button class="ghost-btn" id="btnAutoFix">' + (en ? ('Auto-fix all (' + fixable + ')') : ('一键自动修复（' + fixable + '）')) + '</button>'
                : '<button class="ghost-btn" id="btnAutoFix" disabled style="opacity:.5;cursor:not-allowed;">' + (en ? 'Nothing to auto-fix' : '无可自动修复项') + '</button>') +
      '<span class="hint" style="margin:0;">' + (en

    var sumHtml = '<div class="audit-sum">' +

      '<div class="pill tip"><b>' + tip + '</b>提示</div>' +

    var findsHtml = checks.map(function (c0) {
      var c = localizeCheck(c0);
      var label = en ? (c.sev === 'pass' ? 'Pass' : (c.sev === 'tip' ? 'Tip' : (c.sev === 'warn' ? 'Warning' : 'Risk')))
        : (c.sev === 'pass' ? '通过' : (c.sev === 'tip' ? '提示' : (c.sev === 'warn' ? '注意' : '风险')));
      var actions = '';
      if (c.fix) actions = '<button class="btn-fix" data-fix-key="' + esc(c.key) + '">自动修复</button><button class="btn-ignore" data-ignore-key="' + esc(c.key) + '">忽略</button>';
      else if (c.sev !== 'pass') actions = '<button class="btn-ignore" data-ignore-key="' + esc(c.key || '') + '">忽略</button>';
      return '<div class="find ' + c.sev + '"><div class="sev">' + label + '</div><div class="body">' +
        '<div class="ftitle">' + esc(c.title) + '</div>' +
        (c.detail ? '<div class="fdetail">' + esc(c.detail) + '</div>' : '') +
        (actions ? '<div class="find-actions">' + actions + '</div>' : '') +
        '</div></div>';
    }).join('');

    var rules = (p.bible && p.bible.auditRules) || [];
    var rulesHtml;
    if (!rules.length) {
      rulesHtml = '<div class="hint">未在故事中枢定义「一致性审计规则」。可在步骤②「一致性审计规则」区块添加，例如：『林小满家境清贫，全片不得出现豪车名表』『苏锦儿玉佩从第2镜起始终佩戴』。定义后这里会逐条可勾选核对。</div>';
    } else {
      rulesHtml = rules.map(function (r, i) {
        var v = p.audit.ruleVerdicts[i] || 'pending';
        var ev = p.audit.ruleEvidence[i] || '';
        var sel = '<select class="rule-sel" data-i="' + i + '">' +
          '<option value="pending"' + (v === 'pending' ? ' selected' : '') + '>待核对</option>' +
          '<option value="pass"' + (v === 'pass' ? ' selected' : '') + '>通过</option>' +
          '<option value="fail"' + (v === 'fail' ? ' selected' : '') + '>风险</option>' +
          '<option value="na"' + (v === 'na' ? ' selected' : '') + '>不适用</option>' +
          '</select>';
        var rev = ev ? '<div class="rev' + (v === 'fail' ? ' ev-fail' : '') + '">引擎核对：' + esc(ev) + '</div>' : '';
        return '<div class="rule-item"><div class="rhead"><div class="rtext">' + esc(r.rule || '') +
          (r.scope ? '<span class="rscope">适用范围：' + esc(r.scope) + '</span>' : '') + '</div>' + sel + '</div>' + rev + '</div>';
      }).join('');
    }

    return toolbar + sumHtml +
      '<div class="audit-sec-title">结构一致性（自动校验）</div>' + findsHtml +
      '<div class="audit-sec-title audit-adv-head" data-audit-adv>审计规则核对（来自故事中枢 · 点击展开）</div>' +
      '<div class="audit-adv-body" style="display:none;">' + rulesHtml + '</div>';
  }

  function auditLLMMessages(rules, ctx, scriptText) {
    var ctxBlock = ctx ? '【已确认的统一设定（必须严格沿用的定妆 / 服装 / 场景）】\n' + ctx + '\n\n' : '';
    var rulesText = rules.map(function (r, i) {
      return (i + 1) + '. ' + (r.rule || '') + (r.scope ? '（适用范围：' + r.scope + '）' : '');
    }).join('\n');
    var sys = '你是一致性审计专家。请依据【统一设定】与【全剧内容】，逐条判断每条【审计规则】是否被遵守。\n' +
      '【返回格式】只输出 JSON，不要解释：\n{ "results": [ { "index": 0, "status": "pass" 或 "fail" 或 "warn" 或 "na", "evidence": "简述判定依据与出错位置（如 第3集镜5），通过也请给一句依据" } ] }\n' +
      '说明：status 取 pass（遵守）、fail（明显违反）、warn（疑似违反/不确定）、na（规则不适用于当前内容）。';
    var user = ctxBlock + '【全剧内容（含分镜画面提示词）】\n' + scriptText + '\n\n【待核对规则】\n' + rulesText;

  function parseAuditResponse(text) {
    try {
      var m = text.match(/(\{[\s\S]*\})/);
      if (!m) return null;
      var raw = JSON.parse(m[0]);
      if (Array.isArray(raw.results)) return raw.results;
      return null;
    } catch (e) { return null; }
  }

  function runAuditLLM(p) {
    var rules = (p.bible && p.bible.auditRules) || [];
    var btn = document.getElementById('btnRunAudit');
    if (!rules.length) { save(); renderStep(p); return; }
    if (btn) { btn.disabled = true; btn.textContent = '核对中…'; }
    showProgress('正在核对审计规则', '我在逐条对人物、时间线和设定，有冲突的会标到具体集和镜。');
    var ctx = buildBibleContext(p);
    var scriptText = fullScriptText(p) + '\n\n【分镜画面】\n' + shotsAsText(p);
    MG.api('/api/llm', 'POST', { messages: auditLLMMessages(rules, ctx, scriptText) }).then(function (r) {
      hideProgress();
      if (btn) { btn.disabled = false; btn.textContent = '运行一致性审计'; }
      if (r && r.ok && !r.noKey && r.text) {
        var parsed = parseAuditResponse(r.text);
        if (parsed) {
          parsed.forEach(function (res) {
            var i = res.index;
            if (typeof i !== 'number') return;
            p.audit.ruleVerdicts[i] = res.status || 'pending';
            p.audit.ruleEvidence[i] = res.evidence || '';
          });
          p.audit.lastRun = Date.now();
          save(); renderStep(p);
          return;
        }
      }
      if (r && r.noKey) alert('我这边还没接上核对通道，自动核对做不了。你可以在下拉框里手动勾选每条规则。');
      else alert('审计未能解析出有效结构，请重试或手动勾选。');
      save(); renderStep(p);

    });

  /* ---------- 步骤① 导入作品 ---------- */
  function splitParagraphs(raw) {
    var paras = raw.split(/\n+/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
    return paras;
  }

  // 把原始文本解析成带语义类型的块：title / section / episode / profile / body
  function parseScript(raw) {
    var paras = splitParagraphs(raw);
    var blocks = [];
    var metaSection = null; // 当前处于哪种元信息区：'character' / 'scene' / 'beat' 等
    var curChar = null;      // 当前打开的人物小传块（角色设定区内，子行并入同一人物）
    var lastHeadingLevel = 0;

    // 识别是否为"集标题"：第X集 / 第 X 集（允许空格）/ EPX / Episode X / 【第X集】等
    // 关键：必须「第」开头（或【第】包裹），避免「第一次小反转（第 7 集）」这类句子误判为集标题
    function isEpisodeHeading(t) {
      var s = (t || '').replace(/^\s+/, '');
      return /^第\s*[0-9零一二三四五六七八九十百千]+\s*集/.test(s) ||
        /^EP\s*\d+/i.test(s) || /^Episode\s*\d+/i.test(s) ||
        /【第\s*[0-9零一二三四五六七八九十百千]+\s*集[·\.\-]?[^】]*】/.test(t);
    }

    // 中文序号大标题：一、二、三、…（后续可跟文字），用于把「一、剧本核心定位」等识别为结构分区而非正文
    function isCnSection(t) {
      return /^[一二三四五六七八九十百千零]+\s*[、.．）)]\s*/.test(t);
    }
    // 阶段标题：第一阶段（1-8集）/ 第三阶段（16-24 集）等，属结构说明，不要进正文
    function isStageHeading(t) {
      var s = (t || '').replace(/^\s+/, '');
      return /^第\s*[一二三四五六七八九十]+\s*阶段/.test(s) || /^[一二三四五六七八九十]+\s*阶段/.test(s);
    }
    // 角色小传标题：1. 女主：苏晚 / 2. 男主：陆时衍 / 3. 女二：林薇薇（前期伪善反派）等
    // 返回 { role: 角色标签, name: 名字 }；否则 null
    function charHeader(t) {
      var m = (t || '').match(/^\s*\d+[\.、]\s*([^：:]{1,8})[：:]\s*(.+)$/);
      if (!m) return null;
      var label = m[1].trim(), name = m[2].trim();
      if (!label || !name) return null;
      var roleKw = ['女主', '男主', '女二', '男二', '女配', '男配', '主角', '反派', '配角', '人物', '少爷', '小姐', '公子', '同学', '老师', 'boss', '老板', '总裁', '闺蜜', '兄弟', '朋友', '母亲', '父亲', '女儿', '儿子', '室友', '队友'];
      if (roleKw.some(function (k) { return label.indexOf(k) >= 0; })) return { role: label, name: name };
      // 名字像人名（2-4 个汉字）也认作角色，标签当 role
      if (/^[一-龥]{2,4}$/.test(name)) return { role: label, name: name };
      return null;
    }

    // 识别元信息区标题
    function metaType(t) {
      if (/人物设定|角色设定|人设|人物介绍|角色介绍|角色小传|人物小传/.test(t)) return 'character';
      if (/场景设定|场景介绍|世界观|背景设定/.test(t)) return 'scene';
      if (/剧情梗概|故事梗概|大纲|分集大纲|故事线|伏笔|暗线/.test(t)) return 'beat';
      return null;
    }

    function isProfileLine(t) {
      // 人物小传常见写法：
      //   **凯恩（义体侦探）**：描述   —— 加粗名字 + 冒号
      //   凯恩（义体侦探）：描述       —— 名字（身份/角色）：描述（括号内须含人物信号词）
      //   女主：苏晚                   —— 冒号前的「标签」本身是角色词
      // 注意：本函数在「非角色设定区」才作为容错兜底；角色设定区已由 charHeader 精确处理。
      // 1) 加粗短名 + 冒号（名字 <=12 字，避免把 **章节**：误判）
      if (/^\*\*([^*]{1,12})\*\*[:：]/.test(t)) return true;
      // 2) 名字（身份/角色说明）：描述 —— 括号内须含人物/角色信号词，避免把「第一次小反转（第 7 集）：…」误判为人物
      var m2 = t.match(/^[^：:\n（）()]{1,10}[（(]([^）)\n]{1,16})[）)][：:]/);
      if (m2) {
        var roleSig = ['饰', '扮演', '身份', '角色', '女', '男', '哥', '姐', '爷', '少', '总', '生', '妈', '母', '爸', '父', '同学', '老师', '老板', '总裁', '闺蜜', '朋友', '同事', '配角', '主角', '反派'];
        if (roleSig.some(function (k) { return m2[1].indexOf(k) >= 0; })) return true;
        return false;
      }
      // 3) 名字：描述，且冒号前的「标签」本身就是角色词（女主/男主/男二/反派…），才认作人物；

      var m3 = t.match(/^[^：:\n]{1,10}[：:]/);
      if (m3) {
        var label = m3[0].replace(/[：:]/g, '').trim();

    // 纯文本元信息区标题（无 # 无 【】），整行就是"人物设定/角色设定/世界观"等短标签
    function plainMetaOpener(t) {

      if (s.length > 14) return null;

        if (isEpisodeHeading(headText) || level >= 3) {

        continue;
      }

      if (isEpisodeHeading(t) && !/^\*+/.test(t)) {
        metaSection = null; curChar = null;
        pushBlock('episode', t, { explicit: true });
        continue;
      }

      // 阶段标题 → section（结构说明，不要吸进正文）
      if (isStageHeading(t)) {
        metaSection = null; curChar = null;
        var stageText = t.replace(/^[#*_\s]+|[#*_\s]+$/g, '').trim();
        pushBlock('section', stageText, { meta: 'stage' });
        continue;
      }

      // 中文序号大标题（一、二、三、…）→ section；若标题语义属于某元信息区（如「二、核心人物设定」），同步开启该区
      if (isCnSection(t)) {
        metaSection = null; curChar = null;
        var cnStripped = t.replace(/^[一二三四五六七八九十百千零]+\s*[、.．）)]\s*/, '').trim();
        var cnMeta = metaType(cnStripped);
        if (cnMeta) metaSection = cnMeta;
        pushBlock('section', cnStripped, { meta: cnMeta || 'section' });
        continue;
      }

      var bracketMeta = t.match(/^[*_\s]*【(.+)】[*_\s]*$/);
      if (bracketMeta) {
        var mt2 = metaType(bracketMeta[1]);
        if (mt2) {
          metaSection = mt2; curChar = null;
          pushBlock('section', bracketMeta[1], { meta: mt2 });
          continue;
        }
      }

      // 纯文本元信息区标题（无 # 无 【】），例如整行就是"人物设定"
      if (!metaSection) {
        var pm = plainMetaOpener(t);
        if (pm) {
          metaSection = pm; curChar = null;
          pushBlock('section', t.replace(/^[#*_\s]+|[#*_\s]+$/g, '').trim(), { meta: pm });
          continue;
        }

      if (metaSection === 'character') {
        var ch = charHeader(t);
        if (ch) {
          var charBlock = pushBlock('profile', t, { meta: 'character', role: ch.role, name: ch.name, desc: '' });

        if (curChar) { // 同一人物的延续行（人设细分），并入 desc，避免生成虚假人物

          continue;
        }
        pushBlock('section', t, { meta: 'character' });
        continue;

        continue;
      }

      if (metaSection) {
        pushBlock(metaSection === 'character' ? 'profile' : 'section', t, { meta: metaSection });
        continue;
      }

      // 其余都是正文
      pushBlock('body', t);
    }

    return blocks;
  }

  // 新版 parseScript 已把结构化字段（role/name/desc）直接挂在 block 上，优先读取；
  // 旧版 / 外部传入纯文本时退回正则解析，保持兼容。

    var t = (typeof block === 'string') ? block : ((block && block.text) || '');

  var CHAR_BLACKLIST = /^(核心冲突|反转|主线|概述|简介|旁白|备注|主题|结构|设定说明|内容概要|剧情简介|人物关系|关系图|时间线|世界观设定|背景设定|创作背景|作者|目录|正文|序章|楔子|后记|番外|创作谈|写作计划)$/;

  var NAME_ACTION_PHRASES = ['大喊','大叫','大吼','大喝','喊道','说道','笑道','骂道','叫道','哭道','低声','轻声','高声','厉声','怒喝','冷笑','微笑','轻笑','狂笑','暗笑','嗤笑','转身','回头','看向','望向','看著','望著','走了','跑向','冲向','奔向','伸手','缩手','点头','摇头','摆手','挥手','叹气','心想','暗道','自语','低语','呢喃','颤声','问道','答道','回道','喊着','说着','笑着','哭着','听着','看着','想着','念着','立刻','缓缓','猛地','突然','顿时','于是','随后','接着','只见','却见','原来','此刻','这时','那是','只见'];

    if (NAME_GENERIC_ROLES.indexOf(nm) >= 0) return false;          // 泛化角色标签（主角/配角…）非人物

  function purifyCharacterList(chars) {

          keepShort.appearance = keepShort.appearance || dropLong.appearance || '';

  function _healthContexts(text, kw, max) {
    var out = [], i = 0, n = max || 3;
    while (out.length < n) {
      i = text.indexOf(kw, i);
      if (i < 0) break;
      var s = Math.max(0, i - 38), e = Math.min(text.length, i + kw.length + 38);
      var pre = text.slice(s, i).replace(/\r?\n/g, ' ');
      var post = text.slice(i + kw.length, e).replace(/\r?\n/g, ' ');
      out.push({ pre: (s > 0 ? '…' : '') + pre, hit: kw, post: post + (e < text.length ? '…' : '') });
      i += kw.length;
    }
    return out;
  }
  function _healthScan(text) {
    var hits = [];

    });
    return hits;
  }

        '<input class="bp-in" data-f="source" value="' + esc(x.source) + '" placeholder="原著第X章/情节">' +
        '<input class="bp-in" data-f="hook" value="' + esc(x.hook) + '" placeholder="结尾钩子（L3+）">' +
        '<input class="bp-in bp-grow" data-f="beats" value="' + esc(x.beats) + '" placeholder="开场钩/冲突/反转">' +
        '<button class="bp-del" data-del="episodeCuts" data-i="' + i + '">删</button></div>';
    }).join('');

    function block(title, inner, addBtn) {
      return '<div class="ref-block"><div class="ref-label">' + title + '</div>' + inner + (addBtn || '') + '</div>';
    }
    return '<div class="bp-wrap">' +
      '<div class="ref-block"><div class="ref-label">全剧一句话（改编后）</div>' +
        '<textarea class="bp-ta" id="bpLogline" rows="2">' + esc(bp.logline) + '</textarea></div>' +
      block('保留的故事线（3-5 条为宜）', keepRows, '<button class="ghost-btn bp-add" data-add="keepLines">+ 加一条线</button>') +
      block('砍掉的故事线', cutRows, '<button class="ghost-btn bp-add" data-add="cutLines">+ 加一条</button>') +
      block('人物合并', mergeRows, '<button class="ghost-btn bp-add" data-add="mergeChars">+ 加一组</button>') +
      block('分集切分点（' + (bp.episodeCuts || []).length + ' / 目标 ' + bp.targetEps + ' 集）', cutHead + cutEpRows, '<button class="ghost-btn bp-add" data-add="episodeCuts">+ 加一集</button>') +
      block('爽点重排（原著节奏 → 短剧节奏）', '<textarea class="bp-ta" id="bpRearrange" rows="3">' + esc(bp.rearrange) + '</textarea>') +
      block('忠实度声明（哪些忠于原著 / 哪些二创）', '<textarea class="bp-ta" id="bpFidelity" rows="3">' + esc(bp.fidelity) + '</textarea>') +
      '<div class="bp-foot">' +
        '<button class="ghost-btn" id="btnBpRegen"' + (p._bpBusy ? ' disabled' : '') + '>重新生成</button>' +
        '<span style="flex:1"></span>' +
        '<button class="primary-btn" id="btnBpConfirm">确认蓝图，进入分集大纲 →</button>' +
      '</div>' +
      (p._bpBusy ? '<div class="ref-note" id="bpProgress">' + (_en ? 'Re-reading the draft and re-planning…' : '正在重新通读、重排方案…') + '</div>' : '') +
      (p._bpErr ? '<div class="ref-note" style="color:#ff9b9b;">' + esc(p._bpErr) + '</div>' : '') +
    '</div>';
  }

  function wireBlueprint(p) {
    if (!p.blueprint) p.blueprint = _bpEmpty();
    var bp = p.blueprint;

    var gen = document.getElementById('btnBpGen');
    if (gen) gen.onclick = function () {
      var n = parseInt((document.getElementById('bpTargetEps') || {}).value, 10);
      bp.targetEps = (n > 1 ? Math.min(n, 120) : 30);
      runBlueprintGeneration(p);
    };

    // 编辑绑定：input/textarea 直接写回 p.blueprint 并 save
    document.querySelectorAll('.bp-wrap .bp-in').forEach(function (el) {
      var row = el.closest('.bp-row'); if (!row) return;
      var arr = row.getAttribute('data-arr'), i = parseInt(row.getAttribute('data-i'), 10), f = el.getAttribute('data-f');
      if (!(bp[arr] && bp[arr][i])) return;
      el.oninput = function () {
        var v = el.value;
        bp[arr][i][f] = (f === 'ep') ? (parseInt(v, 10) || 0) : v;
        save();
      };
    });
    [['bpLogline', 'logline'], ['bpRearrange', 'rearrange'], ['bpFidelity', 'fidelity']].forEach(function (pair) {
      var el = document.getElementById(pair[0]);
      if (el) el.oninput = function () { bp[pair[1]] = el.value; save(); };
    });
    document.querySelectorAll('.bp-del').forEach(function (b) {
      b.onclick = function () {
        var arr = b.getAttribute('data-del'), i = parseInt(b.getAttribute('data-i'), 10);
        if (bp[arr]) { bp[arr].splice(i, 1); save(); render(); }
      };
    });
    document.querySelectorAll('.bp-add').forEach(function (b) {
      b.onclick = function () {
        var arr = b.getAttribute('data-add');
        var seed = { keepLines: { name: '', desc: '', why: '' }, cutLines: { name: '', why: '' }, mergeChars: { from: '', into: '', why: '' }, episodeCuts: { ep: (bp.episodeCuts || []).length + 1, source: '', hook: '', beats: '' } };
        if (seed[arr]) { (bp[arr] = bp[arr] || []).push(JSON.parse(JSON.stringify(seed[arr]))); save(); render(); }
      };
    });

    var confirmBtn = document.getElementById('btnBpConfirm');
    if (confirmBtn) confirmBtn.onclick = function () {
      bp.confirmed = true; bp.ts = Date.now(); save();
      p.step = 3; save(); render();
    };
    var regen = document.getElementById('btnBpRegen');
    if (regen) regen.onclick = function () { runBlueprintGeneration(p); };
  }

  function runBlueprintGeneration(p) {
    if (p._bpBusy) return Promise.resolve(false);
    var _en = (window.SW_I18N && SW_I18N.getLang && SW_I18N.getLang() !== 'zh');
    var text = (p.script && p.script.raw || '').trim();
    if (!text) { MG.toast(_en ? 'Please go back to Import and paste your novel text' : '请先回「导入作品」粘贴小说正文', 3000); return Promise.resolve(false); }
    if (!p.blueprint || !p.blueprint.generated) p.blueprint = _bpEmpty();
    p.blueprint.targetEps = p.blueprint.targetEps || 30;
    p._bpBusy = true; p._bpErr = null; save();
    if (p.step === 9) renderStep(p);

    var targetEps = p.blueprint.targetEps;
    var totalChars = text.replace(/\s/g, '').length;

    // 阶段一：长稿分窗压缩成剧情摘要（复用故事中枢的分窗参数 14000/窗）
    function summarizeWindows() {
      if (totalChars <= 14000) return Promise.resolve([text]);
      var paras = (text || '').split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean);
      var windows = [], cur = [], curLen = 0;
      paras.forEach(function (s) {
        var l = s.replace(/\s/g, '').length;
        if (curLen > 0 && curLen + l > 14000) { windows.push(cur.join('\n')); cur = []; curLen = 0; }
        cur.push(s); curLen += l;
      });
      if (cur.length) windows.push(cur.join('\n'));
      var jobs = windows.map(function (w) {
        return MG.api('/api/llm', 'POST', { messages: [
          { role: 'system', content: _en
            ? 'You are a professional adaptation planner. Compress the novel excerpt below into a plot summary of no more than 400 words. You must keep: every character who appears and their relations, key events, turning points, and the progress of every storyline. Output only the summary itself, no explanations. Write the summary in English.'
            : '你是专业的剧本改编策划。把用户给的小说片段压缩成 400 字以内的剧情摘要。必须保留：出现的所有人物及关系、关键事件、转折点、每条故事线的进展。只输出摘要正文，不要任何解释。' },
          { role: 'user', content: w }
        ] }).then(function (r) { return (r && r.ok && r.text) ? r.text : ''; }).catch(function () { return ''; });
      });
      // 限量并发（每批 3 个）：窗口多时全量并发会互抢免费池触发 429 轮转，反而更慢
      function runBatches(list, size) {
        var out = [];
        return list.reduce(function (chain, _, bi) {
          return chain.then(function () {
            var batch = list.slice(bi * size, bi * size + size);
            if (!batch.length) return;
            return Promise.all(batch).then(function (rs) { out = out.concat(rs); });
          });
        }, Promise.resolve()).then(function () { return out; });
      }
      return runBatches(jobs, 3).then(function (parts) {
        var ok = parts.filter(Boolean);
        if (!ok.length) throw new Error(_en ? 'All read-through segments failed' : '通读分段全部失败');
        return ok;
      });
    }

    return summarizeWindows().then(function (mats) {
      var material = mats.join('\n\n【下一段】\n\n');
      // 上限 30000（2026-10-16 由 60000 降）：蓝图是重活，输入越大输出越慢，
      // 6 万字输入曾把免费池打穿（5 模型连超时、总耗时 353s、nginx 504）。
      // 摘要已压缩过剧情主干，3 万字足够支撑切分决策。
      if (material.length > 30000) material = material.slice(0, 30000);
      var sys = '你是 Storywright 的改编合伙人，任务是输出一份把小说改编成竖屏短剧的「改编蓝图」，只输出一个 JSON 对象，不要解释、不要 markdown 代码块。字段：\n' +
        '{"logline":"改编后全剧一句话","keepLines":[{"name":"线名","desc":"这条线讲什么","why":"为什么保留（爽点/主题/钩子价值）"}],"cutLines":[{"name":"砍掉的线","why":"为什么砍（拖节奏/难视觉化/成本），并说明该线承担的功能由哪条保留线接管"}],"mergeChars":[{"from":"原人物A","into":"并入人物B","why":"合并理由"}],"episodeCuts":[{"ep":1,"source":"对应原著第X章/某情节","hook":"本集结尾钩子，必须达到 L3 强度（选择钩/认知颠覆/情感卷入），写明画面与类型","beats":"本集三拍：开场钩/冲突发展/反转"}],"rearrange":"爽点重排说明：原著的节奏是怎么样的，改成短剧后打脸/反转/钩子的密度怎么调","fidelity":"忠实度声明：哪些忠于原著，哪些是二创及为什么"}\n' +
        '硬性要求：episodeCuts 必须正好 ' + targetEps + ' 条且 ep 从 1 连续编号；每集钩子不低于 L3；第 1 集与中点集钩子达到 L4/L5；keepLines 3-5 条；cutLines 每条必须说明功能去向；' + (_en ? 'write every value in English.\n' : '全部中文。\n') +
        '输出体量控制：hook 每条不超过 60 字（写画面+类型，不展开）；beats 每条一句话；keepLines/cutLines 的 desc/why 各不超过 40 字。整份 JSON 控制在 3500 字以内，宁可精炼不要铺陈。';
      var usr = '【目标集数】' + targetEps + ' 集（单集 1-2 分钟竖屏短剧）\n【全稿字数】约 ' + totalChars + ' 字\n【作品全文' + (mats.length > 1 ? '分段摘要' : '') + '】\n' + material;
      return MG.api('/api/llm', 'POST', { messages: [
        { role: 'system', content: sys },
        { role: 'user', content: usr }
      ] }, 300000);
    }).then(function (r) {
      p._bpBusy = false;
      var t = r && r.ok && r.text;
      if (!t) {
        if (r && r.noKey) throw new Error(_en
          ? 'No LLM key configured yet. Add your API key in Settings (top-right avatar menu), then try again.'
          : '未配置引擎 Key。请到右上角头像 → 设置里补上密钥再试。');
        throw new Error((r && r.err) || (_en ? 'Blueprint generation returned nothing' : '蓝图生成没返回内容'));
      }
      var m = t.match(/\{[\s\S]*\}/);
      if (!m) throw new Error(_en ? 'Could not parse the blueprint format' : '蓝图返回格式没读懂');
      var j = JSON.parse(m[0]);
      var bp = p.blueprint;
      bp.generated = true; bp.ts = Date.now();
      bp.logline = j.logline || '';
      bp.keepLines = Array.isArray(j.keepLines) ? j.keepLines : [];
      bp.cutLines = Array.isArray(j.cutLines) ? j.cutLines : [];
      bp.mergeChars = Array.isArray(j.mergeChars) ? j.mergeChars : [];
      bp.episodeCuts = Array.isArray(j.episodeCuts) ? j.episodeCuts : [];
      bp.rearrange = j.rearrange || '';
      bp.fidelity = j.fidelity || '';
      bp.confirmed = false;
      save();
      if (p.step === 9) renderStep(p);
      if (MG.toast) MG.toast('改编蓝图已生成，逐项检查并修改吧');
    }).catch(function (e) {
      p._bpBusy = false;
      p._bpErr = (_en ? 'Blueprint generation failed: ' : '蓝图生成失败：') + (e && e.message ? e.message : (_en ? 'unknown error' : '未知错误'));
      save();
      if (p.step === 9) renderStep(p);
    });
  }

  function renderImport(p) {
    var writePanel =
      '<div class="im-panel' + (gImportTab === 'write' ? ' show' : '') + '" data-panel="write">' +
        '<textarea class="import-area" id="importArea" placeholder="在此粘贴剧本全文…（支持小说 / 剧本 / 散文 / 口述记录）"></textarea>' +
        '<div class="import-bar">' +
          '<label class="file-label"><input type="file" id="fileInput" accept=".txt,.md" style="display:none;">上传 .txt / .md</label>' +
          '<span class="stat-pill">字数 <b id="charCount">0</b></span>' +
          '<span class="stat-pill">段落 <b id="paraCount">0</b></span>' +
          '<span style="flex:1"></span>' +
          '<button class="ghost-btn" id="btnPresetFloat">创作范式 / 模版 ▾</button>' +

          '<button class="primary-btn" id="btnNext">' + (p.centralReady || p.centralMode ? '进入故事中枢 →' : '创建故事中枢 →') + '</button>' +

        (p.skill && p.skill.styleLocked ?
          '<div class="ref-block skill-ai-block">' +
            '<div class="ref-label">我按这套技能的写法起草</div>' +
            '<div class="ref-row">' +
              '<button class="ref-btn skill-ai-btn" id="btnAiExpand">AI 帮我扩写到 N 集 →' + _mjChargeSuffix('expand', 0) + '</button>' +
            '</div>' +
            '<div class="ref-note" id="aiExpandNote">基于「' + esc(p.skill.name) + '」的风格与节奏，把你的大纲或梗概扩写成带分集标题的完整草稿。先在上方写好大纲，或留空由技能起底。</div>' +

    var tplPanel = '';
    var skillPanel = '';


    return '<div class="legal-warn">合规提醒：本平台严禁上传任何违反中华人民共和国法律法规的内容（包括但不限于色情、暴力、恐怖、毒品、赌博、诈骗及危害国家安全等信息）。系统会对上传内容进行自动审核，违规内容将被屏蔽且无法保存。</div>' +
      '<div class="import-mode">' +
        '<div class="im-head"><span class="im-title">导入作品 · 创作起点</span><span class="im-sub">粘贴或上传你的作品，这是内容的唯一入口。想套用「范式」（过亿模版 / 官方技能）点右侧「创作范式 / 模版」，它会作用于你已写的内容，而不是另起炉灶。</span></div>' +
        renderApplyBanner(p) +
        writePanel +
      '</div>';
