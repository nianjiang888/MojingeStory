  // P1-1 一键全自动巡航：导入后一键跑完 故事中枢→分集→逐集改编→生成分镜（不含出图/出片）
  var CRUISE_PRICE = { re_split: 0.10, to_script: 0.10, gen_shots: 0.05 };  // 与后端 /api/price_info 对齐；故事中枢首次免费
  var _cruiseCancel = false;

  function cruiseOverlay() {
    var el = document.getElementById('cruiseOverlay');
    if (!el) {
      el = document.createElement('div');
      el.id = 'cruiseOverlay';
      el.innerHTML = '<div class="crz-box">' +
        '<div class="crz-title">一键巡航进行中</div>' +
        '<div class="crz-stage" id="crzStage">准备中…</div>' +
        '<div class="crz-bar"><div class="crz-bar-fill" id="crzFill"></div></div>' +
        '<div class="crz-log" id="crzLog"></div>' +
        '<button class="ghost-btn" id="crzCancel">取消巡航</button>' +
        '</div>';
      document.body.appendChild(el);
      document.getElementById('crzCancel').onclick = function () { _cruiseCancel = true; cruiseLog('已请求取消，当前步骤完成后停止…'); };
    }
    return el;
  }
  function cruiseSet(stage, pct) {
    var o = cruiseOverlay(); o.style.display = 'flex';
    var s = document.getElementById('crzStage'); if (s) s.textContent = stage;
    var f = document.getElementById('crzFill'); if (f && pct != null) f.style.width = Math.max(0, Math.min(100, pct)) + '%';
  }
  function cruiseLog(msg) {
    var l = document.getElementById('crzLog'); if (l) { var d = document.createElement('div'); d.textContent = '· ' + (window.SW_I18N ? SW_I18N.t(msg) : msg); l.appendChild(d); l.scrollTop = l.scrollHeight; }
  }
  function cruiseEnd() { var o = document.getElementById('cruiseOverlay'); if (o) o.style.display = 'none'; }

  function cruiseWaitUntil(cond, timeoutMs, label) {
    var _en = (window.SW_I18N && SW_I18N.getLang && SW_I18N.getLang() !== 'zh');
    return new Promise(function (resolve, reject) {
      var start = Date.now();
      var iv = setInterval(function () {
        if (_cruiseCancel) { clearInterval(iv); reject(new Error(_en ? 'Cancelled by user' : '用户取消')); return; }
        var ok = false; try { ok = cond(); } catch (e) {}
        if (ok) { clearInterval(iv); resolve(true); return; }
        if (Date.now() - start > timeoutMs) { clearInterval(iv); reject(new Error(label || (_en ? 'Timed out' : '超时'))); }
      }, 600);
    });
  }

  async function runCruise(p) {
    _cruiseCancel = false;
    var crzLog = document.getElementById('crzLog'); if (crzLog) crzLog.innerHTML = '';
    if (!p.script || !p.script.charCount) { MG.toast('请先在步骤①粘贴或上传作品', 3000); return; }
    var charCount = p.script.charCount || 0;
    var epCount = (p.episodes && p.episodes.length) ? p.episodes.length : Math.max(1, Math.round(charCount / 540));
    var est = ((p.episodes && p.episodes.length) ? 0 : CRUISE_PRICE.re_split) + (CRUISE_PRICE.to_script + CRUISE_PRICE.gen_shots) * epCount;
    var go = await MG.confirm('一键巡航，我连着往下跑：创建故事中枢 → 改编蓝图 → 分集 → 逐集改编剧本 → 生成分镜脚本（不出图、不出片）。\n预计消耗约 ¥' + est.toFixed(2) + '（按 ' + epCount + ' 集估算，每日额度护栏照常）。是否开始？');
    if (!go) return;
    cruiseSet('阶段 1/5 · 创建故事中枢', 5);
    try {
      if (!p.centralReady) {
        cruiseLog('我在通读全作，把故事中枢建起来（人物/场景/大纲/伏笔）…');
        await runCentralGeneration(p);            // 返回 Promise，可直接 await
        cruiseLog('故事中枢建好了');
      } else { cruiseLog('故事中枢已就绪，跳过'); }

      cruiseSet('阶段 2/5 · 改编蓝图', 16);
      if (!p.blueprint || !p.blueprint.generated) {
        cruiseLog('我在设计改编方案：保留线 / 砍线 / 人物合并 / 分集切分点…');
        if (!p.blueprint) p.blueprint = _bpEmpty();
        p.blueprint.targetEps = p.blueprint.targetEps || (p.episodes && p.episodes.length) || epCount || 30;
        await runBlueprintGeneration(p);
        if (p.blueprint && p.blueprint.generated) cruiseLog('改编蓝图出了（共 ' + (p.blueprint.episodeCuts || []).length + ' 集切分点，可回主线修改确认）');
        else cruiseLog('改编蓝图没跑成，先跳过，不挡后面流程');
      } else { cruiseLog('改编蓝图已存在，跳过'); }

      cruiseSet('阶段 3/5 · 分集大纲', 26);
      if (!p.episodes || !p.episodes.length) {
        if (!p.segConfig) p.segConfig = { seconds: 90, charsPerSec: 6, mode: 'auto' };
        var fbSeg = { disabled: false, textContent: '' };
        runSegment(p, fbSeg);                    // 非 await（内部 .then），靠轮询判定完成
        await cruiseWaitUntil(function () { return (p.episodes && p.episodes.length > 0) && p.segStage === 'config'; }, 180000, '分集超时');
        cruiseLog('切出 ' + p.episodes.length + ' 集了');
      } else { cruiseLog('已有 ' + p.episodes.length + ' 集，跳过重新分集'); }

      var n = p.episodes.length;
      for (var i = 0; i < n; i++) {
        if (_cruiseCancel) break;
        p.curEp = i; save();
        var ep = p.episodes[i];
        if (!ep.rewriteMode) {
          cruiseSet('阶段 4/5 · 改编第 ' + (i + 1) + '/' + n + ' 集', 26 + Math.round(44 * i / n));
          cruiseLog('改编第 ' + (i + 1) + ' 集《' + (ep.title || '') + '》…');
          var fb1 = { disabled: false, textContent: '' };
          runRewriteEpisode(p, i, fb1, '转剧本');
          await cruiseWaitUntil(function () { return ep.rewriteMode === 'llm' || ep.rewriteMode === 'rule'; }, 180000, '第' + (i + 1) + '集改编超时');
        }
        if (_cruiseCancel) break;
        if (!p.shots[ep.id] || !p.shots[ep.id].length) {
          cruiseSet('阶段 5/5 · 生成分镜 第 ' + (i + 1) + '/' + n + ' 集', 26 + Math.round(44 * (i + 0.5) / n));
          cruiseLog('生成第 ' + (i + 1) + ' 集分镜…');
          var fb2 = { disabled: false, textContent: '' };
          runGenShots(p, fb2);
          await cruiseWaitUntil(function () { return (p.shots[ep.id] || []).length > 0; }, 360000, '第' + (i + 1) + '集分镜超时');
          cruiseLog('第 ' + (i + 1) + ' 集分镜 ' + ((p.shots[ep.id] || []).length) + ' 镜');
        }
      }
      cruiseSet('巡航完成', 100);
      cruiseLog('全部步骤完成 ✓');
      MG.toast('一键巡航完成：已生成 ' + n + ' 集剧本 + 分镜，可在步骤⑤查看', 4200);
      setTimeout(cruiseEnd, 1600);
      p.step = 5; save(); renderStep(p);
    } catch (e) {
      cruiseEnd();
      var msg = (e && e.message) ? e.message : ('' + e);
      if (msg.indexOf('取消') >= 0) MG.toast('已取消巡航，已完成部分已保存', 3500);
      else { MG.toast('巡航中断：' + msg + '（已完成部分已保存）', 6000); }
    }
  }

  function renderParseInfo(p) {
    var el = document.getElementById('parseInfo');
    if (!el) return;
    var m = scriptMetaSummary(p);
    if (!m.bodies && !m.title && !m.profiles && !m.episodes) {
      el.innerHTML = '';
      return;
    }
    var html = '';
    if (m.title) html += '<span class="pi-tag">剧名：<b>' + esc(m.title) + '</b></span>';
    if (m.profiles) {
      // 列出识别到的人物名字，让用户导入后第一眼确认系统认对了
      var names = [];
      (p.script.blocks || []).forEach(function (b) {
        if (b.type === 'profile' && b.meta === 'character' && b.name && names.indexOf(b.name) < 0) names.push(b.name);
      });
      html += '<span class="pi-tag">人物设定 <b>' + m.profiles + '</b> 位' +
        (names.length ? '：' + esc(names.join('、')) : '') + '</span>';
    }
    if (m.episodes) html += '<span class="pi-tag warn">已识别分集标题 <b>' + m.episodes + '</b> 个（将沿用）</span>';
    html += '<span class="pi-tag">正文段落 <b>' + m.bodies + '</b> 段</span>';
    el.innerHTML = html;
  }

  function wireImport(p) {
    var area = document.getElementById('importArea');
    if (area) {
      area.value = p.script.raw || '';
      function refresh() {
        var raw = area.value;
        p.script.raw = raw;
        p.script.paragraphs = splitParagraphs(raw);
        p.script.blocks = parseScript(raw);
        applyProfilesToBible(p);
        p.script.charCount = raw.replace(/\s/g, '').length;
        p.script.paraCount = p.script.paragraphs.length;
        p.updatedAt = Date.now();
        document.getElementById('charCount').textContent = p.script.charCount;
        document.getElementById('paraCount').textContent = p.script.paraCount;
        document.getElementById('btnNext').disabled = p.script.charCount === 0;
        var cc = document.getElementById('btnCruise'); if (cc) cc.disabled = p.script.charCount === 0;
        renderParseInfo(p);
        scheduleSave();
        // #749：导入后若能从正文本读取真实剧名，且当前项目名是占位（数字/草稿/自动命名），则自动改名
        if (p._autoNamed || /^\d+$/.test(p.name) || /^草稿\d*$/.test(p.name)) {
          var meta = scriptMetaSummary(p);
          if (meta.title && meta.title !== p.name) autoRenameProject(p, meta.title);
        }
      }
      area.addEventListener('input', refresh);
      refresh();

      document.getElementById('fileInput').addEventListener('change', function (e) {
        var f = e.target.files[0];
        if (!f) return;
        var rd = new FileReader();
        rd.onload = function () { area.value = rd.result; refresh(); };
        rd.readAsText(f, 'utf-8');
      });
      document.getElementById('btnClear').onclick = function () {
        MG.confirm('确认清空当前剧本文本？').then(function (ok) {
          if (!ok) return;
          area.value = ''; refresh();
        });
      };
      document.getElementById('btnNext').onclick = function () {
        if (p.script.charCount === 0) return;
        openContentHealthPanel(p); // #646：命中则弹 AI 内容体检面板引导改写/保留；无命中直接放行
      };
      var cb = document.getElementById('btnCruise');
      if (cb) cb.onclick = function () { runCruise(p); };
    }

    // 过亿结构模版按钮（内容档）：填骨架起稿（空白/当前即模板时覆盖），或仅设置结构参考（已有自己的剧本时不覆盖文本）；再次点已选中的按钮则取消
    Array.prototype.forEach.call(document.querySelectorAll('.ref-btn'), function (el) {
      el.onclick = function () {
        var key = el.getAttribute('data-ref');
        var t = STRUCTURE_TEMPLATES[key];
        if (!t) return;
        // 再次点击已选中的按钮 = 取消选择（不是必须选一个）
        if (p.structureRef === key) {
          p.structureRef = '';
          save();
          renderStep(p);
          return;
        }
        var a = document.getElementById('importArea');
        var cur = a ? a.value : '';
        var isTemplate = Object.keys(STRUCTURE_TEMPLATES).some(function (kk) {
          return STRUCTURE_TEMPLATES[kk].skeleton === cur;
        });
        p.structureRef = key;
        if (!cur.trim() || isTemplate) {
          // 把过亿结构骨架写入脚本正文（无论当前是否在「自己写」标签），随后切回该标签展示
          p.script.raw = t.skeleton;
          p.script.paragraphs = splitParagraphs(t.skeleton);
          p.script.blocks = parseScript(t.skeleton);
          applyProfilesToBible(p);
          p.script.charCount = t.skeleton.replace(/\s/g, '').length;
          p.script.paraCount = p.script.paragraphs.length;
          gImportTab = 'write';
          save();
          renderStep(p);
        } else {
          // 已有用户自己的剧本：只记录结构参考并提示，不覆盖文本；下游分集/分镜会遵循该节奏
          save();
          renderStep(p);
        }
      };
    });

    // #435 技能专属「AI 帮我扩写到 N 集」：复用平台理解引擎（DeepSeek）将大纲/梗概扩写为带分集标题的完整草稿
    var btnAi = document.getElementById('btnAiExpand');
    if (btnAi) btnAi.onclick = function () { aiExpandScript(p, btnAi); };

    // P0⑤ 创作范式浮窗入口：导入为内容唯一入口，范式作用于已导入内容
    var btnFloat = document.getElementById('btnPresetFloat');
    if (btnFloat) btnFloat.onclick = function () { openPresetFloat(p); };
    // #442 官方技能范式卡片：套用到当前项目（不再前置建项目）
    Array.prototype.forEach.call(document.querySelectorAll('.preset-card'), function (el) {
      el.onclick = function (ev) {
        if (ev.target && ev.target.classList && ev.target.classList.contains('pc-use')) return; // 让按钮自己处理
        applyPresetToCurrent(p, el.getAttribute('data-pid'));
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('.preset-card .pc-use'), function (el) {
      el.onclick = function (ev) { ev.stopPropagation(); applyPresetToCurrent(p, el.getAttribute('data-pid')); };
    });
  }

  // #435 构建扩写提示词：套用技能的风格 / 节奏 / 角色蓝图，产出带「第N集」标题的多集草稿
  function aiExpandMessages(p, skill, cur, n) {
    var styleName = skill.styleName || skill.style || '通用';
    var rhythm = skill.rhythm || {};
    var chars = (skill.charBlueprint || []).map(function (b) {
      return b.role + (b.voice ? '（推荐音色：' + b.voice + '）' : '');
    }).join('、');
    var sys = '你是资深短剧编剧。请基于给定技能的风格与节奏，产出一份结构完整、可直接用于分集的多集剧本草稿。\n' +
      '【技能风格】' + styleName + '\n' +
      (rhythm.epLen ? ('【节奏基准】每集约 ' + rhythm.epLen + ' 秒，约 ' + (rhythm.shots || '—') + ' 镜，对白密度：' + (rhythm.dialogue || '—') + '\n') : '') +
      (chars ? ('【核心人物（需保留并贯穿全剧）】' + chars + '\n') : '') +
      '【格式要求】\n' +
      '1. 开头用一行书名号写剧名，如 《剧名》。\n' +
      '2. 接着写「人物设定」段，列出核心人物的姓名与一句话设定。\n' +
      '3. 之后严格按「第1集 标题」「第2集 标题」…「第' + n + '集 标题」分集，每集 2-4 段正文，推进剧情、埋设冲突与转折。\n' +
      '4. 必须共 ' + n + ' 集，每集都带「第X集」标题（X 为阿拉伯数字）。\n' +
      '5. 文风贴合技能风格，不要加入与风格严重违和的设定。只输出剧本正文，不要解释、不要代码块围栏。';
    var user = cur
      ? ('以下是用户已有的大纲 / 梗概，请在其基础上扩写、补全为 ' + n + ' 集完整草稿（保留已有的人物与剧情走向，不要另起炉灶）：\n\n' + cur)
      : ('请直接起草一份 ' + n + ' 集的完整短剧草稿（基于上述风格与节奏，自行设计人物与剧情）。');
    return [
      { role: 'system', content: sys },
      { role: 'user', content: user }
    ];
  }

  function aiExpandScript(p, btn) {
    var skill = p.skill;
    if (!(skill && skill.styleLocked)) return;
    var area = document.getElementById('importArea');
    if (!area) return;
    var cur = (area.value || '').trim();
    var meta = scriptMetaSummary(p);
    var defN = (meta && meta.episodes) ? meta.episodes : (skill.rhythm && skill.rhythm.epLen ? 6 : 6);
    MG.prompt('要扩写到几集？（默认 ' + defN + ' 集，建议 6-24）', String(defN)).then(async function (nStr) {
      if (nStr === null) return;
      var n = parseInt(nStr, 10);
      if (!n || n < 1 || n > 60) { alert('集数需在 1-60 之间'); return; }
      var ch = await ensureCharge('expand', 0);
      if (!ch) return;
      btn.disabled = true; btn.textContent = 'AI 扩写中…';
    MG.api('/api/llm', 'POST', { messages: aiExpandMessages(p, skill, cur, n) }).then(function (r) {
      btn.disabled = false; btn.textContent = 'AI 帮我扩写到 N 集 →';
      if (r && r.noKey) {
        refundLastCharge();
        alert('我这边还没接上写作通道（缺少密钥），扩写不了。你可以在设置里补上密钥，或者直接在上面的文本框里自己写草稿。');
        return;
      }
      if (!(r && r.ok && r.text)) {
        refundLastCharge();
        alert('AI 扩写未返回有效内容，请稍后重试，或在上方文本框手动撰写。');
        return;
      }
      var draft = (r.text || '').trim().replace(/^```[a-zA-Z]*\n?/, '').replace(/```\s*$/, '').trim();
      area.value = draft;
      area.dispatchEvent(new Event('input')); // 触发 wireImport 的 refresh，同步字数/分集标题识别
      renderStep(p);                          // 重渲染以刷新解析信息与提示
      alert('已生成 ' + n + ' 集草稿并写回上方文本框。你可以直接改稿，然后「创建故事中枢」。');
    }).catch(function () {
      btn.disabled = false; btn.textContent = 'AI 帮我扩写到 N 集 →';
      refundLastCharge();
      alert('AI 扩写请求失败，请检查网络或稍后重试。');
    });
    });
  }

  /* ---------- 步骤③ 梳理分集大纲 ---------- */
  var SEG_PRESETS = [90, 180, 300];

  function renderSeg(p) {
    var en = (window.SW_I18N && SW_I18N.getLang() === 'en');
    if (!p.script.charCount) {
      return '<div class="need-prev">还没有剧本文本。<a id="goImport">← 先回到步骤①导入作品</a></div>';
    }
    // 自动通读全作生成故事地图（缺失或正文已变时），作为「集规划」依据
    if ((!p.storyMap || p.storyMap._charCount !== p.script.charCount) && !p.storyMapBuilding) {
      p.storyMapBuilding = true; save();
      setTimeout(function () {
        buildStoryMap(p).then(function () {
          p.storyMapBuilding = false;
          if (p.step === 3 && p.segStage !== 'plan') renderStep(p);
        });
      }, 0);
    }
    var cfg = p.segConfig;
    var tabs = '<div class="seg-tabs">';
    SEG_PRESETS.forEach(function (sec) {
      var active = (cfg.seconds === sec && !cfg.custom) ? ' active' : '';
      tabs += '<button class="seg-tab' + active + '" data-sec="' + sec + '">' + sec + ' 秒<small>' + (en
        ? ('≈' + (sec * cfg.charsPerSec) + ' chars · ' + Math.min(MAX_SHOTS_PER_EP, Math.max(1, Math.floor(sec / curShotDur()))) + ' shots')
        : ('约 ' + (sec * cfg.charsPerSec) + ' 字 · ' + Math.min(MAX_SHOTS_PER_EP, Math.max(1, Math.floor(sec / curShotDur()))) + ' 镜')) + '</small></button>';
    });
    var customActive = cfg.custom ? ' active' : '';
    tabs += '<button class="seg-tab' + customActive + '" data-sec="custom">自定义<small>自定每集秒数</small></button>';
    tabs += '</div>';

    var customRow = '<div class="custom-sec">自定义每集秒数：<input type="number" id="customSec" min="20" max="600" step="10" value="' + (cfg.custom ? cfg.seconds : 120) + '">' + (en
      ? (' s (≈' + cfg.charsPerSec + ' chars/s; max ' + MAX_SHOTS_PER_EP + ' shots per episode)')
      : (' 秒（按 ' + cfg.charsPerSec + ' 字/秒估算字数，单集封顶 ' + MAX_SHOTS_PER_EP + ' 镜）')) + '<span id="customSecHint" class="seg-custom-hint"></span></div>';

    var meta = scriptMetaSummary(p);
    var headingNote = (meta.episodes && !p.episodes.length)
      ? '<div class="hint" style="margin-bottom:4px;color:#F5A623;">' + (en
          ? ('Detected <b>' + meta.episodes + '</b> existing "Episode X / Chapter" titles — they will act as <b>chapter boundaries</b>; inside each chapter, scenes are packed into episodes by scene header and target length (episode length set by the seconds tabs above).')
          : ('检测到 <b>' + meta.episodes + '</b> 个已有「第X集/章」标题，将作为<b>章节边界</b>，章内再按场景标头与目标时长打包成片集（每集时长由上方秒数档位决定）。')) + '</div>'
      : '';

    var runRow = '<div class="run-row">' +
      '<button class="primary-btn" id="btnSeg">' + (p.episodes.length ? '重新分集' : '开始分集') + _mjChargeSuffix('re_split', 0) + '</button>' +
      (p.episodes.length ? ' <button class="primary-btn" id="btnEnterEp">进入第 1 集改编剧本 →</button>' : '') +
      '<span class="mode-note" id="segMode">' + segModeText(p) + '</span>' +
      '</div>';

    var listHtml = '';
    var sumHtml = '';
    var warnHtml = '';
    if (p.episodes.length) {
      var totSec = p.episodes.reduce(function (a, e) { return a + (e.seconds || 0); }, 0);
      var totEffSec = p.episodes.reduce(function (a, e) { return a + (e.effectiveSeconds || 0); }, 0);
      var totChars = p.episodes.reduce(function (a, e) { return a + (e.chars || 0); }, 0);
      var totShots = p.episodes.reduce(function (a, e) { return a + (e.shotBudget || 0); }, 0);
      var totNeed = p.episodes.reduce(function (a, e) { return a + (e.needChars || 0); }, 0);
      sumHtml = '<div class="seg-summary">本剧共 <b>' + p.episodes.length + '</b> 集' +
        '<span class="sep"></span>目标总时长 <b>' + totSec + '</b> 秒' +
        '<span class="sep"></span>有效时长 <b>' + totEffSec + '</b> 秒' +
        '<span class="sep"></span>原文字数 <b>' + totChars + '</b>' +
        '<span class="sep"></span>镜头预算合计 <b>' + totShots + '</b></div>';
      if (totNeed > 0) {
        warnHtml = '<div class="seg-warning">⚠ 当前文本量按 ' + cfg.charsPerSec + ' 字/秒估算约够 ' + totEffSec + ' 秒，但 90 秒短剧的关键不是凑字数，而是「钩子/冲突/转折/卡点」四节拍。建议进入「改编剧本」逐集点「✨ 转剧本」做创意压缩，不要硬补字数。</div>';
      }
      // 百集剧不再全量平铺集卡片：左侧集列表 + 右侧当前集详情（主战场导航）
      var segSel = (typeof p._segSel === 'number' && p._segSel >= 0 && p._segSel < p.episodes.length) ? p._segSel : 0;
      p._segSel = segSel;
      var segNavItems = p.episodes.map(function (ep, i) {
        var active = (i === segSel) ? ' active' : '';
        return '<div class="md-nav-item' + active + '" data-seg="' + i + '">' + esc((i + 1) + '. ' + (ep.title || ('第 ' + (i + 1) + ' 集'))) + '</div>';
      }).join('');
      listHtml = '<div class="md-shell seg-shell">' +
        '<aside class="md-nav"><div class="md-search"><input id="segSearch" placeholder="搜索集标题…"></div>' + segNavItems + '</aside>' +
        '<section class="md-detail" id="segDetail">' + epCardHtml(p.episodes[segSel], segSel) + '</section>' +
      '</div>';
    } else {
      listHtml = '<div class="hint" style="margin-top:18px;">还没分集。点「开始分集」，我先认剧名、人物设定和你已有的分集标题，再按剧情切；文档自带「第X集」会直接按标题切，没有的话按你设的集数、或由我按剧情切。切完进「改编剧本」，逐集点「✨ 转剧本」，我把小说段落压成 90 秒短剧的四节拍（钩子/冲突/转折/卡点），不保留原文描写。</div>';
    }

    var detectNote = '文档结构优先：已生成故事中枢大纲则沿用其边界；否则识别章/集标题与章内场景标头（如「古代·秋云集·午后」「当天晚上」），把场景按你设定的<b>目标时长</b>打包成片集。章边界为硬断，场景短则合并、长则按句切，绝不删戏。';
    var srcRow = '<div class="src-tabs"><span class="src-label">分集方式：</span><b>按文档结构分集</b>' +
      '</div><div class="hint" style="margin:6px 0 2px;color:#2DD4A8;">' + detectNote + '（每集时长由上方秒数档位决定，可选 20~1800 秒）</div>';
    var countRow = '';

    var centralBanner = '<div class="central-banner" id="centralStatus">' + centralStatusText(p) + '</div>';
    var rhythmHint = '';
    if (p.skill && p.skill.rhythm) {
      var rh = p.skill.rhythm;
      rhythmHint = '<div class="hint skill-rhythm-hint">技能节奏建议：每集约 <b>' + (rh.epLen || '—') + 's</b> · 约 <b>' + (rh.shots || '—') + ' 镜</b> · 对白密度 <b>' + (rh.dialogue || '—') + '</b>。可在上方选秒数档，分镜按「秒数 ÷ 镜头时长档」给镜头预算（档位在步骤⑤切换，当前 ' + curShotDur(p) + ' 秒/镜）。</div>';
    }
    var mapHtml = storyMapHtml(p);
    return '<div class="seg-config">' + centralBanner + rhythmHint + mapHtml + tabs + customRow + srcRow + countRow + headingNote + runRow + sumHtml + warnHtml + listHtml + '</div>';
  }

  var SEG_MODE_EN = {
    '智能切集': 'Smart split', '按文档分集标题切分': 'By document headings',
    '按故事中枢大纲切分': 'By Story Bible outline', '我按剧情切的': 'By plot',
    '按字数规则切的（兜底）': 'By word count (fallback)',
    '按文档结构（章内拆场景·按时长打包）': 'By document structure (scenes packed by length)',
    '按故事地图内容规划切分': 'By story map plan'
  };
  function segModeText(p) {
    var en = (window.SW_I18N && SW_I18N.getLang() === 'en');
    var base = '智能切集';
    if (p.segMode === 'heading') base = '按文档分集标题切分';
    else if (p.segMode === 'custom') base = en ? ('Forced ' + (p.segConfig.segCount || 0) + ' episodes') : ('强制 ' + (p.segConfig.segCount || 0) + ' 集切分');
    else if (p.segMode === 'outline') base = '按故事中枢大纲切分';
    else if (p.segMode === 'llm') base = '我按剧情切的';
    else if (p.segMode === 'rule') base = '按字数规则切的（兜底）';
    else if (p.segMode === 'doc') base = '按文档结构（章内拆场景·按时长打包）';
    else if (p.segMode === 'storyPlan') base = '按故事地图内容规划切分';
    var b = en ? (SEG_MODE_EN[base] || base) : base;
    return en
      ? ('Mode: ' + b + ' · episodes split, with length and character estimates')
      : ('模式：' + base + ' · 每集已切分并估算时长与字数');
  }
  function shotModeText(ep) {
    if (ep.shotMode === 'llm') return '来源：我按本集剧本拆的';
    if (ep.shotMode === 'rule') return '来源：规则切分（按句）';
    return '尚未生成分镜';
  }

  function rewriteModeText(mode) {
    if (mode === 'llm') return '来源：AI 改写';
    if (mode === 'manual') return '来源：手动';
    return '来源：原文（待改编）';
  }

  function epCardHtml(ep, i) {
    var en = (window.SW_I18N && SW_I18N.getLang() === 'en');
    var warn = '';
    if ((ep.needChars || 0) > 0) {
      warn = '<div class="ep-warning">' + (en
        ? ('Current content supports about ' + (ep.effectiveSeconds || 0) + 's, but a 90-second short needs all four beats (hook / conflict / turn / cliffhanger). Go to the script step and hit "✨ To script" to compress the passage into shootable beats instead of padding word count.')
        : ('当前内容约可支撑 ' + (ep.effectiveSeconds || 0) + ' 秒，但 90 秒短剧需要「钩子/冲突/转折/卡点」四节拍。建议进入「改编剧本」点「✨ 转剧本」把小说段落压缩成可拍节拍，而不是补字数。')) + '</div>';
    }
    // 大纲扩写后：ep.source 存原梗概，ep.text 存扩写剧本；提供「原梗概」对照折叠
    var hasOrigin = (ep.source && ep.source !== ep.text);
    var originBtn = hasOrigin ? '<button class="ep-btn" data-act="origin" data-i="' + i + '">原梗概</button>' : '';
    var originBlock = hasOrigin
      ? '<div class="ep-origin" id="origin' + i + '" style="display:none;"><div class="ep-origin-label">原梗概（扩写前存档）</div>' + esc(ep.source) + '</div>'
      : '';
    var mode = ep.rewriteMode || 'rule';
    var ec = ep.eventCard;
    var hasEc = ec && (ec.core || ec.want || ec.block || ec.turn || ec.cliff);
    var eventCardHtml = hasEc
      ? '<div class="ep-event">' +
        '<div class="ep-event-head">本集戏剧事件 · AI 提取（核心事件可改）</div>' +
        '<textarea class="ep-event-core" data-i="' + i + '" placeholder="一句话核心事件（这集到底讲什么戏）">' + esc(ec.core || '') + '</textarea>' +
        '<div class="ep-event-grid">' +
        '<div class="ec-item"><span class="ec-k">想要</span><span class="ec-v">' + esc(ec.want || '—') + '</span></div>' +
        '<div class="ec-item"><span class="ec-k">阻碍</span><span class="ec-v">' + esc(ec.block || '—') + '</span></div>' +
        '<div class="ec-item"><span class="ec-k">转折</span><span class="ec-v">' + esc(ec.turn || '—') + '</span></div>' +
        '<div class="ec-item"><span class="ec-k">卡点</span><span class="ec-v">' + esc(ec.cliff || '—') + '</span></div>' +
        '</div>' +
        '</div>'
      : '<div class="ep-event empty">还没提取戏剧事件。进「改编剧本」后点「✨ 转剧本」，我从小说里提炼这一集的戏核（想要/阻碍/转折/卡点）——这一步决定 90 秒到底拍什么。</div>';
    return '<div class="ep-card" data-i="' + i + '">' +
      '<div class="ep-head">' +
      '<input class="ep-title" data-i="' + i + '" value="' + esc(ep.title) + '">' +
      '<div class="ep-meta">' +
      '<span>目标 <b>' + ep.seconds + 's</b></span>' +
      '<span>有效 <b>' + (ep.effectiveSeconds || 0) + 's</b></span>' +
      '<span>原文字数 <b>' + ep.chars + '</b></span>' +
      '<span>镜头 <b>' + ep.shotBudget + '</b></span>' +
      '<span class="ep-mode ' + mode + '">' + rewriteModeText(mode) + '</span>' +
      '</div>' +
      '<div class="ep-actions">' +
      originBtn +
      '<button class="ep-btn" data-act="toggle" data-i="' + i + '">展开/收起</button>' +
      '<button class="ep-btn primary" data-act="shots" data-i="' + i + '">分镜 →</button>' +
      '</div>' +
      '</div>' +
      warn +
      '<div class="ep-expand open" id="exp' + i + '">' +
      eventCardHtml +
      '<textarea class="ep-summary" data-i="' + i + '" placeholder="本集剧情概要（可编辑）">' + esc(ep.summary || '') + '</textarea>' +
      '<div class="ep-src">' + esc(ep.text) + '</div>' +
      originBlock +
      '</div>' +
      '</div>';
  }

  function wireSeg(p) {
    var en = (window.SW_I18N && SW_I18N.getLang() === 'en');
    var go = document.getElementById('goImport');
    if (go) go.onclick = function () { p.step = 1; save(); render(); };

    Array.prototype.forEach.call(document.querySelectorAll('.seg-tab'), function (el) {
      el.onclick = function () {
        var sec = el.getAttribute('data-sec');
        if (sec === 'custom') { p.segConfig.custom = true; }
        else { p.segConfig.custom = false; p.segConfig.seconds = parseInt(sec, 10); }
        save(); renderStep(p);
      };
    });
    var cs = document.getElementById('customSec');
    if (cs) {
      var segSug = segShotSuggestion(p);
      function refreshCustomHint() {

      refreshCustomHint();
      cs.addEventListener('input', function () {
        var v = parseInt(cs.value, 10);
        if (v >= 20) {
          p.segConfig.seconds = v; p.segConfig.custom = true; save();

            MG.confirm(en
            ? (v + 's per episode gives about ' + Math.min(40, Math.floor(v / curShotDur())) + ' shots (capped at ' + MAX_SHOTS_PER_EP + ' per episode). At your text volume, content-driven planning suggests ≤ ' + segSug.suggestedSec + 's per episode — going higher risks repetitive filler shots. Keep ' + v + 's?')
            : ('每集 ' + v + ' 秒会生成约 ' + Math.min(40, Math.floor(v / curShotDur())) + ' 镜（单集封顶 ' + MAX_SHOTS_PER_EP + ' 镜）。你的文本体量下，内容驱动建议每集 ≤ ' + segSug.suggestedSec + ' 秒，拉太高容易出现重复水镜。仍要坚持用 ' + v + ' 秒吗？'), '继续', '调回建议值').then(function (ok) {
              if (!ok) {
                var rv = Math.round(segSug.suggestedSec * 1.5);
                cs.value = rv; p.segConfig.seconds = rv; p.segConfig.custom = true; save(); refreshCustomHint();
              }
            });
          }
        }
      });
    }

    // 分集方式已合并为单一入口「按文档结构分集」，无需 data-strat 切换；每集时长由上方秒数档位控制

    var btn = document.getElementById('btnSeg');
    if (btn) btn.onclick = function () { runSegment(p, btn); };
    var enter = document.getElementById('btnEnterEp');
    if (enter) enter.onclick = function () { p.step = 4; p.curEp = 0; save(); render(); };

    Array.prototype.forEach.call(document.querySelectorAll('.ep-title'), function (el) {
      el.addEventListener('input', function () {
        var i = parseInt(el.getAttribute('data-i'), 10);

      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.ep-summary'), function (el) {
      el.addEventListener('input', function () {
        var i = parseInt(el.getAttribute('data-i'), 10);

    Array.prototype.forEach.call(document.querySelectorAll('[data-act="toggle"]'), function (el) {

      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-act="shots"]'), function (el) {
      el.onclick = function () {

      };
    });
    // 改写（转剧本）入口已统一到步骤④「改编剧本」的「✨ 转剧本」，步骤③不再提供改写按钮。
    Array.prototype.forEach.call(document.querySelectorAll('.ep-event-core'), function (el) {
      el.addEventListener('input', function () {
        var i = parseInt(el.getAttribute('data-i'), 10);
        if (!p.episodes[i].eventCard) p.episodes[i].eventCard = { core: '', want: '', block: '', turn: '', cliff: '' };
        p.episodes[i].eventCard.core = el.value; scheduleSave();
      });
    });

    // 分集大纲左导航：点击切换当前集详情，不再整页平铺滚动
    Array.prototype.forEach.call(document.querySelectorAll('.md-nav-item[data-seg]'), function (el) {
      el.onclick = function () {
        var i = parseInt(el.getAttribute('data-seg'), 10);
        if (isNaN(i) || i === p._segSel) return;
        p._segSel = i;
        save(); renderStep(p);
      };
    });
    var segSearch = document.getElementById('segSearch');
    if (segSearch) segSearch.addEventListener('input', function () {
      var q = (segSearch.value || '').trim().toLowerCase();
      Array.prototype.forEach.call(document.querySelectorAll('.md-nav-item[data-seg]'), function (it) {
        var txt = (it.textContent || '').toLowerCase();

  function runSegment(p, btn) {
    var en = (window.SW_I18N && SW_I18N.getLang() === 'en');
    var go = async function () {
      var ch = await ensureCharge('re_split', 0);
      if (!ch) return;
      btn.disabled = true;
      btn.textContent = '规划中…';
      showProgress('正在通读全作并规划分集', '先生成故事地图（叙事弧 / 转折点 / 情绪曲线），再按故事事件重要性切集，稍候…');
      // 故事地图若在配置视图已生成则复用，避免重复调用理解引擎；否则先生成
      var mapReady = p.storyMap && p.storyMap._charCount === p.script.charCount;
      var stage = mapReady ? Promise.resolve(p.storyMap) : buildStoryMap(p);
      stage.then(function () {
        return proposeEpisodes(p, p.segConfig);
      }).then(function (plan) {
        hideProgress();
        if (!plan || !plan.length) {
          MG.toast('规划失败，已降级为规则切集', 4000);
          return doSegment(p, {}).then(function () { p.segStage = 'config'; save(); renderStep(p); });
        }
        // 切出集壳后直接落库：不进评审页、不一次性批量改写全部集。
        // 转剧本（改写）统一在步骤④「改编剧本」按需进行（带全剧连续性骨架）。
        var eps = buildEpisodesFromPlan(p, plan, p.segConfig);
        return commitEpisodes(p, eps, p.episodes, p.segConfig, 'storyPlan').then(function () {
          p.segStage = 'config';
          p.storyPlan = null;
          p.storyMapBuilding = false;
          save();
          renderStep(p);
          MG.toast(en
          ? ('Split into ' + eps.length + ' episodes · click "Enter Episode 1 script"')
          : ('已切出 ' + eps.length + ' 集 · 点「进入第 1 集改编剧本」'), 3000);
        });
      }).catch(function (e) {
        hideProgress();
        btn.disabled = false;
        btn.textContent = '开始分集';
        refundLastCharge();
        alert((en ? 'Episode planning failed: ' : '分集规划失败：') + (e && e.message ? e.message : e));
      });
    };
    if (p.episodes && p.episodes.length) {
      MG.confirm('重新规划分集将覆盖当前 ' + p.episodes.length + ' 集的分集结果（已手动改过的集名/概要会尝试保留，正文会重新生成）。确定重新规划？').then(function (ok) {
        if (!ok) {
          btn.disabled = false; btn.textContent = (p.episodes.length ? '重新分集' : '开始分集');
          return;
        }
        go();
      });
      return;
    }
    go();
  }

  // 对单集调用「强制剧本化层」AI 编剧改写；成功则 ep.text 换成剧本格式、ep.source 存档原文、ep.rewriteMode='llm'
  async function runRewriteEpisode(p, i, btn, btnLabel) {
    var ep = p.episodes[i];
    if (!ep) return;
    console.log('[rewrite] start ep', i + 1, 'title', ep.title);
    var resetLabel = btnLabel || '转剧本';
    var beforeText = ep.text || '';
    btn.disabled = true;
    btn.textContent = '改写中…';
    var ch;
    try { ch = await ensureCharge('to_script', 0); } catch (e) {
      console.error('[rewrite] ensureCharge threw', e);
      btn.disabled = false; btn.textContent = resetLabel;
      MG.toast('计费校验异常：' + (e && e.message ? e.message : e), 4000);
      return;
    }
    if (!ch) {
      console.warn('[rewrite] ensureCharge returned null');
      btn.disabled = false; btn.textContent = resetLabel;
      MG.toast('计费校验未通过，本次未扣费，请刷新页面重试', 4000);
      return;
    }
    showProgress('转剧本中', '正在提取第 ' + (i + 1) + ' 集戏剧事件并改写成可拍剧本（想要/阻碍/转折/卡点），已注入全剧连续性骨架…');
    // 再加一层 150s 硬超时：即便 MG.api 内部兜底失效，本次转剧本也必须在 150s 内给结果，不再永久转圈。
    var rewriteTimeout = new Promise(function (_, reject) {
      setTimeout(function () { reject(new Error((window.SW_I18N && SW_I18N.getLang && SW_I18N.getLang() !== 'zh') ? 'Script conversion timed out (>150s)' : '转剧本整体超时（>150s）')); }, 150000);
    });
    Promise.race([
      expandOutlineToScript(p, [ep], p.segConfig),
      rewriteTimeout
    ]).then(function (res) {
      console.log('[rewrite] done ep', i + 1, 'res', res);
      hideProgress();
      btn.disabled = false;
      btn.textContent = resetLabel;
      var ok = !!(res && res.ok);
      if (ok) {
        // #725 兜底：AI 返回格式合法但 script 为空/未改写时，不能假装成功
        if (!ep.text || ep.text === beforeText || (ep.text || '').replace(/\s/g, '').length < 10) {
          ep.rewriteMode = 'rule';
          refundLastCharge();
          MG.toast('第 ' + (i + 1) + ' 集改写失败：AI 返回内容为空或太短，已退款，请重试', 5000);
          save(); renderStep(p);
          return;
        }
        ep.rewriteMode = 'llm';
        MG.toast('第 ' + (i + 1) + ' 集已改写为剧本格式', 2500);
      } else {
        ep.rewriteMode = 'rule';
        refundLastCharge();
        var reason = (res && res.fails && res.fails[0] && res.fails[0].reason) || (_swEn() ? 'Check your API Key or retry in a moment' : '可检查 API Key 或稍后重试');
        MG.toast('第 ' + (i + 1) + ' 集改写失败：' + reason, 5000);
      }
      save(); renderStep(p);
    }).catch(function (e) {
      console.error('[rewrite] catch ep', i + 1, e);
      hideProgress();
      btn.disabled = false;
      btn.textContent = resetLabel;
      refundLastCharge();
      MG.toast('第 ' + (i + 1) + ' 集改写异常：' + (e && e.message ? e.message : e), 5000);
    });
  }

  // 按故事中枢大纲「均分」正文：当中枢给出了 N 条大纲但 LLM 没给出精确段落边界（startPar/endPar 无效）时使用。
  // 若大纲条数明显撑不起正文体量（如 LLM 只返回 1 集但正文很长），则按用户设定的目标时长自动扩展集数，
  // 保证「按中枢分」仍能切出合理多集，而不是退回盲切或塌成 1 集。
  function segmentByOutlineEven(p, cfg) {
    var outline = p.bible.outline || [];
    var bodies = bodyParagraphs(p);
    if (!outline.length || !bodies.length) return null;
    var totalChars = bodies.reduce(function (a, b) { return a + ((b.text || '').replace(/\s/g, '').length); }, 0);
    var targetChars = (cfg.seconds || 90) * (cfg.charsPerSec || 6);
    var estimated = Math.max(1, Math.round(totalChars / Math.max(1, targetChars)));
    var n = outline.length;
    // 大纲条目少于估算集数且正文足够撑多集时，自动扩展；但不超过正文段数
    if (n < estimated && totalChars > targetChars * 0.7) {
      n = estimated;
    }
    if (n > bodies.length) n = bodies.length;
    var eps = [];
    for (var i = 0; i < n; i++) {
      var s = Math.floor(i * bodies.length / n);
      var e = Math.floor((i + 1) * bodies.length / n) - 1;
      if (e < s) e = s;
      if (e >= bodies.length) e = bodies.length - 1;
      var slice = bodies.slice(s, e + 1);
      var txt = slice.map(function (x) { return x.text; }).join('\n');
      var oi = mapEpisodeToArc(i, n, outline.length);
      var o = outline[oi] || outline[i] || {};
      var fallbackTitle = o.title || ('第' + cn(i + 1) + '集');
      // 大纲条目不够时，后续集标题沿用最后一个 outline 标题 + 续
      if (i >= outline.length && outline.length > 0) {
        var last = outline[outline.length - 1];
        fallbackTitle = (last.title || ('第' + cn(outline.length) + '集')) + '·续' + (i - outline.length + 1);
      }
      var ep = makeEpisode(slice.map(function (x) { return x.blockIdx; }), txt, fallbackTitle, o.summary || '', cfg, i);
      ep.outlineIndex = oi;
      ep.characters = o.characters || [];
      ep.scenes = o.scenes || [];
      ep.beats = o.beats || [];
      eps.push(ep);
    }
    return eps;
  }

  // 解析最终的分集策略：自动推荐时按「文档标题 > 设定集数 > 智能随缘」依次判定
  function resolveStrategy(p, cfg, meta) {
    var s = cfg.segStrategy || 'auto';
    if (s !== 'auto') return s;
    if (meta.episodes) return 'heading';
    if (cfg.segCount >= 1) return 'count';
    return 'free';
  }

  // 智能随缘切壳：有理解引擎则按其理解的剧情边界切，否则规则兜底；useLLM 控制是否调引擎
  function smartShell(p, bodies, cfg, blocks, useLLM) {
    if (!useLLM) return Promise.resolve(ruleSegment(bodies, cfg.seconds, cfg.charsPerSec, blocks, cfg));
    return MG.api('/api/llm', 'POST', {
      messages: segLLMMessages(bodies, cfg.seconds, cfg.charsPerSec, p.structureRef)
    }).then(function (r) {
      if (r && r.ok && !r.noKey && r.text) {
        var c = parseSeg(r.text, bodies, cfg, blocks);
        if (c && c.length) return c;
      }
      return ruleSegment(bodies, cfg.seconds, cfg.charsPerSec, blocks, cfg);
    }).catch(function () {
      return ruleSegment(bodies, cfg.seconds, cfg.charsPerSec, blocks, cfg);
    });
  }

  // 是否已是「可拍剧本」格式（场景标题 / 人物提示行 / 独立对白行），用于决定是否跳过 LLM 改写。
  // 必须严格：普通小说正文常见「他说：“……”」或动作括号，绝不能据此误判为剧本而跳过改写，
  // 否则强制剧本化层对小说内容形同虚设。只有具备剧本结构特征才允许跳过。
  function looksLikeScript(t) {
    if (!t) return false;
    var lines = t.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (lines.length < 4) return false; // 太短不足以判定，默认视为需要改写
    // 1) 场景标题：剧本以「场景 / 内景 / 外景 / INT / EXT / 镜头」等标头起段（小说几乎不会这样起段）
    var sceneHits = 0;
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      // 场景标头后必须跟分隔符或行尾（避免小说「镜头里…」误命中）；\b 对中文无效故用正向预查
      if (/^(场景|内景|外景|INT|EXT|镜头|镜号)(?=[\s·:：.]|$)/.test(l)) sceneHits++;
      else if (/^\s*(内景|外景|INT\.?|EXT\.?)\s*[.:：·]/.test(l)) sceneHits++;
    }
    if (sceneHits >= 1) return true;
    // 2) 人物提示行：短名（≤8字）独立成行，且下一行非空（剧本人物提示特征，下一行未必带冒号）
    var cue = 0;
    for (var j = 0; j < lines.length - 1; j++) {
      if (/^[（(]?[一-龥A-Za-z]{1,8}[)）]?\s*$/.test(lines[j]) && lines[j + 1]) cue++;
    }
    if (cue >= 2) return true;
    // 3) 独立对白行：引号独占一行（剧本对白常独占一行），≥3 行
    var quoteLines = 0;
    for (var k = 0; k < lines.length; k++) {
      if (/^["“「][^"”」]{1,60}["”」]\s*$/.test(lines[k])) quoteLines++;
    }
    if (quoteLines >= 3) return true;
    return false;
  }

  // 从长标题里提取简短集名（去掉「第N集」前缀与后续冗长描述）
  function cleanEpisodeTitle(title, text) {
    var t = (title || '').replace(/^第\s*[0-9零一二三四五六七八九十百千]+\s*集[\s：:·\-—]*/, '').trim();
    if (!t || t.length <= 2) {
      var ft = ((text || '').replace(/\s+/g, '').split(/[。！？!?]/)[0] || '');
      t = ft.slice(0, 14);
    }
    var cut = t.split(/[，,、；;：:\n]/)[0].trim();
    if (cut && cut.length >= 2 && cut.length <= 18) t = cut;
    if (t.length > 18) t = t.slice(0, 18);
    return t || '第1集';
  }

  // 切壳完成后的统一收尾：只落「集壳」（原正文存 ep.source、ep.text 留作待转剧本），
  // 不在此跑「一次性批量改写全部集」——转剧本统一在步骤④「改编剧本」按需进行。
  function commitEpisodes(p, eps, prevEps, cfg, mode) {
    if (!eps || !eps.length) return Promise.resolve(false);
    eps.forEach(function (ep) {
      if (!ep.source) ep.source = ep.text || '';
      ep.title = cleanEpisodeTitle(ep.title, ep.text);
      if (!ep.rewriteMode) ep.rewriteMode = 'rule';
    });
    p.episodes = eps; p.curEp = 0;

  }

  function doSegment(p, opts) {
    opts = opts || {};
    var cfg = p.segConfig;
    // 确保 blocks 已解析
    if (!p.script.blocks || !p.script.blocks.length) p.script.blocks = parseScript(p.script.raw || '');

    var prevEps = p.episodes; // 重新分集前快照，用于回灌人工编辑过的概要

    // 单入口：先按文档结构（章→场景）分集，中枢大纲可用时优先沿用
    var res = segmentByDocStructure(p, cfg);

  }

  // ===================== 集规划层（P0+P1）：故事地图 + 内容驱动切集 + 评审页 =====================

  function _clamp(v, a, b, d) { v = parseInt(v, 10); if (isNaN(v)) return d; return Math.max(a, Math.min(b, v)); }
  function _clampPct(v) { return _clamp(v, 0, 100, 0); }

  // P0：通读全作，生成故事地图（叙事弧 / 转折点 / 情绪曲线 / 建议集数），存 p.storyMap。
  // 缺失 Key 或调用失败时降级为占位对象，绝不阻断后续流程。
  function buildStoryMap(p) {
    return Promise.resolve().then(function () {
      var bodies = bodyParagraphs(p);
      if (!bodies.length) {
        p.storyMap = { generated: false, arc: '', turningPoints: [], emotionCurve: [], suggestedEpisodes: null, _charCount: p.script.charCount };
        return p.storyMap;
      }
      var fullText = bodies.map(function (b) { return b.text; }).join('\n');
      if (fullText.replace(/\s/g, '').length < 80) {
        p.storyMap = { generated: false, arc: '（正文过短，暂不生成故事地图）', turningPoints: [], emotionCurve: [], suggestedEpisodes: null, _charCount: p.script.charCount };
        return p.storyMap;
      }
      var sys = '你是资深剧作结构分析师。请通读整部作品的全文（已去除剧名/人物设定/场景设定等非正文内容），提炼全剧的叙事骨架，供后续切集与节奏规划参考。\n返回一个 JSON 对象，字段严格如下：\n{"arc":"一句话主线弧光（30字内）","turningPoints":[{"at":0-100整数(该转折在全文中相对位置的百分比),"weight":1-5整数(重要程度，5最高),"desc":"一句话描述此转折(20字内)"}],"emotionCurve":[{"at":0-100整数,"mood":"紧张/舒缓/悲/喜/悬念/燃/虐之一"}],"suggestedEpisodes":"基于全文体量与节奏，建议的总集数(整数)；若无法判断给 null"}。\n只输出 JSON，不要解释。';
      return MG.api('/api/llm', 'POST', { messages: [{ role: 'system', content: sys }, { role: 'user', content: fullText.slice(0, 14000) }] }).then(function (r) {
        if (r && r.ok && !r.noKey && r.text) {
          var obj = _extractStoryMap(r.text);
          if (obj) { obj.generated = true; obj._charCount = p.script.charCount; p.storyMap = obj; return obj; }
        }
        p.storyMap = { generated: false, arc: (r && r.noKey) ? '（通读通道没开，故事地图出不来）' : '（通读失败，这次先降级处理）', turningPoints: [], emotionCurve: [], suggestedEpisodes: null, _charCount: p.script.charCount };
        return p.storyMap;
      }).catch(function () {
        p.storyMap = { generated: false, arc: '（通读失败，这次先降级处理）', turningPoints: [], emotionCurve: [], suggestedEpisodes: null, _charCount: p.script.charCount };

  }

  function _extractStoryMap(text) {
    if (!text) return null;
    var m = text.match(/\{[\s\S]*\}/);
    if (!m) return null;
    try {
      var o = JSON.parse(m[0]);
      if (typeof o !== 'object' || !o) return null;
      o.arc = o.arc || '';
      o.turningPoints = Array.isArray(o.turningPoints)
        ? o.turningPoints.filter(function (t) { return t && (t.desc || t.at != null); }).map(function (t) { return { at: _clampPct(t.at), weight: _clamp(t.weight, 1, 5, 3), desc: String(t.desc || '') }; })
        : [];
      o.emotionCurve = Array.isArray(o.emotionCurve)
        ? o.emotionCurve.filter(function (t) { return t; }).map(function (t) { return { at: _clampPct(t.at), mood: String(t.mood || '') }; })
        : [];
      o.suggestedEpisodes = (typeof o.suggestedEpisodes === 'number') ? o.suggestedEpisodes : null;
      return o;
    } catch (e) { return null; }
  }

  // P1：喂故事地图 + 全正文 + 目标时长，LLM 按故事事件重要性切集；无 Key 降级 legacy 并诚实标注。
  // P1：长篇小说按"故事事件重要性"内容驱动切集。
  // 关键修复：早期实现只把 fullText.slice(0,16000) 直送 LLM，返回的计划永远无法覆盖全部正文段落，
  // 导致 _planCovers 必败 → _fallbackPlan → 按 540 字/集机械打包 → 14 万字被切成 280 薄集。
  // 现改为：按绝对段号窗口化（约 16000 字/窗）逐窗通读，把故事地图建议集数按比例分摊到各窗，
  // 逐窗调 LLM 切本片段，拼接后做接缝修复，覆盖率校验（应 100% 通过），杜绝薄集与漏覆盖。
  function proposeEpisodes(p, cfg) {
    var bodies = bodyParagraphs(p);
    if (!bodies.length) return Promise.resolve([]);
    var map = p.storyMap || { arc: '', turningPoints: [] };
    var target = cfg.seconds || 90;
    var cps = cfg.charsPerSec || 6;
    var totalChars = bodies.reduce(function (a, b) { return a + ((b.text || '').replace(/\s/g, '').length); }, 0);
    // 故事地图建议集数驱动"内容切集"的目标量级，避免长篇小说被切成几百薄集
    var suggested = (map && map.suggestedEpisodes > 0) ? map.suggestedEpisodes : 0;
    if (!suggested) suggested = Math.max(8, Math.min(80, Math.round(totalChars / (target * cps))));
    var mapStr = '全剧主线：' + (map.arc || '（无）') + '\n' +
      '已识别转折点：' + (map.turningPoints && map.turningPoints.length ? map.turningPoints.map(function (t) { return t.at + '%·' + t.desc; }).join('；') : '（无）') + '\n' +
      '建议集数：' + suggested + ' 集（请以该量级为准按故事事件切集，不强求精确等于该数，允许弹性伸缩）';

    // 按段落边界窗口化（约 16000 字/窗），保证每窗都落在理解引擎安全长度内
    var WIN = 16000;
    var windows = [], acc = 0, start = 0;
    for (var i = 0; i < bodies.length; i++) {
      var cl = (bodies[i].text || '').replace(/\s/g, '').length;
      if (acc > 0 && acc + cl > WIN) { windows.push([start, i - 1]); start = i; acc = 0; }
      acc += cl;
    }
    if (start <= bodies.length - 1) windows.push([start, bodies.length - 1]);
    if (!windows.length) windows.push([0, bodies.length - 1]);

    function enrich(it, i) {
      var s = _clamp(it.start, 1, bodies.length, i + 1);
      var e = _clamp(it.end, s, bodies.length, bodies.length);
      var sl = bodies.slice(s - 1, e);
      var chars = sl.reduce(function (a, b) { return a + (b.text || '').replace(/\s/g, '').length; }, 0);
      var denom = target * cps;
      var density = denom > 0 ? +(chars / denom).toFixed(2) : 0;
      return {
        title: it.title || ('第' + cn(i + 1) + '集'),
        start: s, end: e,
        hook: it.hook || '', turningPoint: it.turningPoint || '', reason: it.reason || (it._winFallback ? '（这段我没分析出来，先按段落均匀兜底，不是内容规划）' : ''),
        chars: chars, density: density, fitsLength: chars >= denom * 0.5,

      };
    }

    // 单窗理解失败时的诚实兜底：把该窗段落按建议集数比例均匀切成少量集，不退化成逐段薄集
    function winFallback(w) {
      var wlen = w[1] - w[0] + 1;
      var k = Math.max(1, Math.min(wlen, Math.round(suggested * wlen / bodies.length)));
      var arr = [];
      for (var s = 0; s < k; s++) {
        var a = w[0] + Math.floor(s * wlen / k);
        var b = w[0] + Math.floor((s + 1) * wlen / k) - 1;
        if (b < a) b = a;
        if (b > w[1]) b = w[1];

      }
      return arr;
    }

    var plan = [];
    function next(wi) {
      if (wi >= windows.length) {

        if (!_planCovers(plan, bodies.length)) return _fallbackPlan(p, cfg);
        return plan.map(enrich);
      }
      var w = windows[wi];
      var wChars = 0; for (var k = w[0]; k <= w[1]; k++) wChars += (bodies[k].text || '').replace(/\s/g, '').length;
      var share = Math.max(1, Math.round(suggested * wChars / Math.max(1, totalChars)));
      var slice = bodies.slice(w[0], w[1] + 1).map(function (b, j) { return '[' + (w[0] + j + 1) + '] ' + b.text; }).join('\n');
      var sys = '你是专业短剧分集编剧。下面是一部长篇作品的【剧情正文段落】（已去除剧名/人物设定/场景设定/分集标题），每段以[全局段号]标注。请基于叙事事件的重要性（而非机械字数）把本片段切成约 ' + share + ' 集（允许按完整情节段落弹性伸缩 ±1 集），目标是全作最终约 ' + suggested + ' 集。\n\n切集铁律：\n1. 集是剧的魂，按故事转折点与情绪落点切，绝不把一个完整句子或对话拦腰截断；\n2. 每一集必须自带足量可拍素材（明确的动作、对白、场景、冲突），不要切出"只有两三百字薄内容"的空集；若某段落在叙事上确实薄弱，宁可并入相邻集，也不要单独成集；\n3. 完整覆盖本片段所有正文段落，按原文顺序、不重叠，段号必须用全局绝对段号；\n4. 本片段只是全作的一部分，你只需负责本片段内的切分，不要推断其他片段的内容。\n\n参考故事地图：\n' + mapStr + '\n\n返回一个 JSON 数组，每项：{"title":"有概括力的集名(不带第N集前缀)","start":起始全局段号,"end":结束全局段号,"hook":"本集开场钩子(一句话)","turningPoint":"本集核心转折/卡点(一句话,无则空)","reason":"为何这样切(一句话)"}。start/end 为闭区间全局段号（从1开始）。只输出 JSON，不要解释。';
      return MG.api('/api/llm', 'POST', { messages: [{ role: 'system', content: sys }, { role: 'user', content: slice }] }).then(function (r) {
        var part = (r && r.ok && !r.noKey && r.text) ? _extractPlan(r.text, bodies.length) : null;
        if (part && part.length) {
          part.forEach(function (it) {
            var s0 = it.start, e0 = it.end;
            // 若 LLM 返回的是窗口内局部段号（落在全局范围外且数值很小），平移成全局段号
            if (s0 < w[0] + 1 && s0 <= (w[1] - w[0] + 1)) s0 += w[0];
            if (e0 < w[0] + 1 && e0 <= (w[1] - w[0] + 1)) e0 += w[0];
            plan.push({
              title: it.title || '',
              start: _clamp(s0, w[0] + 1, w[1] + 1, w[0] + 1),
              end: _clamp(e0, w[0] + 1, w[1] + 1, w[1] + 1),
              hook: it.hook || '', turningPoint: it.turningPoint || '', reason: it.reason || ''

      });

  }

  // 接缝修复：把各窗独立切出的片段拼成整体 [1, n] 的连续、不重叠、完整覆盖的规划
  function _repairPlan(plan, n) {
    if (!plan || !plan.length) return plan;
    plan.sort(function (a, b) { return a.start - b.start || a.end - b.end; });
    var fixed = [], cursor = 1;
    plan.forEach(function (it) {
      var s = _clamp(it.start, cursor, n, cursor);
      var e = _clamp(it.end, s, n, n);
      if (s > cursor) s = cursor; // 补缝隙：把前面未覆盖的段并入本集
      if (e < s) e = s;
      fixed.push({ title: it.title, start: s, end: e, hook: it.hook, turningPoint: it.turningPoint, reason: it.reason, _winFallback: it._winFallback });
      cursor = e + 1;
    });
    if (fixed.length) {
      fixed[0].start = 1;
      fixed[fixed.length - 1].end = n;
    }
    for (var i = 1; i < fixed.length; i++) {

      if (fixed[i].end > n) fixed[i].end = n;
    }

  }

  function _extractPlan(text, n) {
    if (!text) return null;
    var m = text.match(/\[[\s\S]*\]/);
    if (!m) return null;
    try {
      var a = JSON.parse(m[0]);
      if (!Array.isArray(a)) return null;
      a = a.filter(function (it) { return it && it.start != null && it.end != null; });
      return a.length ? a : null;
    } catch (e) { return null; }
  }

  // 校验规划是否完整、不重叠、按序覆盖全部正文段落
  function _planCovers(plan, n) {
    if (!plan || !plan.length) return false;
    if (plan[0].start !== 1 || plan[plan.length - 1].end !== n) return false;
    for (var i = 1; i < plan.length; i++) {
      if (plan[i].start !== plan[i - 1].end + 1) return false;
    }
    return true;
  }

  // 无 Key / 调用失败时的诚实降级：沿用文档结构切集，但明确标注"未做内容规划"
  function _fallbackPlan(p, cfg) {
    var res = segmentByDocStructure(p, cfg);
    var eps = res.eps || [];
    var target = (cfg.seconds || 90) * (cfg.charsPerSec || 6);
    return eps.map(function (ep, i) {
      return {
        title: ep.title, start: i + 1, end: i + 1,
        hook: '', turningPoint: '',
        reason: '（兜底方案：按文档结构和时长打包，我没做内容规划，可能偏薄）',
        chars: ep.chars, density: target > 0 ? +(ep.chars / target).toFixed(2) : 0,
        fitsLength: ep.chars >= target * 0.5,
        preview: (ep.text || '').slice(0, 260),
        _ep: ep, fallback: true
      };
    });
  }

  // 把评审通过的规划转成集壳（丢弃的集并入相邻集，绝不漏内容）
  function buildEpisodesFromPlan(p, plan, cfg) {
    var bodies = bodyParagraphs(p);
    for (var i = 0; i < plan.length; i++) {
      if (!plan[i]._discard) continue;
      var merged = false;
      for (var j = i - 1; j >= 0; j--) { if (!plan[j]._discard) { plan[j].end = plan[i].end; merged = true; break; } }
      if (!merged) { for (var k = i + 1; k < plan.length; k++) { if (!plan[k]._discard) { plan[k].start = plan[i].start; break; } } }

        ep = makeEpisode(slice.map(function (b) { return b.blockIdx; }), txt, it.title || ('第' + cn(idx + 1) + '集'), '', cfg, idx);
      }
      ep.title = it.title || ep.title;
      eps.push(ep);
      idx++;
    });
    return eps;
  }

  // 故事地图卡片（配置视图顶部展示，给用户"看着剧长出来"的锚点）
  function storyMapHtml(p) {
    if (p.storyMapBuilding) return '<div class="sm-card building"><div class="sm-head">故事地图 · 生成中</div><div class="sm-building">我在通读全作，提炼叙事弧 / 转折点 / 情绪曲线…</div></div>';
    var m = p.storyMap;
    if (!m) return '';
    var tps = (m.turningPoints || []).map(function (t) {
      return '<div class="sm-tp"><span class="sm-pct">' + t.at + '%</span><span class="sm-w sm-w' + t.weight + '">重' + t.weight + '</span><span class="sm-desc">' + esc(t.desc) + '</span></div>';
    }).join('');
    var arc = m.arc ? '<div class="sm-arc">主线：' + esc(m.arc) + '</div>' : '';
    var sug = m.suggestedEpisodes ? '<span class="sm-sug">建议约 ' + m.suggestedEpisodes + ' 集</span>' : '';
    var tpBlock = tps ? '<div class="sm-tps"><div class="sm-sub">关键转折</div>' + tps + '</div>' : '';
    var genTag = m.generated ? '' : '<span class="sm-nogen">（通读通道没开，地图暂时出不来）</span>';
    return '<div class="sm-card">' +
      '<div class="sm-head">故事地图 · 全作叙事骨架 ' + genTag + ' ' + sug + '</div>' +
      arc + tpBlock +
      '<div class="sm-hint">这是「集规划」的依据：切集时按这些转折与情绪落点落刀，让每集都自带足量可拍素材，而不是机械按字数切。</div>' +
      '</div>';
  }

  // #735：步骤④⑤集工作区顶部常驻「全剧地图」折叠细条，让改编/分镜时随时锚定全作骨架。
  // 折叠状态持久化到 p._smStripOpen；无地图时引导回步骤③生成。
  function storyMapStripHtml(p) {
    var m = p.storyMap;
    var hasMap = !!(m && !m.storyMapBuilding);
    // 默认展开：有地图直接看地图，无地图直接看「一键生成」按钮；仅当用户手动折叠时才收起
    var open = (p._smStripOpen !== false);
    var en = (window.SW_I18N && SW_I18N.getLang() === 'en');
    var head;
    if (m && m.storyMapBuilding) {
      head = en ? 'Story map · generating…' : '全剧地图 · 生成中…';
    } else if (hasMap) {
      var arc = (m.arc || (en ? 'Narrative skeleton' : '全作叙事骨架')).slice(0, 22);
      var sug = m.suggestedEpisodes ? (en ? (' · ~' + m.suggestedEpisodes + ' eps') : ' · 建议约 ' + m.suggestedEpisodes + ' 集') : '';
      var tpN = (m.turningPoints || []).length;
      head = en
        ? ('Story map: ' + arc + sug + ' · ' + tpN + ' key turning points')
        : ('全剧地图：' + arc + sug + ' · ' + tpN + ' 个关键转折');
    } else if (m && m.generated === false && !m.arc) {
      head = en ? 'Story map (read-through unavailable)' : '全剧地图（通读通道没开）';
    } else {
      head = en ? 'Story map (not generated · one click)' : '全剧地图（尚未生成 · 可一键生成）';
    }
    var caret = open ? '▾' : '▸';
    var body = open
      ? (hasMap
          ? storyMapHtml(p)
          : '<div class="sm-strip-empty">本作品尚未生成故事地图，它是切集与改编的依据。可直接在此生成：' +
            '<button class="sm-gen-btn" data-sm-gen="1">生成故事地图</button>' +
            '<span class="sm-strip-sub">生成后本细条会自动展开，无需回到步骤③。</span></div>')
      : '';
    return '<div class="sm-strip' + (open ? ' open' : '') + '" id="smStrip">' +
      '<div class="sm-strip-head" data-sm-toggle="1">' +
        '<span class="sm-caret">' + caret + '</span>' +
        '<span class="sm-strip-ic">图</span>' +
        '<span class="sm-strip-title">' + esc(head) + '</span>' +
        '<span class="sm-strip-tip">全剧地图 · 切集/改编依据</span>' +
      '</div>' +
      (body ? '<div class="sm-strip-body">' + body + '</div>' : '') +
      '</div>';
  }

  // 按故事中枢大纲切集：当大纲每项都有有效 startPar/endPar 且完整覆盖正文时，严格按边界切
  function segmentByOutline(p, cfg) {
    var outline = p.bible.outline || [];
    var bodies = bodyParagraphs(p);
    if (!outline.length || !bodies.length) return null;
