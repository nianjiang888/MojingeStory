      if (r && r.ok && !r.noKey && r.text) {
        var parsed = parseWorldResponse(r.text);
        if (parsed) { mergeWorld(p.bible.world, parsed); p.bible.world._gen = true; save(); }
      }
      // 失败 / 无 Key：留空，用户可手动填写；不阻断细节 pass
    }).catch(function () { /* 不阻断细节 pass */ });
  }

    var assetLine = dnaBlockHtml(sec, it, i) + d3BlockHtml(sec, it, i);
    return '<div class="bible-card" data-i="' + i + '">' +
      '<button class="item-del" data-sec="' + sec + '" data-i="' + i + '">×</button>' +
      '<div class="card-titlebar" data-card-fold><span class="fold-ico">▼</span>' + titlebar + '</div>' +
      '<div class="card-body">' + bodyParts.join('') + refLine + assetLine + '</div>' +
      '</div>';
  }

  function bibleBlank(sec) {
    var sc = BIBLE_SCHEMA[sec];
    var o = {};
    sc.fields.forEach(function (f) { o[f.k] = (f.k === 'tags') ? [] : ''; });
    return o;
  }

  function wireCentral(p) {
    var rb = document.getElementById('btnRebuildBible');
    if (rb) rb.onclick = function () { runRebuildBible(p, rb); };

    var sfBtn = document.getElementById('btnStoryFlow');
    if (sfBtn) sfBtn.onclick = function () { openStoryFlow(p); };

    var rnBtn = document.getElementById('btnRelNet');
    if (rnBtn) rnBtn.onclick = function () { openRelNet(p); };

    var envBtn = document.getElementById('btnGenEnv');
    if (envBtn) envBtn.onclick = function () { genSceneEnvironments(p, envBtn); };

    var tidyBtn = document.getElementById('btnTidyBible');
    if (tidyBtn) tidyBtn.onclick = function () { tidyBibleLLM(p, tidyBtn); };

    // 规则模式回灌基础大纲（Fix 3）：从已有分集回灌定魂契约，避免故事中枢空空如也
    var bfBtn = document.getElementById('btnBackfillOutline');
    if (bfBtn) bfBtn.onclick = function () { backfillOutlineFromEpisodes(p); };

    // 区块折叠：点击标题栏收起/展开，但点击「+ 添加」按钮不触发折叠（箭头靠 CSS 旋转）
    Array.prototype.forEach.call(document.querySelectorAll('[data-fold]'), function (el) {
      el.addEventListener('click', function (ev) {
        if (ev.target.closest('[data-add]') || ev.target.closest('[data-add-outline]')) return;
        var secEl = el.closest('.bible-section');
        if (!secEl) return;
        secEl.classList.toggle('collapsed');
      });
    });

    // 单张卡片折叠：点击人物/场景等卡片标题栏收起/展开，但点击 × 删除按钮不触发折叠
    Array.prototype.forEach.call(document.querySelectorAll('[data-card-fold]'), function (el) {
      el.addEventListener('click', function (ev) {
        if (ev.target.closest('.item-del')) return;
        var card = el.closest('.bible-card');
        if (card) card.classList.toggle('collapsed');
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-bk]'), function (el) {
      var tag = el.tagName.toLowerCase();
      var ev = (tag === 'textarea' || tag === 'input') ? 'input' : 'change';
      el.addEventListener(ev, function () {
        var sec = el.getAttribute('data-sec');
        var i = parseInt(el.getAttribute('data-i'), 10);
        var k = el.getAttribute('data-bk');
        var v = el.value;
        if (!p.bible[sec]) p.bible[sec] = [];
        if (!p.bible[sec][i]) p.bible[sec][i] = {};
        if (k === 'tags') p.bible[sec][i].tags = v.split(/[、,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
        else p.bible[sec][i][k] = v;
        scheduleSave();
        // 姓名实时回显标题栏，消除「条目 N 不让改名」的观感
        if (k === 'name') {
          var cardEl = el.closest('.bible-card');
          if (cardEl) {
            var cn = cardEl.querySelector('.cname');
            if (cn) cn.textContent = v || ('条目 ' + (i + 1));
          }
        }
      });
    });

    // 总纲层 world 字段编辑：保存并标记为用户已改（重生成时保留该字段）
    Array.prototype.forEach.call(document.querySelectorAll('[data-wk]'), function (el) {
      var tag = el.tagName.toLowerCase();
      var ev = (tag === 'textarea' || tag === 'input') ? 'input' : 'change';
      el.addEventListener(ev, function () {
        var k = el.getAttribute('data-wk');
        if (!p.bible.world) p.bible.world = {};
        if (!p.bible.world._user) p.bible.world._user = {};
        p.bible.world[k] = el.value;
        p.bible.world._user[k] = true;
        scheduleSave();
      });
    });

    // 第五批：全局风格卡字段编辑直接写回 p.styleCard
    Array.prototype.forEach.call(document.querySelectorAll('[data-sck]'), function (el) {
      el.addEventListener('input', function () {
        if (!p.styleCard) p.styleCard = {};
        p.styleCard[el.getAttribute('data-sck')] = el.value;
        scheduleSave();
      });
    });
    var scBtn = document.getElementById('btnGenStyleCard');
    if (scBtn) scBtn.onclick = function () { genStyleCard(p, scBtn); };

    // 人物 DNA 档案：字段编辑直接写回 it.dna
    Array.prototype.forEach.call(document.querySelectorAll('[data-dnak]'), function (el) {
      el.addEventListener('input', function () {
        var i = parseInt(el.getAttribute('data-i'), 10);
        var k = el.getAttribute('data-dnak');
        var arr = p.bible.characters || [];
        if (!arr[i]) return;
        if (!arr[i].dna) arr[i].dna = {};
        arr[i].dna[k] = el.value;
        scheduleSave();
      });
    });

    // 场景三段描写：字段编辑直接写回 it.desc3
    Array.prototype.forEach.call(document.querySelectorAll('[data-d3k]'), function (el) {
      el.addEventListener('input', function () {
        var i = parseInt(el.getAttribute('data-i'), 10);
        var k = el.getAttribute('data-d3k');
        var arr = p.bible.scenes || [];
        if (!arr[i]) return;
        if (!arr[i].desc3) arr[i].desc3 = {};
        arr[i].desc3[k] = el.value;
        scheduleSave();
      });
    });

    // 生成按钮：DNA 档案 / 场景三段
    Array.prototype.forEach.call(document.querySelectorAll('[data-dna]'), function (el) {
      el.onclick = function () {
        el.disabled = true; el.textContent = '生成中…';
        genCharacterDNAInWB(p, 'characters', parseInt(el.getAttribute('data-dna'), 10), el);
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-d3]'), function (el) {
      el.onclick = function () {
        el.disabled = true; el.textContent = '生成中…';
        genSceneDesc3(p, 'scenes', parseInt(el.getAttribute('data-d3'), 10), el);
      };
    });

    Array.prototype.forEach.call(document.querySelectorAll('.item-del'), function (el) {
      el.onclick = function () {
        var sec = el.getAttribute('data-sec');
        var i = parseInt(el.getAttribute('data-i'), 10);
        if (p.bible[sec]) p.bible[sec].splice(i, 1);
        save(); renderStep(p);
      };
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-add]'), function (el) {
      el.onclick = function () {
        var sec = el.getAttribute('data-add');
        // 人物 / 场景区：走「AI 一键找回」——填个名字让引擎从原剧抽回整套设定
        if (sec === 'characters' || sec === 'scenes') { addRecoverItem(p, sec); return; }
        if (!p.bible[sec]) p.bible[sec] = [];
        var nb = bibleBlank(sec);
        nb._added = true; // BUG5：标记为手动添加，暂未命名也显示，命名后自然通过校验
        p.bible[sec].push(nb);
        save(); renderStep(p);
      };
    });

    // 人物生产资产（DNA / 三视图 / 配音声音）已统一收口到Storywright「人物锁脸」单一人物板，
    // 故事中枢不再挂载任何 .ca-btn[data-ca] 生产按钮。

    // 大纲（故事中枢定魂契约）编辑
    Array.prototype.forEach.call(document.querySelectorAll('[data-out]'), function (el) {
      el.addEventListener('input', function () {
        var i = parseInt(el.getAttribute('data-i'), 10);
        var k = el.getAttribute('data-out');
        var v = el.value;
        if (!p.bible.outline) p.bible.outline = [];
        if (!p.bible.outline[i]) p.bible.outline[i] = outlineBlank();
        if (k === 'seconds' || k === 'planChars') p.bible.outline[i][k] = Math.max(0, parseInt(v, 10) || 0);
        else if (k === 'characters' || k === 'scenes' || k === 'beats') p.bible.outline[i][k] = v.split(/[、,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
        else p.bible.outline[i][k] = v;
        scheduleSave();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-add-outline]'), function (el) {
      el.onclick = function () {
        if (!p.bible.outline) p.bible.outline = [];
        p.bible.outline.push(outlineBlank());
        save(); renderStep(p);
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-del-outline]'), function (el) {
      el.onclick = function () {
        var i = parseInt(el.getAttribute('data-del-outline'), 10);
        if (p.bible.outline) p.bible.outline.splice(i, 1);
        save(); renderStep(p);
      };
    });

    // 层级折叠（结构层 / 设定层）：直接切 class 并持久化，避免保存重渲染后复位
    Array.prototype.forEach.call(document.querySelectorAll('[data-layer-fold]'), function (el) {
      el.addEventListener('click', function () {
        var layer = el.closest('.central-layer');
        if (!layer) return;
        var name = layer.getAttribute('data-layer');
        var nowCollapsed = layer.classList.toggle('collapsed');
        if (!p.centralCollapsed) p.centralCollapsed = { struct: false, setting: true };
        p.centralCollapsed[name] = nowCollapsed;
        scheduleSave();
      });
    });

    // 设定层内搜索（按人物 / 场景名过滤卡片）
    var bs = document.getElementById('bibleSearch');
    if (bs) bs.addEventListener('input', function () {
      var q = (bs.value || '').trim();
      var layer = document.querySelector('.central-layer[data-layer="setting"]');
      if (!layer) return;
      Array.prototype.forEach.call(layer.querySelectorAll('.bible-card'), function (card) {
        var nameEl = card.querySelector('.cname');
        var nm = nameEl ? nameEl.textContent : '';
        card.style.display = (!q || nm.indexOf(q) >= 0) ? '' : 'none';
      });
    });

    // 大纲卡片「在分集中高亮」：跳到集工作区并高亮对应集
    Array.prototype.forEach.call(document.querySelectorAll('[data-goto-ep]'), function (el) {
      el.onclick = function () {
        var ei = parseInt(el.getAttribute('data-goto-ep'), 10);
        if (isNaN(ei)) return;
        pendingHighlightEp = ei; p.curEp = ei; p.step = 4; save(); render();
        pendingHighlightEp = -1;
      };
    });

    // 左目录（主战场导航）：点击切换右详情，不再整页长列表滚动
    Array.prototype.forEach.call(document.querySelectorAll('.md-nav-item[data-sel]'), function (el) {
      el.onclick = function () {
        var key = el.getAttribute('data-sel');
        if (key.indexOf('item:') === 0) {
          var parts = key.split(':');
          p._centralSel = { t: 'item', sec: parts[1], i: parseInt(parts[2], 10) };
        } else if (key.indexOf('sec:') === 0) {
          p._centralSel = { t: 'sec', sec: key.slice(4) };
        } else if (key === 'overview') p._centralSel = { t: 'overview' };
        else if (key === 'epmap') p._centralSel = { t: 'epmap' };
        else if (key === 'world') p._centralSel = { t: 'world' };
        else if (key === 'style') p._centralSel = { t: 'style' };
        save(); renderStep(p);
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-back-sec]'), function (el) {
      el.onclick = function () {
        p._centralSel = { t: 'sec', sec: el.getAttribute('data-back-sec') };
        save(); renderStep(p);
      };
    });
    var cs = document.getElementById('centralSearch');
    if (cs) cs.addEventListener('input', function () {
      var q = (cs.value || '').trim().toLowerCase();
      Array.prototype.forEach.call(document.querySelectorAll('.md-nav-item'), function (it) {
        var txt = (it.textContent || '').toLowerCase();
        it.style.display = (!q || txt.indexOf(q) >= 0) ? '' : 'none';
      });
    });
  }

  function fullScriptText(p) {
    if (p.episodes && p.episodes.length) {
      return p.episodes.map(function (e) {
        return (e.title ? '# ' + e.title + '\n' : '') + (e.text || '');
      }).join('\n\n');
    }
    return (p.script && p.script.raw) || '';
  }

  // 故事中枢：AI 一键找回单个人物/场景——从整部剧本原文按名称抽回完整设定
  function recoverMessages(text, name, sec) {
    var isChar = (sec === 'characters');
    var schema = isChar
      ? '  {\n' +
        '    "name":"人物全名或文中真实称呼（须与原文一致）",\n' +
        '    "role":"主角 / 反派 / 配角",\n' +
        '    "aliases":"文中对 TA 的其它称呼，用、分隔（如 奶奶、林奶奶、老太太），没有则留空",\n' +
        '    "appearance":"【定妆描述·最关键】具体到能照着画出来：性别、年龄段、发型与发色、五官特点、体型、上衣/下装/鞋的颜色与款式、随身物品、气质神态。文中没写的结合时代/季节/天气/身份合理补全，禁止留空或笼统",\n' +
        '    "costume":"服装锁定 token，如 灰蓝工装+黑长裤+白帆布鞋，全片统一",\n' +
        '    "traits":"性格形容词（全片统一，抑制漂移）",\n' +
        '    "speechStyle":"说话风格",\n' +
        '    "mustNotChange":"全片不许变化的外貌/标志物",\n' +
        '    "arc":"一句话弧光（从 X 到 Y）",\n' +
        '    "tags":["标签"]\n' +
        '  }'
      : '  {\n' +
        '    "name":"具体空间/地点（如 公主府东厢卧房·内景·清晨）",\n' +
        '    "details":"【场景定妆·综合】把下面的堪景单七项凝成一段可直接用于 AI 生图的综合描述，禁止留空或笼统",\n' +
        '    "spatialLayout":"空间布局：面积/朝向/几进几出/左右前后关系",\n' +
        '    "architecture":"建筑形制与材质等级（如 金丝楠梁柱/云锦帐幔）",\n' +
        '    "furnitureList":"陈设清单及各自材质（如 紫檀拔步床/鎏金香炉）",\n' +
        '    "materials":"材质等级与色彩，必须匹配总纲物料等级体系该身份档位：公主房=皇家物料+暖金朱红，绝不可破屋/普通木",\n' +
        '    "lightSource":"主光源与时段光线",\n' +
        '    "props":"标志性道具",\n' +
        '    "atmosphere":"整体氛围与情绪",\n' +
        '    "tone":"色调与氛围"\n' +
        '  }';
    var sys = '你是专业短剧编剧与故事架构师。下面是整部剧本原文。用户想找回（补录）一个具体的' +
      (isChar ? '人物' : '场景') + '，名字叫「' + name + '」。\n\n' +
      '请通读全文，找到与该名字相关的' + (isChar ? '人物' : '场景') + '，提取其完整设定。\n\n' +
      '【返回格式】只输出一个 JSON 对象，不要任何解释：\n' + schema + '\n\n' +
      '【要求】\n' +
      '1. 若原文用不同称呼指代同一' + (isChar ? '人' : '场景') + '（如「奶奶」「林奶奶」「老太太」），把其它称呼都收进 aliases，name 用最具体的一个；若原名就是称呼，name 直接用该称呼。\n' +
      '2. appearance / details 必须详尽到可直接用于 AI 生图并保持前后一致，这是短剧质量的命门，不可省略、不可笼统；若为场景，spatialLayout / architecture / furnitureList / materials / lightSource / props / atmosphere 七项堪景单也必须全部非空，materials 必须匹配人物身份对应的总纲物料等级档位。\n' +
      '3. 若原文中确实找不到该' + (isChar ? '人物' : '场景') + '，或这个名字只是代词/泛称而无具体角色，请返回 {"found":false}。';
    return [{ role: 'system', content: sys }, { role: 'user', content: text }];
  }

  function parseSingleBible(text, sec) {
    try {
      var m = text.match(/(\{[\s\S]*\})/);
      if (!m) return null;
      var raw = JSON.parse(m[0]);
      if (!raw || raw.found === false) return null;
      if (sec === 'characters') {
        if (!raw.name) return null;
        var aliases = (typeof raw.aliases === 'string') ? raw.aliases
          : (Array.isArray(raw.aliases) ? raw.aliases.join('、') : '');
        return {
          name: raw.name || '',
          role: raw.role || '',
          aliases: aliases,
          appearance: raw.appearance || '',
          costume: raw.costume || '',
          traits: raw.traits || '',
          speechStyle: raw.speechStyle || '',
          mustNotChange: raw.mustNotChange || '',
          arc: raw.arc || '',
          tags: Array.isArray(raw.tags) ? raw.tags
            : (raw.tags ? String(raw.tags).split(/[、,，]/).map(function (s) { return s.trim(); }).filter(Boolean) : [])
        };
      } else if (sec === 'scenes') {
        if (!raw.name) return null;
        return {
          name: raw.name || '', details: raw.details || '', tone: raw.tone || '',
          spatialLayout: raw.spatialLayout || '', architecture: raw.architecture || '',
          furnitureList: raw.furnitureList || '', materials: raw.materials || '',
          lightSource: raw.lightSource || '', props: raw.props || '', atmosphere: raw.atmosphere || ''
        };
      }
      return null;
    } catch (e) { return null; }
  }

  function recoverSingle(p, sec, name) {
    return new Promise(function (resolve) {
      var full = fullScriptText(p);
      if (!full.trim()) { resolve(null); return; }
      showProgress('正在从原剧找回「' + name + '」', '我回原稿里翻这个' + (sec === 'characters' ? '人物' : '场景') + '的设定，提出来补上。');
      MG.api('/api/llm', 'POST', { messages: recoverMessages(full, name, sec) }, 60000).then(function (r) {
        hideProgress();
        if (r && r.ok && !r.noKey && r.text) {
          resolve(parseSingleBible(r.text, sec));
        } else if (r && r.noKey) {
          MG.toast('我这边写作通道没接上，先给你建了张空白卡片，可以手动补录');
          resolve(null);
        } else {
          resolve(null);
        }
      }).catch(function () {
        hideProgress();
        resolve(null);
      });
    });
  }

  function addRecoverItem(p, sec) {
    MG.prompt('准备找回谁？填人物/场景名（如 奶奶、老宅、林小满）', '', {
      title: (sec === 'characters' ? 'AI 找回人物' : 'AI 找回场景')
    }).then(function (name) {
      if (name == null) return; // 用户取消
      name = String(name).trim();
      if (!name) { MG.toast('未填写名称'); return; }
      recoverSingle(p, sec, name).then(function (obj) {
        if (!p.bible[sec]) p.bible[sec] = [];
        if (obj && obj.name) {
          obj._added = true; // 保证即便名字是「奶奶」这类称谓也正常显示
          p.bible[sec].push(obj);
          save(); renderStep(p);
          MG.toast('已从原剧找回「' + obj.name + '」');
        } else {
          // 降级：预填名称的空白卡片，避免「条目 N」观感
          var nb = bibleBlank(sec);
          nb.name = name;
          nb._added = true;
          p.bible[sec].push(nb);
          save(); renderStep(p);
          MG.toast('未在原文中找到「' + name + '」，已为你新建空白卡片，可手动补录');
        }
      });
    });
  }

  function bibleLLMMessages(text, ctx) {
    var ctxBlock = ctx ? '【已确认的统一设定（必须严格沿用，不要改写任何一个字）】\n' + ctx + '\n\n' : '';

      ctxBlock +
      '【返回格式】只输出 JSON，不要解释：\n{\n' +
      '  "characters": [\n' +
      '    {\n' +
      '      "name":"人物全名（须与文中出现一致，仅限真实人物，严禁填入叙事片段、代词、动作描述或整句，如「皱着鼻子」「有股旧旧的味」「它」「但」都不是人物）",\n' +
      '      "role":"主角 / 反派 / 配角",\n' +

          var m = r.text.match(/(\{[\s\S]*\})/); if (!m) throw 0;
          var j = JSON.parse(m[0]);
          if (Array.isArray(j.charClusters) && j.charClusters.length) applyCharClusters(p, j.charClusters);
          if (Array.isArray(j.sceneClusters) && j.sceneClusters.length) applySceneClusters(p, j.sceneClusters);
        } catch (e) {}
      }
      finishTidy(p, btn, beforeChars, beforeScenes, !!(r && !r.noKey));
    }).catch(function () {
      hideProgress();
      if (btn) { btn.disabled = false; btn.textContent = '整理故事中枢（合并重复人物/场景）'; }

  function rebuildBible(p, parsed) {
    if (!p.bible) p.bible = defaultProject('').bible;
    p.bible.characters = mergeBibleItems(p.bible.characters, parsed.characters, ['name'], function (existing, cand) {
      ['age', 'role', 'appearance', 'costume', 'traits', 'speechStyle', 'mustNotChange', 'arc', 'voice'].forEach(function (k) { if (!existing[k]) existing[k] = cand[k] || ''; });
      if (!existing.tags || !existing.tags.length) existing.tags = (cand.tags && cand.tags.length) ? cand.tags : [];
      return existing;
    }).filter(function (c) { return c && isValidCharacterName(c.name); });
    p.bible.scenes = mergeBibleItems(p.bible.scenes, parsed.scenes, ['name'], function (existing, cand) {
      ['details', 'tone', 'spatialLayout', 'architecture', 'furnitureList', 'materials', 'lightSource', 'props', 'atmosphere'].forEach(function (k) { if (!existing[k]) existing[k] = cand[k] || ''; });
      return existing;
    });
    tidyCharacters(p); tidyScenes(p);
    BIBLE_SECS.slice(2).forEach(function (sec) { // relations/foreshadow/hiddenLines/beats/auditRules
      var base = p.bible[sec] || [];
      var seen = {};
      base.forEach(function (it) { seen[JSON.stringify(it)] = true; });
      (parsed[sec] || []).forEach(function (it) {

  function parseCentralResponse(text) {
    try {
      var m = text.match(/(\{[\s\S]*\})/);
      if (!m) return null;
      var raw = JSON.parse(m[0]);
      var outline = Array.isArray(raw.outline) ? raw.outline.map(function (o, i) {
        o = o || {};
        var s = parseInt(o.startPar, 10), e = parseInt(o.endPar, 10);
        return {
          title: o.title || ('第' + cn(i + 1) + '集'),
          summary: o.summary || '',
          characters: Array.isArray(o.characters) ? o.characters.filter(Boolean) : [],
          scenes: Array.isArray(o.scenes) ? o.scenes.filter(Boolean) : [],
          beats: Array.isArray(o.beats) ? o.beats.filter(Boolean) : [],
          seconds: parseInt(o.seconds, 10) || 90,
          planChars: parseInt(o.planChars, 10) || (parseInt(o.seconds, 10) || 90) * 6,
          startPar: isNaN(s) ? -1 : s,
          endPar: isNaN(e) ? -1 : e
        };
      }) : [];
      return {
        outline: outline,
        characters: Array.isArray(raw.characters) ? raw.characters.filter(function (c) { return c && isValidCharacterName(c.name); }).map(function (c) {
          // LLM 约定 aliases 为「用、分隔」的字符串，归一化为数组，避免下游 (c.aliases||[]).forEach 报错
          c.aliases = (typeof c.aliases === 'string') ? c.aliases.split(/[、,，]/).map(function (x) { return x.trim(); }).filter(Boolean) : (Array.isArray(c.aliases) ? c.aliases : []);
          return c;
        }) : [],
        scenes: Array.isArray(raw.scenes) ? raw.scenes.map(function (sc) {
          sc = sc || {};
          return {
            name: sc.name || '', details: sc.details || '', tone: sc.tone || '',
            spatialLayout: sc.spatialLayout || '', architecture: sc.architecture || '',
            furnitureList: sc.furnitureList || '', materials: sc.materials || '',
            lightSource: sc.lightSource || '', props: sc.props || '', atmosphere: sc.atmosphere || ''
          };
        }) : [],
        relations: Array.isArray(raw.relations) ? raw.relations : [],
        foreshadow: Array.isArray(raw.foreshadow) ? raw.foreshadow : [],
        hiddenLines: Array.isArray(raw.hiddenLines) ? raw.hiddenLines : [],
        beats: Array.isArray(raw.beats) ? raw.beats : [],
        auditRules: Array.isArray(raw.auditRules) ? raw.auditRules : []
      };
    } catch (e) { return null; }
  }

  // 大纲合并：保留用户已编辑的标题/概要，结构性字段（人物/场景/情节点/时长/边界）以新生成覆盖
  function mergeOutline(existing, candidates) {
    existing = existing || [];
    candidates = candidates || [];
    var out = [];
    for (var i = 0; i < candidates.length; i++) {
      var cand = candidates[i] || {};
      var ex = existing[i] || {};
      var keepTitle = (ex.title && ex.title.trim() && ex.title !== ('第' + cn(i + 1) + '集')) ? ex.title : (cand.title || ('第' + cn(i + 1) + '集'));
      var keepSummary = (ex.summary && ex.summary.trim()) ? ex.summary : (cand.summary || '');
      out.push({
        title: keepTitle,
        summary: keepSummary,
        characters: cand.characters || ex.characters || [],
        scenes: cand.scenes || ex.scenes || [],
        beats: cand.beats || ex.beats || [],
        seconds: cand.seconds || ex.seconds || 90,
        planChars: cand.planChars || ex.planChars || (cand.seconds || 90) * 6,
        startPar: (typeof cand.startPar === 'number' && cand.startPar > 0) ? cand.startPar : (ex.startPar || -1),
        endPar: (typeof cand.endPar === 'number' && cand.endPar > 0) ? cand.endPar : (ex.endPar || -1)
      });
    }
    return out;
  }

  function mergeCentral(p, parsed) {
    if (!p.bible) p.bible = defaultProject('').bible;
    p.bible.outline = mergeOutline(p.bible.outline, parsed.outline);
    // 人物 / 场景：沿用 mergeBibleItems（保留已填字段、补全空字段、追加新条目）
    p.bible.characters = mergeBibleItems(p.bible.characters, parsed.characters, ['name'], function (existing, cand) {
      ['age', 'role', 'appearance', 'costume', 'traits', 'speechStyle', 'mustNotChange', 'arc', 'voice'].forEach(function (k) { if (!existing[k]) existing[k] = cand[k] || ''; });
      if (!existing.tags || !existing.tags.length) existing.tags = (cand.tags && cand.tags.length) ? cand.tags : [];
      return existing;
    }).filter(function (c) { return c && isValidCharacterName(c.name); });
    p.bible.scenes = mergeBibleItems(p.bible.scenes, parsed.scenes, ['name'], function (existing, cand) {
      ['details', 'tone', 'spatialLayout', 'architecture', 'furnitureList', 'materials', 'lightSource', 'props', 'atmosphere'].forEach(function (k) { if (!existing[k]) existing[k] = cand[k] || ''; });
      return existing;
    });
    tidyCharacters(p); tidyScenes(p);
    BIBLE_SECS.slice(2).forEach(function (sec) {
      var base = p.bible[sec] || [];
      var seen = {};
      base.forEach(function (it) { seen[JSON.stringify(it)] = true; });
      (parsed[sec] || []).forEach(function (it) {
        var key = JSON.stringify(it);
        if (!seen[key]) { base.push(it); seen[key] = true; }
      });
      p.bible[sec] = base;
    });
  }

  // 规则兜底：无理解引擎时，按已有分集标题抽取大纲（无法抽取边界时留空，由分集阶段按字数切）
  function ruleCentral(p, text) {
    var blocks = (p.script && p.script.blocks) || parseScript(p.script.raw || '');
    var meta = scriptMetaSummary(p);
    var outline = [];
    if (meta.episodes) {
      var cur = null;
      blocks.forEach(function (b) {
        if (b.type === 'episode') {
          if (cur) outline.push(cur);
          cur = { title: b.text.replace(/^[#【\s]+|[】\s]+$/g, '').trim() || ('第' + cn(outline.length + 1) + '集'), summary: '', characters: [], scenes: [], beats: [], seconds: 90, planChars: 540, startPar: -1, endPar: -1 };
        } else if (b.type === 'body' && cur) {
          cur.text = (cur.text ? cur.text + '\n' : '') + b.text;
        }
      });
      if (cur) outline.push(cur);
      outline.forEach(function (o) { o.chars = (o.text || '').replace(/\s/g, '').length; });
    }
    p.bible.outline = outline;
  }

  // 规则模式回灌：当故事中枢未生成大纲（规则模式或空 outline）但已有分集时，
  // 从分集回灌一份基础定魂契约（每集→一条大纲），让集工作区与故事中枢不再整片「暂无对应大纲」。
  // 不覆盖已有大纲；后续点【AI 通读】会用理解引擎大纲按索引合并覆盖（mergeOutline 按 candidates 长度重建）。
  function backfillOutlineFromEpisodes(p) {
    if ((p.bible.outline || []).length) { MG.toast('故事中枢已有大纲，无需回灌。', 2800); return; }
    var eps = p.episodes || [];
    if (!eps.length) { MG.toast('还没有分集，无法回灌。请先完成步骤③分集大纲。', 3200); return; }
    var cps = (p.segConfig && p.segConfig.charsPerSec) || 6;
    p.bible.outline = eps.map(function (ep, i) {
      var secs = ep.seconds || 90;
      return {
        title: ep.title || ('第' + cn(i + 1) + '集'),
        summary: ep.summary || '',
        characters: ep.characters || [],
        scenes: ep.scenes || [],
        beats: ep.beats || [],
        seconds: secs,
        planChars: Math.round(secs * cps),
        startPar: -1, endPar: -1
      };
    });
    mapOutlineByIndex(p); // 回灌后立即按多对一重映射，使每集都能解析出本集大纲
    p.centralReady = true;
    if (!p.centralMode) p.centralMode = 'rule';
    save();
    var en = (window.SW_I18N && SW_I18N.getLang() === 'en');
    var btnLabelEn = (p.centralReady || p.centralMode) ? 'Re-read & Rebuild Story Bible' : 'Create Story Bible';
    MG.toast(en
      ? ('Backfilled a basic outline (binding contract) from ' + eps.length + ' episode(s). Click "' + btnLabelEn + '" to generate a fuller outline.')
      : ('已从 ' + eps.length + ' 集回灌基础大纲（定魂契约）。点【' + centralBtnLabel(p) + '】可生成更完整的大纲。'), 4200);
    renderStep(p);
  }

  // 统一的「生成故事中枢」入口：先试理解引擎，失败/无 Key 走规则
  function runCentralGeneration(p, text) {
    text = text || (p.script.raw || '');
    if (!text.trim()) { p.centralReady = true; p.centralMode = 'rule'; p.bible.outline = []; save(); updateCentralStatusDOM(p); return Promise.resolve(); }
    var bodies = bodyParagraphs(p);
    var totalChars = (text || '').replace(/\s/g, '').length;
    // Stage0：先生成/刷新「总纲层 world」（全作仅一次，防漂移），再跑细节 pass；world 作为锁定 ctx 注入细节 pass
    function runDetails() {
      // 短文：单次通读（保留原 startPar/endPar 边界契约）
      if (totalChars <= 14000 || !bodies.length) {
        return MG.api('/api/llm', 'POST', { messages: centralLLMMessages(text, buildBibleContext(p)) }).then(function (r) {
          if (r && r.ok && !r.noKey && r.text) {
            var parsed = parseCentralResponse(r.text);
            if (parsed) { p._centralGenErr = null; mergeCentral(p, parsed); p.centralReady = true; p.centralMode = 'llm'; save(); updateCentralStatusDOM(p); return; }
            p._centralGenErr = { err: '通读返回的格式没读懂' };
          } else {
            p._centralGenErr = { noKey: !!(r && r.noKey), err: (r && r.err) || '通读没跑成功' };
          }
          ruleCentral(p, text); p.centralReady = true; p.centralMode = 'rule'; save(); updateCentralStatusDOM(p);
        }).catch(function (e) {
          p._centralGenErr = { err: '网络错误，通读没响应' + (e && e.message ? '：' + e.message : '') };
          ruleCentral(p, text); p.centralReady = true; p.centralMode = 'rule'; save(); updateCentralStatusDOM(p);
        });
      }
      // 长文（如 14 万字小说）：按段落窗切片，逐窗通读后聚合，避免一次性整本直送理解引擎超时 →
      // 静默降级 ruleCentral（不抽人物/场景，导致「中枢什么都没有」）。单窗失败只跳过该窗，不全盘降级。
      var WIN = 14000;
      var windows = [];
      var cur = [], curChars = 0, startAbs = 1;
      bodies.forEach(function (b, i) {
        var len = (b.text || '').replace(/\s/g, '').length;
        if (curChars > 0 && curChars + len > WIN) { windows.push({ startAbs: startAbs, list: cur }); cur = []; curChars = 0; startAbs = i + 1; }
        cur.push(i + 1); curChars += len;
      });
      if (cur.length) windows.push({ startAbs: startAbs, list: cur });
      var jobs = windows.map(function (w, wi) {
        var wtext = w.list.map(function (abs) { return '[' + abs + '] ' + bodies[abs - 1].text; }).join('\n');
        var partCtx = '本片段为全作第 ' + w.startAbs + ' 段起的连续片段（共 ' + windows.length + ' 个切片）';
        return MG.api('/api/llm', 'POST', { messages: centralLLMMessages(wtext, buildBibleContext(p), partCtx) }).then(function (r) {
          if (r && r.ok && !r.noKey && r.text) return parseCentralResponse(r.text);
          return null;
        }).catch(function () { return null; });
      });
      return Promise.all(jobs).then(function (parts) {
        var ok = parts.filter(Boolean);
        if (!ok.length) { p._centralGenErr = { err: '通读分段都没跑成功，已按规则兜底' }; ruleCentral(p, text); p.centralReady = true; p.centralMode = 'rule'; save(); updateCentralStatusDOM(p); return; }
        mergeCentralParts(p, ok);
        p._centralGenErr = null; // 多窗通读已成功，后续结构扫描失败不阻断中枢
        // 全剧结构扫描：用已合并的全剧大纲（覆盖整部作品）独立抽取 foreshadow/hiddenLines/beats，
        // 解决长文按窗切片时「窗口视角」抽不出跨集伏笔/暗线的问题（权威全剧视角覆盖窗口碎片结果）
        var ol = (p.bible.outline || []).map(function (o, i) {
          return '第' + (i + 1) + '集：' + (o.title || '') + (o.summary ? ('（' + o.summary + '）') : '') +
            (o.beats && o.beats.length ? (' 情节点：' + o.beats.join('、')) : '');
        }).join('\n');
        return MG.api('/api/llm', 'POST', { messages: structureScanMessages(ol, buildBibleContext(p)) }, 60000).then(function (r) {
          if (r && r.ok && !r.noKey && r.text) {
            var m = r.text.match(/(\{[\s\S]*\})/);
            if (m) {
              try {
                var j = JSON.parse(m[0]);
                ['foreshadow', 'hiddenLines', 'beats'].forEach(function (sec) {
                  if (Array.isArray(j[sec]) && j[sec].length) p.bible[sec] = j[sec];
                });
              } catch (e) {}
            }
          }
          p.centralReady = true; p.centralMode = 'llm'; save(); updateCentralStatusDOM(p);
        }).catch(function () {
          p.centralReady = true; p.centralMode = 'llm'; save(); updateCentralStatusDOM(p);
        });
      });
    }
    return runWorldGeneration(p, text).then(runDetails);
  }

  // 全剧结构扫描：以「已合并的全剧大纲」为唯一输入（非片段），专门产出 foreshadow / hiddenLines / beats，
  // 强制全剧视角，禁止空数组，解决长文按窗切片时跨集伏笔/暗线天然抽不出的问题
  function structureScanMessages(outlineStr, ctx) {
    var ctxBlock = ctx ? '【已确认的统一设定（必须严格沿用）】\n' + ctx + '\n\n' : '';
    var sys = '你是专业短剧编剧与故事架构师。下面是一部剧的【全剧大纲】（已覆盖整部作品全部集数，不是片段）。请基于全剧视角，专门产出三项"结构层契约"——它们服务后续分镜的前后呼应，必须由全剧视角抽取，禁止返回空数组：\n\n' +
      ctxBlock +
      '【返回格式】只输出 JSON，不要解释：\n{\n' +
      '  "foreshadow": [{"plantEp":"埋设集数","payoffEp":"回收集数","summary":"伏笔内容","thread":"所属暗线名（不可空）"}],\n' +
      '  "hiddenLines": [{"name":"暗线名","chars":["涉及人物"],"summary":"这条暗线讲什么","nodes":["关键节点/出现集数"]}],\n' +
      '  "beats": [{"act":"幕/阶段（如 起/承/转/合 或 第一幕/第二幕/第三幕）","event":"关键情节点"}]\n}\n\n' +
      '【硬要求】\n' +
      '1. foreshadow：至少 3 条，覆盖全剧主要伏笔（含跨集埋设—回收的），plantEp / payoffEp / thread 不可空。\n' +
      '2. hiddenLines：至少 2 条，覆盖全剧人物动机类暗线，chars / nodes 不可空。\n' +
      '3. beats：按幕/阶段结构覆盖全剧，每幕至少 1 个关键情节点；含 act 与 event。\n' +
      '4. 这是全剧视角（大纲已含全部集），不是片段视角，务必跨集抽取，禁止空数组。';
    return [{ role: 'system', content: sys }, { role: 'user', content: '【全剧大纲】\n' + (outlineStr || '（无大纲）') }];
  }

  // 多窗通读的聚合：各窗大纲顺序拼接；人物/场景按名逐窗合并去重；其余契约段去重追加
  function mergeCentralParts(p, parts) {
    if (!p.bible) p.bible = defaultProject('').bible;
    var outl = [];
    parts.forEach(function (parsed) { (parsed.outline || []).forEach(function (o) { outl.push(o); }); });
    p.bible.outline = outl;
    parts.forEach(function (parsed) {
      p.bible.characters = mergeBibleItems(p.bible.characters, parsed.characters || [], ['name'], function (existing, cand) {
        ['age', 'role', 'appearance', 'costume', 'traits', 'speechStyle', 'mustNotChange', 'arc', 'voice'].forEach(function (k) { if (!existing[k]) existing[k] = cand[k] || ''; });
        if (!existing.tags || !existing.tags.length) existing.tags = (cand.tags && cand.tags.length) ? cand.tags : [];
        return existing;
      }).filter(function (c) { return c && isValidCharacterName(c.name); });
      p.bible.scenes = mergeBibleItems(p.bible.scenes, parsed.scenes || [], ['name'], function (existing, cand) {
        ['details', 'tone', 'spatialLayout', 'architecture', 'furnitureList', 'materials', 'lightSource', 'props', 'atmosphere'].forEach(function (k) { if (!existing[k]) existing[k] = cand[k] || ''; });
        return existing;
      });
    });
    tidyCharacters(p); tidyScenes(p);
    BIBLE_SECS.slice(2).forEach(function (sec) {
      var base = p.bible[sec] || []; var seen = {}; base.forEach(function (it) { seen[JSON.stringify(it)] = true; });
      parts.forEach(function (parsed) { (parsed[sec] || []).forEach(function (it) { var key = JSON.stringify(it); if (!seen[key]) { base.push(it); seen[key] = true; } }); });
      p.bible[sec] = base;
    });
  }

  // 进入故事中枢时触发（不阻塞渲染）；busy 守卫防止重渲染并发多次通读
  function ensureCentral(p) {
    if (p.centralReady || p._centralGenBusy) return;
    p._centralGenBusy = true;
    // 生成完成后若仍在步骤②，自动重渲染该步骤（无需手动刷新才显示总纲层）—— #697
    runCentralGeneration(p, p.script.raw).then(function () { p._centralGenBusy = false; if (p.step === 2) renderStep(p); }).catch(function () { p._centralGenBusy = false; if (p.step === 2) renderStep(p); });
  }

  // 规则兜底：尽量按段落分镜，并简单提取对白/人物，避免一个引号一镜
  function extractDialogue(text) {
    var m = text.match(/["""]([^"""]+)["""]/);
    return m ? m[1] : '';
  }
  function extractChars(text) {
    var chars = [], re = /([\u4e00-\u9fa5]{1,6})(?:说|道|问|喊|叫|答|回|低语|喃喃)/g, m;
    while ((m = re.exec(text)) !== null) { if (chars.indexOf(m[1]) === -1) chars.push(m[1]); }
    // 英文小说：Name + speech verb（Chen Feng said / A Bao asked）——中文正则对英文文本零命中，
    // 不补这条，无 key 的英文 demo 分镜会全部丢失人物字段。
    var re2 = /\b([A-Z][a-zA-Z]+(?:\s+[A-Z][a-zA-Z]+)?)\s+(?:said|says|asked|replied|answered|shouted|whispered|muttered|called|added|continued|went on)\b/g;
    while ((m = re2.exec(text)) !== null) {
      var nm2 = m[1].trim();
      if (nm2 && chars.indexOf(nm2) === -1) chars.push(nm2);
    }
    return chars;
  }
  // 从叙事片段抽"画面动作"——剔除时间标志、抽掉"在……站着"这类背景铺垫，只保留"人+做"。
  // 控制在 50 字以内，绝不允许把整段叙事照搬给 action（否则 enrichPrompt 会把 narrative 当成画面）。
  function paintableAction(grp) {
    var t = (grp || '').replace(/["""][^"""]*["""]/g, '').replace(/\s+/g, ' ').trim();
    // 截取 1-2 个核心动作短语，避免整段叙事灌进来
    var first = t.split(/[，。！？；]/)[0] || t;
    var act = first.length <= 60 ? first : (first.slice(0, 60) + '…');
    if (!act) act = (t.length <= 60 ? t : t.slice(0, 60) + '…');
    return act;
  }

  // 从叙事里嗅探地点作为场景标题
  function paintableScene(grp, idx) {
    var m = (grp || '').match(/([^，。、 ]{1,8}(?:站台|站口|车站|候车室|候车棚|站前|站前广场|铁轨|月台|车厢|车顶|桥|路|街|巷|院子|院中|房子|屋子|房间|室内|室外|楼|酒吧|饭店|茶馆|酒馆|办公室|城|村|山|河|湖|海|大楼|屋外|窗外|城口|渡口|码口))/);
    if (m) return m[1];
    var _en = (window.SW_I18N && SW_I18N.getLang && SW_I18N.getLang() !== 'zh');
    return (_en ? 'Scene ' : '场景 ') + (idx + 1);
  }

  // 从叙事里嗅探音效/配乐（仅当叙事明显含标志词时）
  function paintableSound(grp) {
    var t = grp || '';
    var _en = (window.SW_I18N && SW_I18N.getLang && SW_I18N.getLang() !== 'zh');
    var h = [];
    if (/雪|雪片|雪花|飘雪/.test(t)) h.push(_en ? 'Faint snow pellets landing' : '细碎雪粒落物声');
    if (/雨|淋|湿/.test(t)) h.push(_en ? 'Steady rain' : '细密雨声');
    if (/风|刮风|冷风|寒风/.test(t)) h.push(_en ? 'Wind' : '风声');
    if (/铁轨|火车|列车|车鸣|汽笛|鸣笛/.test(t)) h.push(_en ? 'Train whistle and rail rhythm' : '火车汽笛与铁轨节奏');
    if (/广播|喇叭|话筒|扩音器/.test(t)) h.push(_en ? 'Distant PA echo' : '远处广播回响');
    if (/钟|钟声/.test(t)) h.push(_en ? 'Bell' : '钟声');
    if (/笑声|笑/.test(t)) h.push(_en ? 'Distant voices' : '远景人声');
    return h.slice(0, 2).join(_en ? ', ' : '，');
  }

  // 画面化 prompt：场景 + 人物(外貌) + 动作 + 光线 + 景别 + 画风，**绝不直接复用 action 文本**
  function paintablePrompt(s, ctx) {
    var _en = (window.SW_I18N && SW_I18N.getLang && SW_I18N.getLang() !== 'zh');
    var sep = _en ? ', ' : '，';
    var parts = [];
    parts.push(s.scene);
    if (s.chars && s.chars.length) {
      var charParts = [];
      for (var i = 0; i < s.chars.length; i++) {
        var nm = s.chars[i];
        var info = lookupCharInContext(nm, ctx || '');
        charParts.push(info ? nm + (_en ? ' (' + info + ')' : '（' + info + '）') : nm);
      }
      parts.push(charParts.join(_en ? ' and ' : '、') + (_en ? ' in frame' : '在画面中'));
    }
    if (s.action) parts.push(s.action);
    if (s.light) parts.push(s.light);
    parts.push(s.camera || (_en ? 'Medium close-up' : '近景'));
    // 摄影语言层（硬性扩写：胶片+画幅+焦距+镜头+构图+质感）
    parts.push(_en
      ? '35mm film grain, anamorphic widescreen aspect ratio, volumetric light, rim light, shallow depth of field, ' +
        'dramatic composition, soft halation, Panavision lens character, high detail, realistic fabric and material texture'
      : '35mm 胶片颗粒，变形宽银幕画幅，体积光，立体光，浅景深，' +
        '戏剧性构图，柔和光晕，Panavision 镜头质感，高细节，逼真的服装面料与材质');
    // 风格层（按项目风格注入）
    var styleWords = styleWordsFor((window.__storywrightCurrentStyle || ''), '');
    if (styleWords) parts.push(styleWords);
    // 收尾
    parts.push(_en ? 'cinematic frame, realistic style' : '电影感画面，写实风格');
    var out = parts.join(sep);
    // 长度护栏：扩写后还 < 150 字，说明扩写维度不够，追加更具体的视觉细节
    if (out.length < 150) {
      out += (_en ? '. Haze, dust, heat shimmer and floating particles in the air, legacy lens flare, slight chromatic aberration and lens imperfections, gritty texture, faded film colour, hard sunlight, strong backlight and side-backlight, trailer-grade frame'
        : '。空气中烟雾、尘土、热浪与漂浮颗粒，旧镜头眩光，轻微的色差与镜头瑕疵，' +
          '粗粝肌理，褪色胶片色调，强烈阳光，强逆光与侧逆光，电影预告片画面');
    }
    return out;
  }

  // 视频 prompt：在 paintablePrompt 基础上加 镜头运动 + 时间轴分段 + 角色标签映射，**绝不等于 prompt**
  function paintableVideoPrompt(s, ctx) {
    var _en = (window.SW_I18N && SW_I18N.getLang && SW_I18N.getLang() !== 'zh');
    var sep = _en ? ', ' : '，';
    var base = paintablePrompt(s, ctx);
    var styleWords = styleWordsFor((window.__storywrightCurrentStyle || ''), '');
    var baseFull = base + (styleWords ? sep + styleWords : '');
    var mapping = (s.chars || []).map(function (nm) {
      var info = lookupCharInContext(nm, ctx || '');
      return nm + (info ? (_en ? ' (' + info + ')' : '（' + info + '）') : '');
    }).join(_en ? ' + ' : ' + ');
    if (s.dialogue) {
      // 含对白：人物特写固定机位为主，前段对白时长内不切不推拉
      var timeline = _en
        ? '[0-3s] Close-up on ' + (s.chars && s.chars[0] || 'the lead') + ', locked camera with subtle breathing;' +
          '[3-7s] Dialogue continues, camera locked, faint breathing;' +
          '[7-10s] Closing gesture or environmental延伸'
        : '[0-3秒] 近景特写 ' + (s.chars && s.chars[0] || '人物') + ' 神情，镜头固定，呼吸起伏;' +
          '[3-7秒] 延续对白，镜头固定，轻微呼吸;' +

      var cb = mask.querySelector('#mgProgressCancel');
      if (cb) cb.onclick = onCancel;
    }
    // 强制重排后再加 show，触发淡入
    void mask.offsetWidth;
    mask.classList.add('show');
  }
  function hideProgress() {
    var mask = document.getElementById('mgProgressMask');
    if (!mask) return;
    mask.classList.remove('show');
    setTimeout(function () { if (mask.parentNode) mask.parentNode.removeChild(mask); }, 220);
  }

  // #717 分镜生成 · 非阻塞浮动面板：不锁全屏，可收起继续操作；取消即时中断在飞请求
  function showShotGenPanel(opts) {
    hideShotGenPanel();
    var _en = (window.SW_I18N && SW_I18N.getLang && SW_I18N.getLang() !== 'zh');
    var panel = document.createElement('div');
    panel.id = 'mgShotGenPanel';
    panel.className = 'mg-shotgen-panel';
    var estTxt;
    if (opts.estHigh < 60) estTxt = _en ? ('About ' + opts.estLow + '–' + opts.estHigh + ' seconds') : ('预计 ' + opts.estLow + '–' + opts.estHigh + ' 秒');
    else estTxt = _en ? ('About ' + (Math.round(opts.estLow / 6) / 10) + '–' + (Math.round(opts.estHigh / 6) / 10) + ' minutes') : ('预计 ' + (Math.round(opts.estLow / 6) / 10) + '–' + (Math.round(opts.estHigh / 6) / 10) + ' 分钟');
    panel.innerHTML =
      '<div class="sg-head">' +
        '<div class="sg-title">' + (_en ? 'Generating shots (background)' : '分镜生成中（后台）') + '</div>' +
        '<button class="sg-toggle" id="sgToggle">' + (_en ? 'Collapse ▾' : '收起 ▾') + '</button>' +
        '<button class="sg-cancel" id="sgCancel">' + (_en ? 'Cancel' : '取消') + '</button>' +
      '</div>' +
      '<div class="sg-body" id="sgBody">' +
        '<div class="sg-meta">' + (_en ? (opts.total + ' chunks · ' + opts.concur + ' in parallel · ' + estTxt) : ('共 <b>' + opts.total + '</b> 段 · 并发 <b>' + opts.concur + '</b> · ' + estTxt)) + '</div>' +
        '<div class="sg-sub" id="sgSub">' + (_en ? 'Reading chunk 1…' : '正在理解第 1 段…') + '</div>' +
        '<div class="sg-bar"><div class="sg-fill" id="sgFill"></div></div>' +
        '<div class="sg-tip">' + (_en ? 'You can collapse this and keep working — finished shots are saved into the storyboard automatically. Cancel any time.' : '可点「收起」继续其他操作，完成后自动存入分镜脚本；也可随时「取消」。') + '</div>' +
      '</div>';
    document.body.appendChild(panel);
    var cancel = panel.querySelector('#sgCancel');
    if (cancel && opts.onCancel) cancel.onclick = opts.onCancel;
    var toggle = panel.querySelector('#sgToggle');
    if (toggle) toggle.onclick = function () {
      var hidden = panel.classList.toggle('collapsed');
      toggle.textContent = hidden ? (_en ? 'Expand ▴' : '展开 ▴') : (_en ? 'Collapse ▾' : '收起 ▾');
    };
    // 计时器：显式展示已用时间，给用户明确的「进度在进行」反馈（替代旧的「假死」焦虑）
    panel._startTs = Date.now();
    panel._timer = setInterval(function () {
      var el = panel.querySelector('#sgSub');
      if (!el || panel.classList.contains('collapsed')) return;
      var sec = Math.round((Date.now() - panel._startTs) / 1000);
      var mm = Math.floor(sec / 60), ss = sec % 60;
      var t = _en ? ((mm > 0 ? (mm + 'm ') : '') + ss + 's') : ((mm > 0 ? (mm + ' 分 ') : '') + ss + ' 秒');
      el.textContent = _en ? ('Elapsed ' + t + ' · ' + estTxt) : ('已用时 ' + t + ' · ' + estTxt);
    }, 1000);
  }
  function updateShotGenPanel(done, total) {
    var fill = document.querySelector('#mgShotGenPanel #sgFill');
    if (fill) { var pct = total ? Math.round(done / total * 100) : 0; fill.style.width = pct + '%'; }
  }
  function hideShotGenPanel() {
    var panel = document.getElementById('mgShotGenPanel');
    if (!panel) return;
    if (panel._timer) clearInterval(panel._timer);
    if (panel.parentNode) panel.parentNode.removeChild(panel);
  }

  /* ============ 启动 ============ */
  /* 左侧主线流程栏收起 / 展开（任务：侧栏占用内容区太宽，可折叠让位） */
  (function () {
    var sb = document.getElementById('sidebar');
    var tg = document.getElementById('sbToggle');
    if (!sb || !tg) return;
    var saved = null;
    try { saved = localStorage.getItem('wb_sb_hidden'); } catch (e) {}
    if (saved === '1') { sb.classList.add('sb-hidden'); tg.textContent = '展开栏'; }
    tg.onclick = function () {
      var hidden = sb.classList.toggle('sb-hidden');
      tg.textContent = hidden ? '展开栏' : '收起栏';
      try { localStorage.setItem('wb_sb_hidden', hidden ? '1' : '0'); } catch (e) {}
    };
  })();
  document.getElementById('btnLoginGate').onclick = function () {
    MG.openLogin(function () { enterApp(); });
  };
  var _appEntered = false;
  function enterApp() {
    if (_appEntered) return;
    _appEntered = true;
    document.getElementById('loginGate').style.display = 'none';
    document.getElementById('mainContent').style.display = 'flex';
    load();
    loadPriceInfo();  // #700 拉取峰谷时段，刷新计费文案
    MG.renderTopbar({
      active: 'workbench',
      getProject: function () { return state.current; },
      onBeforeNavigate: function () { return save(); }
    });
  }
  function showGate() { var g = document.getElementById('loginGate'); if (g) g.style.display = 'flex'; }
  /* 本地开源版：无账号体系，跳过登录校验直接进入 */
  enterApp();
})();
</script>
</body>
</html>
